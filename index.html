      { type: "paragraph", text: "Chop your 7\" slab into 6 pieces. Use a piping bag and cut a small hole at the end, then pipe side to side, working downwards on each brownie slab. This is to replicate the bandages of a mummy on the brownie." },
      { type: "paragraph", text: "Add 2 little eyeball sprinkles (or you can use white fondant balls with black dots) to create the eyes yourself." },
      { type: "paragraph", text: "These are really easy to create but super fun for kids & Halloween parties. You could also cut these in half again & create mini versions which are just as good!" },
      { type: "image", key: "fall_mummy", caption: "Mummified brownies, ready to box up." },
      { type: "heading", text: "Cookie Inspo" },
      { type: "paragraph", text: "All cookie recipes are already inside your cookie bundle." },
      { type: "paragraph", text: "These are the ones I’d be adding to my menu for fall & winter." },
      { type: "paragraph", text: "I’ll always include my Biscoff cookies too because that is a year-round best seller!" },
      { type: "image-row", items: [
        { key: "fall_cookie_redvelvet", caption: "Blood Red Velvet (a more spooky name for Halloween)." },
        { key: "fall_cookie_cinnamon", caption: "Cinnamon Swirl — perfect for fall, winter & Christmas time." }
      ]},
      { type: "image", key: "fall_cookie_maple", caption: "Maple & Pecan — another winter warmer." },
      { type: "heading", text: "Cupcakes" },
      { type: "image-row", items: [
        { key: "fall_cupcake_a", caption: "A Halloween cupcake selection box — brain, mummy, ghost and Happy Halloween toppers." },
        { key: "fall_cupcake_b", caption: "Red velvet cupcakes with a blood drizzle." }
      ]},
      { type: "paragraph", text: "I use the same basic recipe to create ALL my cupcakes & buttercream — any flavours/different designs can be added once the base batter is made." },
      { type: "paragraph", text: "My Halloween cupcakes include vanilla, chocolate & red velvet. For the chocolate, I add a small handful of choc chips to the batter with a dash of cocoa powder (I do this by eye in small stages)." },
      { type: "paragraph", text: "For the red velvet, I add cocoa powder & red food colour again by eye in small stages. I know this isn't traditional red velvet, but it hasn't let me down over the past 10 years!" },
      { type: "paragraph", text: "Once the cupcakes are baked you can get creative again. I use jam with extra red colouring to look like blood dripping across the buttercream — you can put it in a piping bag and drizzle across the cupcakes." },
      { type: "paragraph", text: "My colour theme is usually orange & purple, which I create by adding these colours to regular vanilla buttercream." },
      { type: "paragraph", text: "You can add Halloween sprinkles & chocolates on top to decorate — or the white chocolate pretzel ghouls like we used on the brownie earlier!" },
      { type: "paragraph", text: "The brain design is easy to create by cutting a small hole in your piping bag, pipe a straight line down the middle then squiggle up each side." },
      { type: "paragraph", text: "The cobwebs are also fun, I used dark midnight coloured buttercream then melted a marshmallow, stick your finger tips in the melted marshmallow (pressed together) then separate them gently laying the stringy mallow across the iced cupcake." },
      { type: "image-row", items: [
        { key: "fall_pretzel", caption: "White chocolate pretzel ghoul cupcakes." },
        { key: "fall_assort", caption: "Brain, cobweb, mummy and Happy Halloween cupcakes assorted in a box." }
      ]},
      { type: "heading", text: "Fall Flavour Variations" },
      { type: "image", key: "fall_flavour_box", caption: "Pecan Pie, Apple Crumble and Cinnamon Swirl cupcakes." },
      { type: "recipe", title: "Pecan Pie Cupcakes", items: ["Use the same base, mixing in chopped pecans and rippling a dash of maple syrup through your batter", "Bake as above, ice with vanilla buttercream, drizzle maple over the top and finish with chopped pecans"] },
      { type: "recipe", title: "Apple Crumble Cupcakes", items: [
        "Use the same base. Once the cupcakes are baked, remove the core and fill with apple compote",
        "Compote: peel & chop 3–4 apples into small cubes, add to a saucepan with 2–3 tbsp sugar, 1–2 tbsp water, and ½ tsp cinnamon. Cook on medium heat for 10–15 mins, stirring occasionally",
        "Top with vanilla buttercream and crumble chunks",
        "Crumble: mix 60g plain flour, 40g cold chopped butter, and 50g brown sugar. Rub the butter & flour together with your fingers, then stir in the sugar and chill in the fridge",
        "After 15 mins the crumble should be ready to sprinkle on your cupcakes — gently push it into the buttercream"
      ]},
      { type: "recipe", title: "Cinnamon Swirl Cupcakes", items: [
        "Use the same base, adding in ground cinnamon to your batter (add it by eye, sprinkling small amounts at a time)",
        "Bake as above, ice with vanilla buttercream, sprinkle cinnamon sugar over the top",
        "Finish with a drizzle of glaze (mix icing sugar & water together — do this by eye as it's only a small quantity)"
      ]},
      { type: "heading", text: "Spooky Selections" },
      { type: "paragraph", text: "This is where you bring together a combination of the previous products! These have been so popular with my customers, especially people purchasing them for kids." },
      { type: "paragraph", text: "They're fun and exciting because you get a little bit of everything, still keeping with the Halloween theme." },
      { type: "paragraph", text: "Below is what I included in my best sellers:" },
      { type: "list", items: [
        "2 Halloween cupcakes",
        "1 blood red velvet cookie",
        "1 cookies & scream cookie",
        "2 Halloween brownies (the second brownie is a simple brownie base with a white chocolate drizzle + Halloween sprinkles)"
      ]},
      { type: "paragraph", text: "I didn't include 2 mummified brownies because the buttercream design wouldn't have held up well in packaging." },
      { type: "paragraph", text: "You can put in your selection boxes whichever combos you fancy — try not to overcomplicate it for yourself." },
      { type: "paragraph", text: "You want it to be easy enough for you to prepare all the different products when people place an order. I decided to only offer these boxes on set days, so I could bake a load at once, rather than literally baking 2 cupcakes, 2 brownies & 2 cookies at a time (that would be so inefficient!)." },
      { type: "image", key: "fall_spooky_1", caption: "A batch of Spooky Selection boxes ready to go out." },
      { type: "image", key: "fall_spooky_2", caption: "A single Spooky Selection box — cupcake, brownie and cookies." },
      { type: "heading", text: "Bonus Info" },
      { type: "paragraph", text: "When you're designing your seasonal menu, I think it's key to have an audience in mind for your products. I had an ideal customer in mind for each of these, which meant when it came to marketing, I found it a whole lot easier." },
      { type: "paragraph", text: "If you're a little stuck in this area, I wanted to give you my target (and actual) customers who bought these items and how you can hopefully do the same." },
      { type: "list", items: [
        "Mini Cupcakes/Mini Brownies: kids, Halloween parties, sharing in the office/staffroom",
        "Halloween Cupcakes: corporate customers – Halloween lands on a Friday this year so a lot of local offices in my area arrange treats for the occasion",
        "Fall Flavours: people who already love cupcakes but really appreciate the seasonal flavours. They like the indulgence of the different flavours, vs. corporate customers/kids who are more excited by the look of the Halloween theme than the taste of it",
        "Loaded Brownies: a Halloween weekend treat, for a family to share as a dessert or even a group of friends at a gathering — easy to slice up and each take a bite",
        "Spooky Selections: also really good as a treat box for kids or the family to enjoy together — a good way to promo various products"
      ]},
      { type: "heading", text: "Getting Ready for the Year End" },
      { type: "paragraph", text: "Q4 is one of the busiest times of the year for bakers. People are wrapping things up for year-end, businesses are looking to gift their clients and treat their employees, and there are plenty of occasions to celebrate — from Halloween and Bonfire Night to Thanksgiving and beyond." },
      { type: "paragraph", text: "There are lots of reasons for people to be buying treats, so make sure you have plenty of products available for them to buy. And don’t forget to advertise! Remind your customers that you’re there and give them a reason to choose you for their next celebration, gift or sweet treat." }
    ]
  },
  "summer-pack": {
    hero: { key: "summer_hero", caption: "Summer Survival Guide — tips to help you sell and survive the heat of summer." },
    blocks: [
      { type: "paragraph", text: "Summer can be a tough season as a baker." },
      { type: "paragraph", text: "In my experience, things naturally slow down a little as people head off on holiday, spend more time outdoors and celebrate differently. It's also hard work spending hours in a hot kitchen, and if you're attending markets or making deliveries, keeping everything cool and looking its best brings its own challenges too." },
      { type: "paragraph", text: "That being said, I actually don't think summer is something to worry about. I see it as a chance to have fun with new flavours, work on the parts of your business that often get neglected during busy periods, and get yourself in a great position for the rush that usually arrives once September & the new school year rolls around." },
      { type: "paragraph", text: "There are still plenty of things happening throughout summer, you just need to focus on the products people are buying for." },
      { type: "paragraph", text: "Weddings, BBQs, garden parties, corporate events, family gatherings and birthdays all continue throughout the summer months. I always found weekends stayed much busier than weekdays, and that's completely normal." },
      { type: "image", key: "summer_2", caption: "Rainbow-swirl cupcakes boxed up for a summer order." },
      { type: "paragraph", text: "Rather than worrying about quieter weekdays, I learnt to make the most of the busy periods and accepted that my schedule naturally looked a little different during summer." },
      { type: "paragraph", text: "One of the biggest things that helped me was building relationships with local businesses. Having regular corporate customers gave me reassurance that orders would still come in, even during slower weeks. I worked with recruitment agencies and marketing agencies that regularly sent branded cupcakes to clients after completing projects. Those repeat orders became a reliable source of income and took away a lot of the stress that can come with quieter seasons." },
      { type: "paragraph", text: "Looking back through my summer orders, so many weren't from my usual retail customers at all. They were corporate events, client gifts, staff celebrations, weddings and other summer gatherings. It reminded me that the more types of customers you market to, the more opportunities you create for orders throughout the year. If you only rely on individual customers ordering for birthdays and celebrations, there will naturally be quieter periods. By expanding your audience to include businesses, events and organisations, you create multiple streams of opportunities for people to order from you." },
      { type: "paragraph", text: "Real summer order messages — corporate and event orders like these kept summer weeks steady:" },
      { type: "image", key: "summer_msg1", caption: "60-cupcake order for a Summer rainbow/Pride party" },
      { type: "image", key: "summer_msg2", caption: "48-cupcake summer-themed birthday order mixing vanilla and chocolate" },
      { type: "image", key: "summer_msg3", caption: "72 standard + 144 mini cupcake office delivery booked for a Thursday morning in August" },
      { type: "heading", text: "Introduce yourself to new customers" },
      { type: "paragraph", text: "Summer is also the perfect time to introduce yourself to potential new customers. If I was testing a new flavour or had a few spare treats, I'd deliver sample boxes to local businesses such as hospitals, police stations, estate agents and other workplaces." },
      { type: "paragraph", text: "You'd be surprised how much a surprise box of baked treats brightens someone's day, and it often led to future orders. Even if people don't order immediately, you're building relationships that could turn into bookings later in the year when the busy seasons return." },
      { type: "paragraph", text: "When I noticed my week was looking a little quiet, I'd often use my flash sale strategy to bring in a few extra weekend orders. I'd simply post something like \"2 cookie boxes available today\" across my social media. Cookies worked perfectly because I always kept dough frozen, so I could quickly bake fresh once I'd collected a few orders. Every time I used this strategy, it brought in extra sales with very little effort." },
      { type: "image", key: "summer_3", caption: "Funfetti cookies, ready to bake fresh from frozen dough for a flash sale." },
      { type: "heading", text: "Work on your business, not just in it" },
      { type: "paragraph", text: "I also think summer is one of the best times to work on your business rather than constantly working in it. Update your product photos, create content ready for the busy season, test new recipes you've been wanting to try, improve your ordering process and organise your menu. These are all the jobs that are easy to put off when you're fully booked, so use the quieter weeks to your advantage." },
      { type: "paragraph", text: "I rarely relied on discounts to generate sales. If I ever offered one, I wanted it to feel unexpected rather than something customers would wait for. Instead, I found it much more effective to create excitement around limited edition seasonal flavours that gave people a reason to order." },
      { type: "paragraph", text: "One of my favourite summer products was my Ice Cream Sundae Cupcakes. They were inspired by classic ice cream van treats, with vanilla and chocolate sponge topped with vanilla buttercream, chocolate, caramel or strawberry sauce, sprinkles and, of course, a Flake 99. They were always a huge hit with families and children during the warmer months." },
      { type: "callout", text: "As part of your original purchase, you already have my signature cupcake recipe to use with these flavour ideas." },
      { type: "image", key: "summer_4", caption: "Ice Cream Sundae Cupcakes — vanilla buttercream, sauce, sprinkles and a Flake 99." },
      { type: "heading", text: "Raspberry Ripple and Eton Mess" },
      { type: "paragraph", text: "Two other flavours that consistently sold well for me were Raspberry Ripple and Eton Mess." },
      { type: "paragraph", text: "My Eton Mess cupcakes were filled with whipped cream and homemade strawberry sauce before being topped with vanilla buttercream, crushed meringue, fresh strawberries and more strawberry sauce." },
      { type: "paragraph", text: "My Raspberry Ripple cupcakes used my classic vanilla sponge with white chocolate chips and raspberries folded through the batter, finished with raspberry ripple buttercream, a white chocolate drizzle and raspberry pieces. Both flavours felt really fresh, colourful and perfect for summer." },
      { type: "image-row", items: [
        { key: "summer_5", caption: "When I'm thinking summer flavours, I'm thinking fruity, light etc." },
        { key: "summer_6", caption: "These ones were for a summer wedding, super simple but still delicious." }
      ]},
      { type: "heading", text: "You don't need a whole new menu" },
      { type: "paragraph", text: "One thing I'd say is that you don't need to create an entirely new menu just because the seasons change. Some of my year-round products naturally felt more summery, so I simply promoted those more heavily." },
      { type: "paragraph", text: "Lemon cupcakes, Raspberry & White Choc cookies and Funfetti cookies all stayed on my menu throughout the year, but during summer they became some of my main focus products because they suited the season perfectly." },
      { type: "image-row", items: [
        { key: "summer_7a", caption: "A lemon cupcake, cross-section." },
        { key: "summer_7b", caption: "Raspberry & White Choc cookies, split." }
      ]},
      { type: "paragraph", text: "I also found mini products became much more popular during the warmer months. There's something about miniature bakes that feels lighter and easier to enjoy in summer. My mini cupcakes sold brilliantly for parties and gatherings, while mini loaded brownies were another favourite. Whether you keep them classic or decorate them with fresh berries and summery toppings, they're a great addition to your menu." },
      { type: "heading", text: "Jumping on trends (carefully)" },
      { type: "paragraph", text: "I don't usually build my business around trends, but I do think it's worth paying attention to what's happening and using it to your advantage where it makes sense." },
      { type: "paragraph", text: "When the Barbie movie came out, I quickly put together a Barbie-themed cupcake sample box, shared it on social media and ended up making over £200 from Barbie cupcakes alone. It hardly took any extra time to create, but because people were already excited about it, it gave them another reason to order. You don't have to jump on every trend, but if one fits your brand, it can be a really easy way to generate extra sales." },
      { type: "callout", text: "This one is just a super simple example!" },
      { type: "image", key: "summer_8", caption: "A simple Barbie-themed cupcake box — over £200 in sales from very little extra effort." },
      { type: "heading", text: "Extra summer tips" },
      { type: "list", items: [
        "Keep customers informed about storage — don't assume people know how to look after your products. Make it really clear whether something should be refrigerated, when it should be taken out before serving, and how long it will stay fresh. A simple storage card goes a long way.",
        "Store products in the fridge where needed — throughout summer I kept almost everything refrigerated until collection or delivery, especially cupcakes, loaded brownies and anything with buttercream or chocolate. It helped keep everything looking its best for as long as possible.",
        "Cool your car before loading your orders — I always turned the air conditioning on 5–10 minutes before leaving so the car was already cool before I loaded the cakes. A hot car can quickly soften buttercream or melt chocolate.",
        "Schedule deliveries around the weather — I tried to book collections and deliveries earlier in the morning or later in the evening rather than during the hottest part of the day. It made the journey much less stressful and helped protect the products.",
        "Choose products that cope well in warmer weather — think carefully about what you're promoting during summer. Some products simply don't travel well in the heat. I loved selling Rocky Road, but because it melts so easily, I didn't actively promote it during the warmer months.",
        "Transport cakes on a completely flat surface — summer heat makes cakes softer and more delicate. Even a slight angle in the car can cause them to slide more easily than they would in winter (I know because I've had a cake slide off its board in my car boot which was slightly uneven!).",
        "Don't be afraid to use your freezer — if your buttercream starts getting too warm or soft, just pop it into the freezer for a couple of minutes to speed up the cooling process before carrying on decorating.",
        "Keep chocolate in the fridge — during the summer I always stored my chocolate in the fridge, including chocolate decorations and toppings. It stops them softening or blooming and means they're in the best condition when you're ready to decorate.",
        "Ask customers to make your collection the last stop — remind them to make your bakery their final stop before heading home. It only takes a few minutes in a hot car for buttercream or chocolate to soften.",
        "Park in the shade whenever possible — if you're making deliveries, try to park in the shade or use covered parking where you can. Even a couple of minutes in direct sunlight can quickly heat the inside of the vehicle and affect your products."
      ]},
      { type: "heading", text: "Look after yourself too" },
      { type: "paragraph", text: "Finally, don't forget to look after yourself too. I adjusted my baking schedule during summer by baking earlier in the morning and planning collections and deliveries for cooler parts of the day wherever possible. It made the days much more manageable and helped protect my products from the heat. Most importantly, don't feel guilty about enjoying some of the summer yourself." },
      { type: "paragraph", text: "In my experience, September nearly always became busy again, so I learned to see summer as a chance to reset, improve my business and prepare for the exciting months ahead, rather than something to panic about." },
      { type: "paragraph", text: "A slower season doesn't mean your business is failing, it simply means your business is seasonal. Use this time wisely, enjoy the sunshine where you can, and trust that the busy days will come around again." },
      { type: "paragraph", text: "I hope this Summer Pack has given you some fresh ideas, reassurance and inspiration to help you make the most of the months ahead." },
      { type: "image", key: "summer_9", caption: "Mini peach-buttercream cupcakes with sugar hearts." },
      { type: "heading", text: "1:1 Baker Growth Sessions" },
      { type: "paragraph", text: "If you'd like more personalised support, I now offer 1:1 Baker Growth Sessions. They're a chance for us to dive into your business together, whether you're struggling with marketing, pricing, content, attracting more orders or simply need a fresh pair of eyes. I'll review your social media and/or website, answer your questions, help you create an action plan, and you'll also receive 7 days of follow-up support after our call, so you're not left figuring everything out on your own." },
      { type: "paragraph", text: "I'd love to help you build a bakery business that works for you—not just during the busy seasons, but all year round." },
      { type: "image", key: "summer_10", caption: "Hopping on a 1:1 Baker Growth Session call." }
    ]
  },
    "easter-pack": {
    hero: { key: "ea_01", caption: "Products & ideas to have fun this Easter!" },
    blocks: [
      { type: "heading", text: "How I Approach Easter Sales" },
      { type: "paragraph", text: "Easter is one of my favourite occasions to sell baked goods because it naturally creates excitement around themed treats. Instead of creating completely new products, I simply used seasonal Easter chocolates to give my existing best-selling items an Easter twist." },
      { type: "paragraph", text: "For example, turning a regular cookie flavour into a Mini Egg cookie (this recipe is included in the Cookie Bundle)" },
      { type: "paragraph", text: "The main idea is to keep your menu structure the same and let the toppings, mix-ins and decorations do the seasonal work. Doing it this way keeps things much simpler and fits in naturally with your everyday orders." },
      { type: "paragraph", text: "Your ingredient list stays manageable, batch baking is more efficient, and you’re not suddenly introducing lots of extra components into your kitchen just for one busy weekend." },
      { type: "paragraph", text: "Using familiar Easter chocolates like Mini Eggs, Creme Eggs, Malteser bunnies and Galaxy eggs also works really well because customers already recognise them from the supermarket." },
      { type: "paragraph", text: "That familiarity makes the products feel instantly seasonal and nostalgic, without needing complicated designs or decorations." },
      { type: "image-row", items: [{ key: "ea_02", caption: "" }, { key: "ea_03", caption: "" }] },
      { type: "heading", text: "How I Approach Easter Sales" },
      { type: "paragraph", text: "Another reason Easter sells so well is that customers don’t just buy treats for Easter Sunday itself (unlike occasions like Valentine’s Day or Mother’s Day — where orders are needed for a specific date)." },
      { type: "paragraph", text: "Orders tend to come in throughout the weeks leading up to Easter, whether people are gifting treats, bringing desserts to gatherings, or simply buying something fun to enjoy at home." },
      { type: "paragraph", text: "Because of this, it can create multiple weeks of extra sales, not just one busy weekend." },
      { type: "paragraph", text: "Most of the time, seasonal menus don’t need to be complicated — they’re simply your best-selling products with a fun seasonal twist." },
      { type: "image-row", items: [{ key: "ea_04", caption: "" }, { key: "ea_05", caption: "" }] },
      { type: "heading", text: "Easter Cupcake Menu" },
      { type: "paragraph", text: "The Easter menu was preset, but if customers wanted more of one flavour instead of another in their cupcake box, I did allow switches. If you prefer though, you can keep it as no changes allowed to make things simpler." },
      { type: "paragraph", text: "For cupcakes, I offered:" },
      { type: "list", items: ["Box of 6", "Box of 12"] },
      { type: "paragraph", text: "Here’s the exact cupcake menu I used:" },
      { type: "heading", text: "<u>Mini Egg</u>" },
      { type: "paragraph", text: "Chocolate sponge with chocolate chips, chocolate buttercream, and two different coloured Mini Eggs." },
      { type: "heading", text: "<u>Milkybar Egg</u>" },
      { type: "paragraph", text: "Vanilla sponge with white chocolate chips, vanilla buttercream, and two Milkybar white chocolate eggs." },
      { type: "heading", text: "<u>Choc Bunny</u>" },
      { type: "paragraph", text: "Malted and cocoa sponge (based on my Malteser cupcake) with crushed Maltesers and a mini chocolate bunny on top." },
      { type: "paragraph", text: "I used a mix of Malteser bunnies and KitKat bunnies, as I couldn’t always get a consistent supply of just one." },
      { type: "heading", text: "<u>Enchanted Egg</u>" },
      { type: "paragraph", text: "Chocolate sponge with chocolate chips, chocolate buttercream, chocolate ganache drizzle, and two Galaxy Enchanted Eggs." },
      { type: "heading", text: "<u>Creme Egg</u>" },
      { type: "paragraph", text: "Chocolate sponge with chocolate chips and half a frozen mini Creme Egg baked inside, topped with chocolate buttercream and half a mini Creme Egg." },
      { type: "heading", text: "Pro Tip:" },
      { type: "paragraph", text: "Mini Creme Eggs don’t have much filling drip inside. I mixed a little water and icing sugar to create my own drip and added it onto the chocolate egg before placing it on the cupcake. It makes it look like the filling is dripping from the egg. Just make sure it’s not too runny." },
      { type: "heading", text: "<u>Smartie Egg / Hershey’s Eggies</u>" },
      { type: "paragraph", text: "Vanilla sponge with vanilla buttercream and two chocolate eggs." },
      { type: "paragraph", text: "I use a Wilton 1M nozzle to ice all the cupcakes & Wilton 1A for the brownies." },
      { type: "image-row", items: [
        { key: "ea_06", caption: "" },
        { key: "ea_07", caption: "" }
      ] },
      { type: "heading", text: "Loaded Easter Brownie" },
      { type: "paragraph", text: "The Loaded Brownie used my regular brownie base with icing and a chocolate drizzle." },
      { type: "paragraph", text: "The toppings were a mix of Easter chocolates, but I like to make sure each brownie had:" },
      { type: "list", items: [
        "At least one mini bunny",
        "Half a Creme Egg",
        "A couple of Cadbury egg pieces",
        "A mix of mini hard shell eggs for colour and crunch",
        "Chocolate chips on top to finish the look"
      ] },
      
      { type: "heading", text: "Creme Egg Brownies" },
      { type: "paragraph", text: "Use the regular brownie base recipe and bake as usual with chocolate chips." },
      { type: "paragraph", text: "For a 7” brownie, chop 3 Creme Eggs in half and place one half onto each of the 6 brownies." },
      { type: "paragraph", text: "The brownie will be very warm when it comes out of the oven, so I press the Creme Egg halves in almost immediately." },
      { type: "paragraph", text: "This allows them to melt slightly into the brownie and look like they were baked inside — even though they weren’t. I personally prefer this method rather than baking them in." },
      { type: "paragraph", text: "For a 9” brownie, you’ll need 4½ Creme Eggs because there will be 9 brownie portions instead of 6." },
      { type: "image-row", items: [
        { key: "ea_08", caption: "" },
        { key: "ea_10", caption: "" }
      ] },
      { type: "heading", text: "Selection Boxes" },
      { type: "paragraph", text: "Selection boxes were some of my best-selling products during Easter." },
      { type: "paragraph", text: "Small Selection Box:" },
      { type: "list", items: ["2 cupcakes", "2 brownies", "4 rocky road"] },
      { type: "paragraph", text: "Large Selection Box:" },
      { type: "list", items: ["6 cupcakes", "6 brownies", "12 rocky road"] },
      { type: "image", key: "ea_09", caption: "" },
      { type: "paragraph", text: "The cupcakes in the selection boxes matched the Easter cupcake flavours mentioned earlier. The rocky road was my regular rocky road recipe (you’ll find this in the S’mores pack)." },
      { type: "paragraph", text: "For the brownies, I have used both:" },
      { type: "list", items: ["Regular brownies", "Creme Egg brownies"] },
      { type: "paragraph", text: "Regular brownies are easier and cheaper, but Creme Egg brownies are much more on-brand for Easter. If you decide to include the Creme Egg version, make sure you increase the price to account for the extra Creme Eggs." },
      { type: "heading", text: "Why Selection Boxes Sell So Well" },
      { type: "paragraph", text: "Selection boxes consistently sell extremely well because people love getting a bit of everything." },
      { type: "paragraph", text: "They also feel more giftable, which makes them perfect for occasions like Easter." },
      { type: "paragraph", text: "Instead of choosing just one product, customers automatically buy a higher value order that includes multiple items." },
      { type: "heading", text: "Another Fun Product Idea: Mini Cupcakes" },
      { type: "paragraph", text: "Mini cupcakes are another great option. They’re especially popular for:" },
      { type: "list", items: ["Kids", "Sharing boxes", "Offices", "Work colleagues", "Gifts"] },
      { type: "image", key: "ea_11", caption: "" },
      { type: "heading", text: "Pricing for Seasonal Products" },
      { type: "paragraph", text: "Seasonal products can be priced a little higher than your regular menu to account for the extra ingredients, toppings and time spent decorating." },
      { type: "heading", text: "When to Start Promoting Your Easter Menu" },
      { type: "paragraph", text: "Start promoting your Easter menu early enough that customers have time to order, but not so early that it feels irrelevant. Easter creates multiple weeks of sales — gifts for friends or family, treats for gatherings, desserts for Easter meals, and treats for themselves." },
      { type: "heading", text: "How to Use Slower Days to Prepare" },
      { type: "paragraph", text: "If you haven’t received many orders yet, use this time to get ahead so busy days are easier to manage." },
      { type: "paragraph", text: "Things I like to do on slower days:" },
      { type: "list", items: [
        "Prepare cookie dough in multiple flavours and store it in the freezer",
        "Build up boxes so packaging is ready to go",
        "Write out gift tags ready for busy days",
        "Restock ingredients and check what’s running low",
        "Make icing in large batches and store it in the fridge"
      ] },
      { type: "paragraph", text: "A little preparation now can make busy Easter days much less stressful." },
      { type: "image-row", items: [{ key: "ea_13", caption: "" }, { key: "ea_14", caption: "" }] },
      { type: "paragraph", text: "One thing I highly recommend is stocking up on Easter chocolates early." },
      { type: "paragraph", text: "Seasonal chocolates like Mini Eggs, Creme Eggs, Malteser bunnies and Galaxy eggs can sell out quickly in stores as Easter gets closer. If you leave it too late, you can easily end up in a situation where you have orders to fulfil but no stock available." },
      { type: "paragraph", text: "Buying these items in advance means you won’t be scrambling around different shops trying to find the ingredients you need during your busiest days." },
      { type: "heading", text: "Don’t Forget Corporate Orders" },
      { type: "paragraph", text: "Easter isn’t just about the occasion itself! It also creates lots of opportunities for customers to:" },
      { type: "list", items: ["Send gifts", "Treat their team", "Share food at work", "Surprise friends or family"] },
      { type: "paragraph", text: "Corporate orders can be a great source of larger orders. This doesn’t have to mean huge companies either." },
      { type: "image-row", items: [{ key: "ea_15", caption: "" }, { key: "ea_16", caption: "" }] },
      { type: "paragraph", text: "Here are a few real examples from my own Easter orders:" },
      { type: "list", items: [
        "A recruitment agency sent all of their temporary employees a small Easter selection box to say Happy Easter. 20+ boxes sent out = £215+ order",
        "A team leader bought Easter treats for their team to share in the office while they were away on holiday. They ordered a mixture of mini cupcakes and brownies",
        "A small company bought Easter themed treats for their employees to enjoy at work “just because”"
      ] },
      { type: "paragraph", text: "These kinds of orders can add up quickly and are definitely worth promoting when you share your Easter menu." },
{ type: "heading", text: "Final Thoughts" },
      { type: "paragraph", text: "I hope this gives you plenty of inspiration for your own Easter menu." },
      { type: "paragraph", text: "Have fun with it and enjoy the busy Easter baking! x" }
    ]
  },
  "order-tracking": {
    hero: { key: "order_hero", caption: "Boxed and ready to go out the door — every one of these was checked against the diary before baking." },
    blocks: [
      { type: "paragraph", text: "As a baker, one of my worst fears was forgetting somebody's order. So I built a system that let me take orders daily without missing one, for years on end — one that let me catch errors before they ever reached the customer." },
      { type: "paragraph", text: "It does happen — we're all human — but it can be avoided when you have the right system in place." },
      { type: "heading", text: "Where orders came in" },
      { type: "paragraph", text: "I took orders across a few different platforms, so it was important to keep track of each:" },
      { type: "list", items: ["A Shopify store that captured all the order details on my website", "A Facebook page where customers could message to order", "An Instagram page where customers could DM to order", "A business email where customers could email to place an order"] },
      { type: "paragraph", text: "Every day, each platform was checked at least twice — once at midday and once in the evening — more often if things were busy. Whilst checking, I made sure every order had all the details I needed: what they wanted, when for, whether it was collection or delivery, and confirmation of price. Corporate customers were often invoiced instead, but otherwise payment was taken at the time of ordering, so any issues get resolved immediately rather than becoming a problem later." },
      { type: "heading", text: "The paper diary backup" },
      { type: "paragraph", text: "Once I had all the details, the order went into a paper diary, noted on the collection/delivery date: the customer's full name, exactly what they ordered and the quantity, and any gift message. A 'P' next to the name meant paid — no 'P' meant payment was still required. This diary came with me everywhere and was kept up to date twice daily, so I could glance at any day and see what was booked in." },
      { type: "heading", text: "The digital calendar backup" },
      { type: "paragraph", text: "Every order also went into a digital calendar (Apple Calendar), logged on the collection/delivery date with the customer's name, delivery address, and a contact number." },
      { type: "callout", text: "Always get a contact number, no matter where the order comes in — DMs and email aren't much use when you need to reach somebody quickly." },
      { type: "heading", text: "The daily triple-check" },
      { type: "paragraph", text: "Each day I'd prepare for the day ahead by cross-checking three sources for that date: my filtered Shopify orders (where ~90% of orders came from), what was noted in the physical diary, and what was in the digital calendar." },
      { type: "callout", text: "In theory, they should all match — then I can plan what needs to be baked." },
      { type: "paragraph", text: "If there was ever a discrepancy, having three separate checkpoints meant it got caught early enough to resolve without the customer ever noticing." },
      { type: "heading", text: "One rule I never break" },
      { type: "paragraph", text: "I never wanted to take orders via personal text messages or DMs — that's where things get lost. Checking business platforms on a routine meant I always knew everybody in those messages was a customer or potential customer, without having to filter out personal conversations. If someone reaches out personally, politely redirect them to the business page. Worst case: screenshot the order and instantly email it to yourself so it doesn't get missed." }
    ]
  },
  "halloween-fall-pack": {
    hero: { key: "fall_hero", caption: "Product ideas & recipes to make this your best fall season yet — cupcakes, brownies, cookies + more." },
    blocks: [
      { type: "heading", text: "Intro" },
      { type: "paragraph", text: "As soon as September starts, we all start thinking about fall flavours and preparing for Halloween." },
      { type: "paragraph", text: "This pack is designed to give you some inspiration for the upcoming spooky season with a selection of different products you can create, either for family & friends or sell within your business." },
      { type: "paragraph", text: "I have had massive success in selling all of these products in previous years so I can't wait to share them with you!" },
      { type: "paragraph", text: "Of course, you can take these recipes and ideas and put your own spin on them — get creative & let me know what you come up with." },
      { type: "callout", text: "I would absolutely love to see it!" },
      { type: "image-row", items: [
        { key: "fall_intro_1", caption: "Halloween Loaded Brownie Slab." },
        { key: "fall_mummy", caption: "Mummified Brownies." }
      ]},
      
      { type: "heading", text: "Brownies" },
      { type: "paragraph", text: "I've got 2 options that I was torn between, so I decided to give you them both. The brownies are created with the same base recipe, it's just the decorating part that will be different." },
      { type: "heading", text: "Halloween Loaded Brownie Slab" },
      { type: "paragraph", text: "Pipe the buttercream on using a big round 1A nozzle, with 6x6 blobs of icing to cover the whole surface. Then comes the fun part, get creative!" },
      { type: "list", items: [
        "I use raspberry jam with some extra red food colouring in a piping bag to drizzle, making it look like blood.",
        "Add crushed Oreos to make it look like dirt.",
        "Add a fondant topper to say \"Happy Halloween.\"",
        "Add Halloween sweets & chocolates scattered around to give it that graveyard look.",
        "Coat pretzels with white chocolate, adding 2 eyes to make them look like ghouls."
      ]},
      { type: "image-row", items: [
        { key: "fall_brownie_1a", caption: "A finished loaded brownie slab, ready to go." },
        { key: "fall_brownie_1b", caption: "Another loaded brownie slab variation." }
      ]},
      { type: "image", key: "fall_brownie_1c", caption: "A third loaded brownie slab, decorated with gummy worms and Halloween sweets." },
      { type: "heading", text: "Mummified Brownies" },
      { type: "paragraph", text: "Chop your 7\" slab into 6 pieces. Use a piping bag and cut a small hole at the end, then pipe side to side, working downwards on each brownie slab. This is to replicate the bandages of a mummy on the brownie." },
      { type: "paragraph", text: "Add 2 little eyeball sprinkles (or you can use white fondant balls with black dots) to create the eyes yourself." },
      { type: "paragraph", text: "These are really easy to create but super fun for kids & Halloween parties. You could also cut these in half again & create mini versions which are just as good!" },
      { type: "image", key: "fall_mummy", caption: "Mummified brownies, ready to box up." },
      { type: "heading", text: "Cookie Inspo" },
      { type: "paragraph", text: "All cookie recipes are already inside your cookie bundle." },
      { type: "paragraph", text: "These are the ones I'd be adding to my menu for fall & winter." },
      { type: "paragraph", text: "I'll always include my Biscoff cookies too because it's a year round best seller!" },
      { type: "image-row", items: [
        { key: "fall_cookie_redvelvet", caption: "Blood Red Velvet (a more spooky name for Halloween)." },
        { key: "fall_cookie_cinnamon", caption: "Cinnamon Swirl — perfect for fall, winter & Christmas time." }
      ]},
      { type: "image", key: "fall_cookie_maple", caption: "Maple & Pecan — another winter warmer." },
      { type: "heading", text: "Cupcakes" },
      { type: "image-row", items: [
        { key: "fall_cupcake_a", caption: "A Halloween cupcake selection box — brain, mummy, ghost and Happy Halloween toppers." },
        { key: "fall_cupcake_b", caption: "Red velvet cupcakes with a blood drizzle." }
      ]},
      { type: "paragraph", text: "I use the same basic recipe to create ALL my cupcakes & buttercream — any flavours/different designs can be added once the base batter is made." },
      { type: "paragraph", text: "My Halloween cupcakes include vanilla, chocolate & red velvet. For the chocolate, I add a small handful of choc chips to the batter with a dash of cocoa powder (I do this by eye in small stages)." },
      { type: "paragraph", text: "For the red velvet, I add cocoa powder & red food colour again by eye in small stages. I know this isn't traditional red velvet, but it hasn't let me down over the past 10 years!" },
      { type: "paragraph", text: "Once the cupcakes are baked you can get creative again. I use jam with extra red colouring to look like blood dripping across the buttercream — you can put it in a piping bag and drizzle across the cupcakes." },
      { type: "paragraph", text: "My colour theme is usually orange & purple, which I create by adding these colours to regular vanilla buttercream." },
      { type: "paragraph", text: "You can add Halloween sprinkles & chocolates on top to decorate — or the white chocolate pretzel ghouls like we used on the brownie earlier!" },
      { type: "paragraph", text: "The brain design is easy to create by cutting a small hole in your piping bag, pipe a straight line down the middle then squiggle up each side." },
      { type: "paragraph", text: "The cobwebs are also fun, I used dark midnight coloured buttercream then melted a marshmallow, stick your finger tips in the melted marshmallow (pressed together) then separate them gently laying the stringy mallow across the iced cupcake." },
      { type: "image-row", items: [
        { key: "fall_pretzel", caption: "White chocolate pretzel ghoul cupcakes." },
        { key: "fall_assort", caption: "Brain, cobweb, mummy and Happy Halloween cupcakes assorted in a box." }
      ]},
      { type: "heading", text: "Fall Flavour Variations" },
      { type: "image", key: "fall_flavour_box", caption: "Pecan Pie, Apple Crumble and Cinnamon Swirl cupcakes." },
      { type: "recipe", title: "Pecan Pie Cupcakes", items: ["Use the same base, mixing in chopped pecans and rippling a dash of maple syrup through your batter", "Bake as above, ice with vanilla buttercream, drizzle maple over the top and finish with chopped pecans"] },
      { type: "recipe", title: "Apple Crumble Cupcakes", items: [
        "Use the same base. Once the cupcakes are baked, remove the core and fill with apple compote",
        "Compote: peel & chop 3–4 apples into small cubes, add to a saucepan with 2–3 tbsp sugar, 1–2 tbsp water, and ½ tsp cinnamon. Cook on medium heat for 10–15 mins, stirring occasionally",
        "Top with vanilla buttercream and crumble chunks",
        "Crumble: mix 60g plain flour, 40g cold chopped butter, and 50g brown sugar. Rub the butter & flour together with your fingers, then stir in the sugar and chill in the fridge",
        "After 15 mins the crumble should be ready to sprinkle on your cupcakes — gently push it into the buttercream"
      ]},
      { type: "recipe", title: "Cinnamon Swirl Cupcakes", items: [
        "Use the same base, adding in ground cinnamon to your batter (add it by eye, sprinkling small amounts at a time)",
        "Bake as above, ice with vanilla buttercream, sprinkle cinnamon sugar over the top",
        "Finish with a drizzle of glaze (mix icing sugar & water together — do this by eye as it's only a small quantity)"
      ]},
      { type: "heading", text: "Spooky Selections" },
      { type: "paragraph", text: "This is where you bring together a combination of the previous products! These have been so popular with my customers, especially people purchasing them for kids." },
      { type: "paragraph", text: "They're fun and exciting because you get a little bit of everything, still keeping with the Halloween theme." },
      { type: "paragraph", text: "Below is what I included in my best sellers:" },
      { type: "list", items: [
        "2 Halloween cupcakes",
        "1 blood red velvet cookie",
        "1 cookies & scream cookie",
        "2 Halloween brownies (the second brownie is a simple brownie base with a white chocolate drizzle + Halloween sprinkles)"
      ]},
      { type: "paragraph", text: "I didn't include 2 mummified brownies because the buttercream design wouldn't have held up well in packaging." },
      { type: "paragraph", text: "You can put in your selection boxes whichever combos you fancy — try not to overcomplicate it for yourself." },
      { type: "paragraph", text: "You want it to be easy enough for you to prepare all the different products when people place an order. I decided to only offer these boxes on set days, so I could bake a load at once, rather than literally baking 2 cupcakes, 2 brownies & 2 cookies at a time (that would be so inefficient!)." },
      { type: "image", key: "fall_spooky_1", caption: "A batch of Spooky Selection boxes ready to go out." },
      { type: "image", key: "fall_spooky_2", caption: "A single Spooky Selection box — cupcake, brownie and cookies." },
      { type: "heading", text: "Bonus Info" },
      { type: "paragraph", text: "When you're designing your seasonal menu, I think it's key to have an audience in mind for your products. I had an ideal customer in mind for each of these, which meant when it came to marketing, I found it a whole lot easier." },
      { type: "paragraph", text: "If you're a little stuck in this area, I wanted to give you my target (and actual) customers who bought these items and how you can hopefully do the same." },
      { type: "list", items: [
        "Mini Cupcakes/Mini Brownies: kids, Halloween parties, sharing in the office/staffroom",
        "Halloween Cupcakes: corporate customers – Halloween lands on a Friday this year so a lot of local offices in my area arrange treats for the occasion",
        "Fall Flavours: people who already love cupcakes but really appreciate the seasonal flavours. They like the indulgence of the different flavours, vs. corporate customers/kids who are more excited by the look of the Halloween theme than the taste of it",
        "Loaded Brownies: a Halloween weekend treat, for a family to share as a dessert or even a group of friends at a gathering — easy to slice up and each take a bite",
        "Spooky Selections: also really good as a treat box for kids or the family to enjoy together — a good way to promo various products"
      ]},
      { type: "heading", text: "Getting Ready for the Year End" },
      { type: "paragraph", text: "Q4 is one of the busiest times of the year for bakers. People are wrapping things up for year-end, businesses are looking to gift their clients and treat their employees, and there are plenty of occasions to celebrate — from Halloween and Bonfire Night to Thanksgiving and beyond." },
      { type: "paragraph", text: "There are lots of reasons for people to be buying treats, so make sure you have plenty of products available for them to buy. And don’t forget to advertise! Remind your customers that you’re there and give them a reason to choose you for their next celebration, gift or sweet treat." }
    ]
  },
  "summer-pack": {
    hero: { key: "summer_hero", caption: "Summer Survival Guide — tips to help you sell and survive the heat of summer." },
    blocks: [
      { type: "paragraph", text: "Summer can be a tough season as a baker." },
      { type: "paragraph", text: "In my experience, things naturally slow down a little as people head off on holiday, spend more time outdoors and celebrate differently. It's also hard work spending hours in a hot kitchen, and if you're attending markets or making deliveries, keeping everything cool and looking its best brings its own challenges too." },
      { type: "paragraph", text: "That being said, I actually don't think summer is something to worry about. I see it as a chance to have fun with new flavours, work on the parts of your business that often get neglected during busy periods, and get yourself in a great position for the rush that usually arrives once September & the new school year rolls around." },
      { type: "paragraph", text: "There are still plenty of things happening throughout summer, you just need to focus on the products people are buying for." },
      { type: "paragraph", text: "Weddings, BBQs, garden parties, corporate events, family gatherings and birthdays all continue throughout the summer months. I always found weekends stayed much busier than weekdays, and that's completely normal." },
      { type: "image", key: "summer_2", caption: "Rainbow-swirl cupcakes boxed up for a summer order." },
      { type: "paragraph", text: "Rather than worrying about quieter weekdays, I learnt to make the most of the busy periods and accepted that my schedule naturally looked a little different during summer." },
      { type: "paragraph", text: "One of the biggest things that helped me was building relationships with local businesses. Having regular corporate customers gave me reassurance that orders would still come in, even during slower weeks. I worked with recruitment agencies and marketing agencies that regularly sent branded cupcakes to clients after completing projects. Those repeat orders became a reliable source of income and took away a lot of the stress that can come with quieter seasons." },
      { type: "paragraph", text: "Looking back through my summer orders, so many weren't from my usual retail customers at all. They were corporate events, client gifts, staff celebrations, weddings and other summer gatherings. It reminded me that the more types of customers you market to, the more opportunities you create for orders throughout the year. If you only rely on individual customers ordering for birthdays and celebrations, there will naturally be quieter periods. By expanding your audience to include businesses, events and organisations, you create multiple streams of opportunities for people to order from you." },
      { type: "paragraph", text: "Real summer order messages — corporate and event orders like these kept summer weeks steady:" },
      { type: "image", key: "summer_msg1", caption: "60-cupcake order for a Summer rainbow/Pride party" },
      { type: "image", key: "summer_msg2", caption: "48-cupcake summer-themed birthday order mixing vanilla and chocolate" },
      { type: "image", key: "summer_msg3", caption: "72 standard + 144 mini cupcake office delivery booked for a Thursday morning in August" },
      { type: "heading", text: "Introduce yourself to new customers" },
      { type: "paragraph", text: "Summer is also the perfect time to introduce yourself to potential new customers. If I was testing a new flavour or had a few spare treats, I'd deliver sample boxes to local businesses such as hospitals, police stations, estate agents and other workplaces." },
      { type: "paragraph", text: "You'd be surprised how much a surprise box of baked treats brightens someone's day, and it often led to future orders. Even if people don't order immediately, you're building relationships that could turn into bookings later in the year when the busy seasons return." },
      { type: "paragraph", text: "When I noticed my week was looking a little quiet, I'd often use my flash sale strategy to bring in a few extra weekend orders. I'd simply post something like \"2 cookie boxes available today\" across my social media. Cookies worked perfectly because I always kept dough frozen, so I could quickly bake fresh once I'd collected a few orders. Every time I used this strategy, it brought in extra sales with very little effort." },
      { type: "image", key: "summer_3", caption: "Funfetti cookies, ready to bake fresh from frozen dough for a flash sale." },
      { type: "heading", text: "Work on your business, not just in it" },
      { type: "paragraph", text: "I also think summer is one of the best times to work on your business rather than constantly working in it. Update your product photos, create content ready for the busy season, test new recipes you've been wanting to try, improve your ordering process and organise your menu. These are all the jobs that are easy to put off when you're fully booked, so use the quieter weeks to your advantage." },
      { type: "paragraph", text: "I rarely relied on discounts to generate sales. If I ever offered one, I wanted it to feel unexpected rather than something customers would wait for. Instead, I found it much more effective to create excitement around limited edition seasonal flavours that gave people a reason to order." },
      { type: "paragraph", text: "One of my favourite summer products was my Ice Cream Sundae Cupcakes. They were inspired by classic ice cream van treats, with vanilla and chocolate sponge topped with vanilla buttercream, chocolate, caramel or strawberry sauce, sprinkles and, of course, a Flake 99. They were always a huge hit with families and children during the warmer months." },
      { type: "callout", text: "As part of your original purchase, you already have my signature cupcake recipe to use with these flavour ideas." },
      { type: "image", key: "summer_4", caption: "Ice Cream Sundae Cupcakes — vanilla buttercream, sauce, sprinkles and a Flake 99." },
      { type: "heading", text: "Raspberry Ripple and Eton Mess" },
      { type: "paragraph", text: "Two other flavours that consistently sold well for me were Raspberry Ripple and Eton Mess." },
      { type: "paragraph", text: "My Eton Mess cupcakes were filled with whipped cream and homemade strawberry sauce before being topped with vanilla buttercream, crushed meringue, fresh strawberries and more strawberry sauce." },
      { type: "paragraph", text: "My Raspberry Ripple cupcakes used my classic vanilla sponge with white chocolate chips and raspberries folded through the batter, finished with raspberry ripple buttercream, a white chocolate drizzle and raspberry pieces. Both flavours felt really fresh, colourful and perfect for summer." },
      { type: "image-row", items: [
        { key: "summer_5", caption: "When I'm thinking summer flavours, I'm thinking fruity, light etc." },
        { key: "summer_6", caption: "These ones were for a summer wedding, super simple but still delicious." }
      ]},
      { type: "heading", text: "You don't need a whole new menu" },
      { type: "paragraph", text: "One thing I'd say is that you don't need to create an entirely new menu just because the seasons change. Some of my year-round products naturally felt more summery, so I simply promoted those more heavily." },
      { type: "paragraph", text: "Lemon cupcakes, Raspberry & White Choc cookies and Funfetti cookies all stayed on my menu throughout the year, but during summer they became some of my main focus products because they suited the season perfectly." },
      { type: "image-row", items: [
        { key: "summer_7a", caption: "A lemon cupcake, cross-section." },
        { key: "summer_7b", caption: "Raspberry & White Choc cookies, split." }
      ]},
      { type: "paragraph", text: "I also found mini products became much more popular during the warmer months. There's something about miniature bakes that feels lighter and easier to enjoy in summer. My mini cupcakes sold brilliantly for parties and gatherings, while mini loaded brownies were another favourite. Whether you keep them classic or decorate them with fresh berries and summery toppings, they're a great addition to your menu." },
      { type: "heading", text: "Jumping on trends (carefully)" },
      { type: "paragraph", text: "I don't usually build my business around trends, but I do think it's worth paying attention to what's happening and using it to your advantage where it makes sense." },
      { type: "paragraph", text: "When the Barbie movie came out, I quickly put together a Barbie-themed cupcake sample box, shared it on social media and ended up making over £200 from Barbie cupcakes alone. It hardly took any extra time to create, but because people were already excited about it, it gave them another reason to order. You don't have to jump on every trend, but if one fits your brand, it can be a really easy way to generate extra sales." },
      { type: "callout", text: "This one is just a super simple example!" },
      { type: "image", key: "summer_8", caption: "A simple Barbie-themed cupcake box — over £200 in sales from very little extra effort." },
      { type: "heading", text: "Extra summer tips" },
      { type: "list", items: [
        "Keep customers informed about storage — don't assume people know how to look after your products. Make it really clear whether something should be refrigerated, when it should be taken out before serving, and how long it will stay fresh. A simple storage card goes a long way.",
        "Store products in the fridge where needed — throughout summer I kept almost everything refrigerated until collection or delivery, especially cupcakes, loaded brownies and anything with buttercream or chocolate. It helped keep everything looking its best for as long as possible.",
        "Cool your car before loading your orders — I always turned the air conditioning on 5–10 minutes before leaving so the car was already cool before I loaded the cakes. A hot car can quickly soften buttercream or melt chocolate.",
        "Schedule deliveries around the weather — I tried to book collections and deliveries earlier in the morning or later in the evening rather than during the hottest part of the day. It made the journey much less stressful and helped protect the products.",
        "Choose products that cope well in warmer weather — think carefully about what you're promoting during summer. Some products simply don't travel well in the heat. I loved selling Rocky Road, but because it melts so easily, I didn't actively promote it during the warmer months.",
        "Transport cakes on a completely flat surface — summer heat makes cakes softer and more delicate. Even a slight angle in the car can cause them to slide more easily than they would in winter (I know because I've had a cake slide off its board in my car boot which was slightly uneven!).",
        "Don't be afraid to use your freezer — if your buttercream starts getting too warm or soft, just pop it into the freezer for a couple of minutes to speed up the cooling process before carrying on decorating.",
        "Keep chocolate in the fridge — during the summer I always stored my chocolate in the fridge, including chocolate decorations and toppings. It stops them softening or blooming and means they're in the best condition when you're ready to decorate.",
        "Ask customers to make your collection the last stop — remind them to make your bakery their final stop before heading home. It only takes a few minutes in a hot car for buttercream or chocolate to soften.",
        "Park in the shade whenever possible — if you're making deliveries, try to park in the shade or use covered parking where you can. Even a couple of minutes in direct sunlight can quickly heat the inside of the vehicle and affect your products."
      ]},
      { type: "heading", text: "Look after yourself too" },
      { type: "paragraph", text: "Finally, don't forget to look after yourself too. I adjusted my baking schedule during summer by baking earlier in the morning and planning collections and deliveries for cooler parts of the day wherever possible. It made the days much more manageable and helped protect my products from the heat. Most importantly, don't feel guilty about enjoying some of the summer yourself." },
      { type: "paragraph", text: "In my experience, September nearly always became busy again, so I learned to see summer as a chance to reset, improve my business and prepare for the exciting months ahead, rather than something to panic about." },
      { type: "paragraph", text: "A slower season doesn't mean your business is failing, it simply means your business is seasonal. Use this time wisely, enjoy the sunshine where you can, and trust that the busy days will come around again." },
      { type: "paragraph", text: "I hope this Summer Pack has given you some fresh ideas, reassurance and inspiration to help you make the most of the months ahead." },
      { type: "image", key: "summer_9", caption: "Mini peach-buttercream cupcakes with sugar hearts." },
      { type: "heading", text: "1:1 Baker Growth Sessions" },
      { type: "paragraph", text: "If you'd like more personalised support, I now offer 1:1 Baker Growth Sessions. They're a chance for us to dive into your business together, whether you're struggling with marketing, pricing, content, attracting more orders or simply need a fresh pair of eyes. I'll review your social media and/or website, answer your questions, help you create an action plan, and you'll also receive 7 days of follow-up support after our call, so you're not left figuring everything out on your own." },
      { type: "paragraph", text: "I'd love to help you build a bakery business that works for you—not just during the busy seasons, but all year round." },
      { type: "image", key: "summer_10", caption: "Hopping on a 1:1 Baker Growth Session call." }
    ]
  },
    
    "mothers-day": {
    hero: { key: "md_01", caption: "Products & ideas to make your Mother's Day a success" },
    blocks: [
      { type: "heading", text: "Mother’s Day Menu Strategy" },
      { type: "paragraph", text: "Mother’s Day was always one of those occasions where the orders genuinely just kept coming in, but I never treated it like something that needed a completely new menu or loads of new ideas. If anything, I simplified things even more because I knew it was going to be busy." },
      { type: "paragraph", text: "I didn’t create brand new products specifically for Mother’s Day. I used the exact same core products that I sold all year round — cupcakes, brownies and rocky road — and just adjusted the designs slightly so they felt on theme." },
      { type: "paragraph", text: "You already have the recipes for all of these inside this bundle, which is the whole point. You don’t need to reinvent your menu every time there’s an occasion. It’s far easier to keep your products consistent and just tweak the presentation." },
      { type: "paragraph", text: "Doing it this way makes buying ingredients easier, batching easier and preparing orders so much less stressful. You’re not suddenly adding five new components into your kitchen for one weekend of sales." },
      { type: "image", key: "md_02", caption: "" },
      { type: "heading", text: "Why Mother’s Day Works So Well" },
      { type: "paragraph", text: "From my own experience, most of my customer base was naturally female, so gifting baked goods for Mum just made sense. Cupcakes and brownies are such an easy, affordable but still thoughtful gift option, especially for people who don’t really know what else to buy (you could add cookies too if you like!)" },
      { type: "paragraph", text: "When you look at it like that, you realise you’re not just selling cake. You’re offering a simple solution to someone who wants to show up with a gift and not have to think too hard about it." },
      { type: "paragraph", text: "Keeping that in mind makes it much easier when you’re talking about your products online." },
      { type: "image", key: "md_03", caption: "" },
      { type: "heading", text: "How I Structured My Menu" },
      { type: "paragraph", text: "Everything on my Mother’s Day menu was completely preset. I didn’t allow custom flavours, swaps or design changes because that’s when things start to get confusing, both for you and for the customer." },
      { type: "paragraph", text: "For cupcakes, I offered a box of 6 and a box of 12. Each box had one standard design and the flavours were always 50/50 chocolate and vanilla. I didn’t change that for anyone because once you start making exceptions, it becomes difficult to manage when orders increase." },
      { type: "paragraph", text: "The loaded brownie was one set design that was clearly shown in the product photo, and what customers saw was exactly what they got. Keeping it simple removed questions and made the ordering process much quicker." },
      { type: "paragraph", text: "I also offered two selection boxes, one small and one large. The cupcakes inside matched the themed cupcake designs, but the brownies and rocky road were just my regular, un-themed products. I didn’t feel the need to redesign absolutely everything just because it was Mother’s Day. It was still the same core menu, just presented slightly differently. That consistency is what makes occasions manageable rather than overwhelming." },
      { type: "image", key: "md_04", caption: "" },
      { type: "heading", text: "Gift Tags" },
      { type: "paragraph", text: "I allowed customers to add a gift tag to their box because a lot of orders were being sent directly to the recipient. It’s a small detail, but it makes the whole thing feel more like a proper gift rather than just a box of cakes." },
      { type: "paragraph", text: "One thing I always did was prep the gift notes and name tags ahead of time and keep them organised together. When you’re packing a large number of orders, having that done in advance makes everything run much more smoothly." },
      { type: "heading", text: "Pricing" },
      { type: "paragraph", text: "I would usually increase my seasonal items slightly, normally by £1–£2 compared to my standard menu. There’s extra time involved with toppers, presentation and packaging, and demand is higher, so it made sense to factor that in." },
      { type: "paragraph", text: "I never felt worried about doing that because these occasions are naturally busy. If someone doesn’t want to pay the price, someone else almost always will. Peak seasons are not the time to undercharge." },
      { type: "image-row", items: [{ key: "md_05", caption: "" }, { key: "md_06", caption: "" }] },
      { type: "heading", text: "Collections and Boundaries" },
      { type: "paragraph", text: "I always set specific collection/delivery windows, usually one on the Saturday morning and one on the Sunday morning. This helped split the workload and stopped me being tied to the kitchen all weekend waiting for people to arrive at random times." },
      { type: "paragraph", text: "It also gave customers the option of collecting the day before if they wanted to gift it themselves on Mother’s Day morning. Setting those boundaries made the whole weekend feel far more controlled." },
      { type: "image", key: "md_07", caption: "" },
      { type: "heading", text: "Marketing and How I’d Launch It" },
      { type: "paragraph", text: "If I was launching this now, I wouldn’t start talking about it too far in advance because it quickly starts to feel irrelevant. People don’t really think about Mother’s Day until it feels close enough to matter." },
      { type: "paragraph", text: "I would start properly advertising it around 2-3 weeks before. I’d post the full menu clearly with photos, prices and very clear instructions on exactly how to order. I wouldn’t keep it vague or just tell people to message for details. Everything would be laid out clearly so that buying felt simple." },
      { type: "paragraph", text: "It’s important not to confuse people by mixing occasions either. If you’re promoting Mother’s Day, keep the focus entirely on that. Don’t start mentioning Easter or anything else at the same time because it dilutes the message and makes it less urgent. You can defo mention that availability is limited because you do only have so much capacity (it doesn’t need to feel forced). As orders come in, I’ share reminders about cut-off times and availability so that people who tend to leave things until the last minute still have that nudge." },
      { type: "paragraph", text: "Mother’s Day doesn’t need a complicated launch plan. It just needs a simple menu, clear buying instructions, good photos and a clear deadline. The products themselves are already proven — you’re just positioning them as the perfect gift for the occasion." },
      { type: "image", key: "md_08", caption: "" },
    ]
  },
    "fathers-day": {
    hero: { key: "fd_01", caption: "Products & ideas to make your Father's Day a success" },
    blocks: [
      { type: "heading", text: "Father’s Day Strategy" },
      { type: "paragraph", text: "Father’s Day is one of those occasions where everyone is looking for the perfect gift. Cakes and brownies actually work really well for this, you just need to make sure what you’re offering matches what people actually want to buy for dads, not just what looks fancy or overly complicated." },
      { type: "paragraph", text: "From my experience, most dads don’t really care about intricate designs or detailed decoration (at least mine doesn't!) But they do care about food.. especially chocolatey, indulgent, nostalgic-style treats. So that was always my focus." },
      { type: "paragraph", text: "I never overcomplicated it. I just kept my usual products and tweaked them slightly for the occasion instead of building a whole new range from scratch." },
      { type: "image", key: "fd_02", caption: "" },
      { type: "paragraph", text: "Keeping the menu simple I didn’t create a whole new menu— I just adapted what I already had. So I’d keep my normal cupcake and brownie bases (usually vanilla and chocolate), and just change small things such as fillings or toppings like caramel, oreo, or other simple additions. It meant I wasn’t bringing in loads of extra ingredients or creating unnecessary work for myself." },
      { type: "paragraph", text: "Everything stayed familiar, which made production so much easier when orders picked up. It also meant I had recipes I could trust and count on when scaling up for a larger volume of orders like this, instead of testing something new." },
      { type: "heading", text: "What I actually sold" },
      { type: "paragraph", text: "I always kept my product range really tight, because that’s what made everything manageable. One of my best-selling products was my loaded brownie. It was always one fixed design, nothing custom, and what customers saw in the photo is exactly what they got." },
      { type: "paragraph", text: "I offered a selection box, which was a mix of cupcakes, brownies and rocky road. That one worked really well because it felt more like a gift experience rather than just a single item, and people often bought it to share as a family on the day." },
      { type: "paragraph", text: "Then I’d offer cupcake boxes in 6 or 12. Again, very simple — one design, fixed flavours, no custom requests. I’d stick to consistency because once you start changing things for different people, it quickly becomes unmanageable in a busy period." },
      { type: "heading", text: "Make ordering easy" },
      { type: "paragraph", text: "I created a dedicated Father’s Day section on my website with all of the products in one place, so customers could easily browse the full range without having to search through my page. I’d really recommend doing the same, whether that’s on your website, Facebook, Instagram, or wherever you mainly take orders." },
      { type: "paragraph", text: "I’d always post the full menu clearly with a photo of each product so customers knew exactly what they were getting. Alongside each item, I included the price, available flavours, quantities/sizes, and any important details upfront." },
      { type: "paragraph", text: "Not only does this make the whole experience feel more professional and organised, but it also makes ordering much easier for customers. It cuts down so much of the back-and- forth in DMs answering the same questions repeatedly, which saves you a huge amount of time when things start getting busy." },
      { type: "paragraph", text: "It also removes decision fatigue which should encourage purchases! I’d recommend taking payment at the time of ordering (I used card payments or PayPal), as it’s one less thing to worry about on the day and saves you from having to chase payments afterwards." },
      { type: "image", key: "fd_03", caption: "" },
      { type: "heading", text: "Small details that make a big difference" },
      { type: "paragraph", text: "I allowed customers to add a gift tag to their box because a lot of orders were being sent directly to the recipient. It’s a small detail, but it makes the whole thing feel more like a proper gift rather than just a box of cakes or cookies. This option was useful because I often had customers who didn’t live locally themselves, but were ordering for their dads who did. They could order and pay online, while I handled the baking and delivery for them." },
      { type: "heading", text: "Getting organised beforehand" },
      { type: "paragraph", text: "Most of the smoothness comes from what you do before the occasion itself. I’d always prep toppers, packaging, gift notes, name tags, and anything else I could in advance, then keep it all organised together so packing was quick and stress-free on the day. Those small systems genuinely make a huge difference when you’re handling a high volume of orders. This is also why having an order cut-off is so important — I’d usually close orders a few days before Father’s Day so I could properly plan everything. That time would be used to work out exactly how many of each product I needed, what ingredients to buy, and how the whole week was going to look." },
      { type: "paragraph", text: "It stops that last-minute scramble where you’re trying to guess everything while already overwhelmed and hopefully avoids running out of ingredients or packaging!" },
      { type: "image", key: "fd_04", caption: "" },
      { type: "heading", text: "Pricing and boundaries" },
      { type: "paragraph", text: "For seasonal events, I always increase prices slightly, at least £1– £2 per box. There’s more time involved with decoration, packaging, and admin, and demand is naturally higher. So it makes sense to reflect that. I never felt bad about it because peak seasons are not the time to undercharge. If someone doesn’t want to pay it, someone else will." },
      { type: "paragraph", text: "It’s important to ensure you are covering the extra costs as well as your regular overheads." },
      { type: "heading", text: "Delivery, collection and structure" },
      { type: "paragraph", text: "I also kept my delivery and collection very strict. Instead of offering lots of flexible options, I’d set clear time windows. For example, deliveries in a morning slot and collections in a specific 1–2 hour window. Otherwise you end up spending your whole day waiting around, which is exhausting when you’re already in production mode." },
      { type: "paragraph", text: "You should expect a mix of timing — some people will want things early, some will order last minute, and some will even try after the event. So I always made sure I had a bit of flexibility in my prep." },
      { type: "image", key: "fd_05", caption: "" },
      { type: "heading", text: "Marketing timeline" },
      { type: "paragraph", text: "I’d start promoting around 3 weeks before, but the actual content & product photos would be ready before that." },
      { type: "paragraph", text: "On quieter days I’d bake samples, take photos, and get everything set up so when I launched, I was just executing rather than building from scratch. That’s what makes marketing feel easier — you’re not trying to create content and fulfil orders at the same time." },
      { type: "paragraph", text: "It’s super important to have photos of all your products so customers know exactly what to expect (which also helps avoid disappointment)." },
      { type: "paragraph", text: "Don’t think of photo bakes as a waste either, they can always be used for giveaways, gifts, content, or sample boxes afterwards!" },
      { type: "image", key: "fd_06", caption: "" },
      { type: "heading", text: "The part most people skip.." },
      { type: "paragraph", text: "reviewing everything afterwards." },
