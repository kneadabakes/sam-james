<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kneada — Resource Glossary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#FAFBFC;
    --border:#E4E6EA; --border-strong:#D3D6DC;
    --text:#1A1F36; --text-soft:#697386; --text-muted:#96A0B3;
    --accent:#5B54F0; --accent-hover:#4A43DE; --accent-tint:#EFEEFE; --accent-tint-strong:#E1DFFC;
    --success-bg:#E3F5EC; --success-text:#0F7A47; --success-border:#BEE6D1;
    --warning-bg:#FFF6E0; --warning-text:#92600C; --warning-border:#FBE4A6;
    --info-bg:#EEF0FF; --info-text:#4338CA; --info-border:#CBD1FB;
    --neutral-bg:#F1F2F4; --neutral-text:#4B5563; --neutral-border:#DDE0E5;
    --danger:#D82C0D; --danger-bg:#FCEAE6;
    --radius:8px; --radius-lg:12px;
    --shadow-sm:0 1px 2px rgba(20,21,26,0.06);
    --shadow-md:0 4px 10px rgba(20,21,26,0.06), 0 1px 2px rgba(20,21,26,0.04);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 100px;}
  header{margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
  header h1{font-size:20px;margin:0 0 2px;font-weight:600;letter-spacing:-0.01em;}
  header p{margin:0;color:var(--text-soft);font-size:13px;}
  .header-logo{height:44px;width:auto;display:block;margin-bottom:6px;}
  .header-subtitle{margin:0;color:var(--text-soft);font-size:13px;font-weight:400;letter-spacing:normal;}
  .header-actions{display:flex;gap:8px;}

  .btn{padding:8px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm);transition:background 0.12s,border-color 0.12s;}
  .btn:hover{background:var(--surface-2);border-color:var(--text-muted);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
  .btn.small{padding:6px 11px;font-size:12.5px;}

  .layout{display:flex;gap:20px;align-items:flex-start;}

  .nav{width:272px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow-sm);}
  .search{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;margin-bottom:14px;background:var(--surface-2);color:var(--text);}
  .search:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-tint);}
  .category{margin-bottom:14px;}
  .category:last-child{margin-bottom:0;}
  .category-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:6px;padding:0 6px;}
  .topic-item{background:transparent;border:1px solid transparent;border-radius:var(--radius);padding:9px 10px;margin-bottom:2px;cursor:pointer;transition:background 0.1s;}
  .topic-item:hover{background:var(--surface-2);}
  .topic-item.active{background:var(--accent-tint);border-color:var(--accent-tint-strong);}
  .topic-item.active .topic-name{color:var(--accent-hover);}
  .topic-item.active .topic-desc{color:var(--text-soft);}
  .topic-name{font-size:13.5px;font-weight:500;color:var(--text);display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .topic-desc{font-size:12px;color:var(--text-soft);margin-top:2px;line-height:1.45;}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--border-strong);flex-shrink:0;}
  .status-dot.filled{background:#1FAA5F;}
  .tool-badge{font-size:9.5px;font-weight:600;background:var(--info-bg);color:var(--info-text);border-radius:4px;padding:2px 6px;margin-left:6px;text-transform:uppercase;letter-spacing:0.03em;}
  .topic-item.active .tool-badge{background:var(--accent);color:#fff;}

  .main{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px 32px;min-height:440px;box-shadow:var(--shadow-sm);}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:380px;color:var(--text-muted);text-align:center;gap:10px;}
  .empty-state .big{font-size:32px;width:64px;height:64px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;}

  .topic-header{border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:20px;}
  .topic-header .crumb{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--accent);margin-bottom:6px;}
  .topic-header h2{margin:0 0 4px;font-size:22px;font-weight:600;letter-spacing:-0.01em;}
  .topic-header .desc{font-size:13.5px;color:var(--text-soft);}

  .content-label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .content-area{width:100%;min-height:220px;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;font-size:14px;line-height:1.65;resize:vertical;background:var(--surface-2);color:var(--text);font-family:inherit;}
  .content-area:focus, .link-input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-tint);}
  .content-area::placeholder{color:var(--text-muted);}
  .link-input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13.5px;background:var(--surface-2);color:var(--text);}
  .link-row{margin-bottom:18px;}
  .link-row a{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:500;color:var(--accent);text-decoration:none;}
  .link-row a:hover{text-decoration:underline;}

  .attach-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

  footer{margin-top:32px;font-size:12px;color:var(--text-muted);text-align:center;}

  /* --- invoice template --- */
  .invoice-wrap{background:#fff;color:#222;padding:28px 32px;border:1px solid var(--border);border-radius:10px;max-width:900px;margin:0 auto;font-size:13px;line-height:1.4;}
  .invoice-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
  .invoice-brand{background:#f5e6ea;padding:18px 24px;border-radius:4px;min-width:200px;text-align:center;}
  .invoice-brand input,.invoice-brand textarea{width:100%;border:none;background:transparent;text-align:center;font-family:inherit;}
  .invoice-brand .biz-name{font-size:28px;font-weight:600;font-style:italic;color:#5c3d4a;}
  .invoice-brand .biz-tag{font-size:11px;color:#8a6a75;margin-top:4px;}
  .invoice-meta{display:grid;grid-template-columns:auto 140px;gap:4px 10px;align-items:center;font-size:12px;}
  .invoice-meta label{text-align:right;color:#555;}
  .invoice-meta input{border:1px solid #ccc;padding:3px 6px;font-size:12px;width:100%;}
  .invoice-title{font-size:22px;color:#e8b4bc;font-weight:300;text-align:right;margin-bottom:8px;}
  .invoice-addr-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px;}
  .invoice-addr-box table{width:100%;border-collapse:collapse;font-size:12px;}
  .invoice-addr-box th{background:#f5d0d8;padding:6px 10px;text-align:left;font-weight:600;}
  .invoice-addr-box td{border:1px solid #ddd;padding:4px 8px;}
  .invoice-addr-box td input{width:100%;border:none;background:transparent;font-size:12px;padding:2px 0;}
  .invoice-items{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:12px;}
  .invoice-items th{background:#f5d0d8;padding:7px 10px;text-align:left;font-weight:600;}
  .invoice-items th:nth-child(2),.invoice-items th:nth-child(3){text-align:center;width:90px;}
  .invoice-items td{border:1px solid #e5e5e5;padding:5px 8px;}
  .invoice-items tr:nth-child(even) td{background:#f7f7f7;}
  .invoice-items td input{width:100%;border:none;background:transparent;font-size:12px;padding:2px 0;}
  .invoice-items td.qty input,.invoice-items td.cost input{text-align:center;}
  .invoice-bottom{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start;}
  .invoice-notes{border:1px solid #ddd;}
  .invoice-notes h4{background:#f5d0d8;margin:0;padding:6px 10px;font-size:12px;}
  .invoice-notes textarea{width:100%;border:none;padding:8px 10px;font-size:12px;min-height:90px;resize:vertical;font-family:inherit;box-sizing:border-box;}
  .invoice-totals{font-size:12px;}
  .invoice-totals table{width:100%;border-collapse:collapse;}
  .invoice-totals td{padding:4px 8px;border:1px solid #ddd;}
  .invoice-totals td:first-child{text-align:right;font-weight:500;}
  .invoice-totals input{width:100%;border:none;background:transparent;text-align:right;font-size:12px;}
  .invoice-totals .total-row td{font-weight:700;font-size:14px;}
  .invoice-footer{margin-top:22px;text-align:center;font-size:11px;color:#555;border-top:1px solid #eee;padding-top:12px;}
  .invoice-footer input{border:none;background:transparent;text-align:center;width:100%;font-size:11px;color:#555;}
  .invoice-actions{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .invoice-actions button{padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--accent);color:#fff;cursor:pointer;font-size:13px;font-weight:600;}
  .invoice-actions button.secondary{background:#fff;color:var(--text);}
  @media print{
    .sidebar,.topbar,.invoice-actions,.link-row,.article-source-note,.content-label,nav,header{display:none!important;}
    .invoice-wrap{border:none;padding:0;max-width:100%;}
    body{background:#fff;}
    .main-panel{padding:0!important;}
  }
  /* --- embedded tool: cost book --- */
  .tool-tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border);}
  .tool-tab{padding:9px 4px;margin-right:18px;background:transparent;color:var(--text-soft);cursor:pointer;font-size:13px;font-weight:500;border:none;border-bottom:2px solid transparent;}
  .tool-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
  .tool-panel{display:none;}
  .tool-panel.active{display:block;}

  .cb-layout{display:flex;gap:18px;align-items:flex-start;}
  .cb-product-list{width:190px;flex-shrink:0;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .cb-plh{padding:9px 11px;border-bottom:1px solid var(--border);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);}
  .cb-pitem{padding:9px 11px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .cb-pitem:last-child{border-bottom:none;}
  .cb-pitem:hover{background:var(--surface);}
  .cb-pitem.active{background:var(--accent);color:#fff;}
  .cb-pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .cb-pitem button{background:none;border:none;color:inherit;opacity:0.55;cursor:pointer;font-size:12px;}
  .cb-pitem button:hover{opacity:1;}
  .cb-addp{width:100%;padding:8px 11px;border:none;background:var(--surface);color:var(--text);cursor:pointer;font-size:12.5px;border-top:1px solid var(--border);font-weight:500;}
  .cb-addp:hover{background:var(--surface-2);}

  .cb-main{flex:1;min-width:0;}
  .cb-pname-input{width:100%;font-size:16px;font-weight:600;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-2);margin-bottom:14px;color:var(--text);}
  .cb-pname-input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-tint);}

  .cb-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;table-layout:fixed;}
  .cb-table thead th{text-align:left;font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-muted);padding:10px 9px;border-bottom:1px solid var(--border);background:var(--surface-2);}
  .cb-table tbody td{padding:10px 9px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
  .cb-table tbody tr:last-child td{border-bottom:none;}
  .cb-table tbody tr:hover{background:var(--surface-2);}
  .cb-table input, .cb-table select{font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;width:100%;background:var(--surface);color:var(--text);}
  .cb-table input:focus, .cb-table select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint);}
  .cb-unit-cell{display:flex;flex-direction:column;gap:6px;}
  .cb-unit-cell input, .cb-unit-cell select{width:100%;}
  .cb-num{text-align:right;}
  .cb-row-cost{font-weight:600;color:var(--accent-hover);white-space:nowrap;}
  .cb-del{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:15px;padding:3px 7px;border-radius:6px;}
  .cb-del:hover{background:var(--danger-bg);color:var(--danger);}
  .cb-addrow{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:var(--surface);border:1px dashed var(--border-strong);color:var(--text);padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:500;}
  .cb-addrow:hover{border-color:var(--accent);color:var(--accent);border-style:solid;background:var(--accent-tint);}

  .cb-settings{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;align-items:flex-end;}
  .cb-field{display:flex;flex-direction:column;gap:5px;min-width:130px;}
  .cb-field label{color:var(--text-muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;}
  .cb-field input{padding:7px 9px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;background:var(--surface);color:var(--text);width:100%;}
  .cb-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint);}

  .cb-summary{margin-top:20px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .cb-srow{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:var(--text-soft);}
  .cb-srow.total{border-top:1px solid var(--border);margin-top:8px;padding-top:12px;font-size:19px;font-weight:600;color:var(--text);}
  .cb-srow.total .val{font-weight:700;color:var(--accent-hover);}

  .cb-toolbar{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}

  /* --- rendered article content --- */
  .article-hero{width:100%;max-width:640px;margin:0 auto 20px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--surface-2);}
  .article-hero img{width:100%;height:auto;display:block;object-fit:contain;cursor:zoom-in;}
  .article-block{margin-bottom:20px;}
  .article-block:last-child{margin-bottom:0;}
  .article-block h3{font-size:16px;font-weight:700;margin:0 0 10px;color:var(--text);}
  .article-block p{font-size:14px;line-height:1.75;color:var(--text);margin:0 0 10px;}
  .article-block p:last-child{margin-bottom:0;}
  .article-block ul{margin:0 0 10px;padding-left:20px;font-size:14px;line-height:1.75;color:var(--text);}
  .article-block ul li{margin-bottom:12px;}
  .article-block ul li:last-child{margin-bottom:0;}
  .article-block ul:last-child{margin-bottom:0;}
  .article-image{margin:16px auto;max-width:520px;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--surface-2);}
  .article-image img{width:100%;height:auto;display:block;object-fit:contain;cursor:zoom-in;}
  .article-image figcaption{font-size:12px;color:var(--text-soft);padding:9px 12px;}
  .article-image-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0;max-width:640px;margin-left:auto;margin-right:auto;align-items:start;}
  .article-image-row .article-image{margin:0;max-width:none;}
  .article-image-row .article-image img{width:100%;height:auto;object-fit:contain;cursor:zoom-in;}
  /* lightbox */
  .img-lightbox{position:fixed;inset:0;z-index:9999;background:rgba(10,12,20,0.92);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;}
  .img-lightbox.open{display:flex;}
  .img-lightbox img{max-width:min(96vw,1200px);max-height:92vh;width:auto;height:auto;object-fit:contain;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,0.45);}
  .img-lightbox .lb-close{position:absolute;top:16px;right:20px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);color:#fff;font-size:22px;line-height:1;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .img-lightbox .lb-close:hover{background:rgba(255,255,255,0.22);}
  .img-lightbox .lb-caption{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.85);font-size:13px;max-width:90vw;text-align:center;}
  .article-recipe-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin:16px 0;}
  .article-recipe-box h4{margin:0 0 10px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;color:var(--accent-hover);}
  .article-recipe-box ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.65;}
  .article-callout{background:var(--accent-tint);border:1px solid var(--accent-tint-strong);border-radius:var(--radius);padding:14px 16px;margin:16px 0;font-size:13.5px;line-height:1.65;color:var(--text);}
  .article-divider{border:none;border-top:1px solid var(--border);margin:24px 0;}
  .article-source-note{font-size:11.5px;color:var(--text-muted);margin-top:24px;padding-top:14px;border-top:1px solid var(--border);}
  .article-edit-toggle{display:flex;justify-content:flex-end;margin-bottom:12px;}

  .search-highlight{background:#FFE28A;color:#3D2E00;border-radius:3px;padding:0 2px;box-shadow:0 0 0 1px #F5C542;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);}
  .nav-toggle{display:none;}

  @media (max-width:800px){
    .wrap{padding:16px 14px 90px;}
    header{margin-bottom:16px;gap:10px;}
    header h1{font-size:18px;}
    .header-actions{width:100%;gap:6px;}
    .header-actions .btn{flex:1 1 auto;padding:10px 10px;font-size:12.5px;min-height:40px;}
    .header-actions .btn.primary{flex:1 1 100%;order:5;}
    #saveStatus{width:100%;order:-1;margin-right:0;margin-bottom:2px;}

    .layout{flex-direction:column;gap:12px;}

    .nav-toggle{
      display:flex;align-items:center;justify-content:space-between;width:100%;
      padding:12px 14px;border-radius:var(--radius-lg);border:1px solid var(--border);
      background:var(--surface);box-shadow:var(--shadow-sm);font-size:14px;font-weight:600;
      color:var(--text);cursor:pointer;min-height:44px;
    }
    .nav-toggle .chev{transition:transform 0.15s;color:var(--text-muted);}
    .nav-toggle.open .chev{transform:rotate(180deg);}

    .nav{
      width:100%;max-height:0;overflow:hidden;padding:0 14px;margin-top:0;
      border-width:0;box-shadow:none;transition:max-height 0.2s ease, padding 0.2s ease;
    }
    .nav.open{max-height:2000px;padding:14px;border-width:1px;margin-top:8px;}

    .search{padding:11px 12px;font-size:16px;min-height:44px;}
    .topic-item{padding:12px 12px;min-height:44px;}
    .topic-name{font-size:14px;}
    .topic-desc{font-size:12.5px;}

    .main{padding:16px;min-height:auto;}
    .topic-header h2{font-size:19px;}

    .btn{min-height:40px;padding:9px 14px;}
    .cb-layout{flex-direction:column;}
    .cb-product-list{width:100%;}
    .cb-table input,.cb-table select{font-size:16px;}
    .tool-tabs{overflow-x:auto;white-space:nowrap;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;}
    .tool-tab{flex-shrink:0;}
  }
</style>
</head>
<body>
<div class="wrap">

"prep-like-a-pro": {
    hero: null,
    blocks: [
      { type: "paragraph", text: "Simple ways to stay organised in the kitchen. Whether you’re baking to sell or simply baking for fun at home, a little preparation goes a long way. The more organised you are before you start baking, the smoother everything will run when things get busy." },
      { type: "paragraph", text: "These are some of the habits that helped me stay organised during busy baking periods." },
      { type: "heading", text: "Make Sure You Have the Right Ingredients" },
      { type: "paragraph", text: "Before starting a baking session, make sure you have the right ingredients and the right quantities." },
      { type: "paragraph", text: "I always create a baking schedule in advance so I know exactly how much of each ingredient I’ll need. There’s nothing worse than running out of something mid-bake and needing to rush to the shop." },
      { type: "image", key: "pr_02", caption: "" },
      { type: "paragraph", text: "It’s also helpful to keep extra ingredients on hand for accidents like cracked eggs, spilled mixtures, or recipes needing slightly more than expected." },
      { type: "paragraph", text: "I order each week the same base ingredients (eggs, flour, butter, sugar) because I always need those for all my products and never want to run out." },
      { type: "heading", text: "Plan Your Storage Space" },
      { type: "paragraph", text: "Storage space is something many bakers overlook until it becomes a problem. If your bakes need to be stored in the freezer or fridge, make sure you actually have enough room available and the right containers to keep everything safe and organised." },
      { type: "paragraph", text: "For example, I tend to use my fridge far more in the summer months when ingredients and buttercream need to stay cooler, whereas in winter I rely on it a little less." },
      { type: "paragraph", text: "Thinking ahead about where everything will go can save a lot of stress later." },
      { type: "image", key: "pr_03", caption: "" },
      { type: "heading", text: "Use Quiet Days to Get Ahead" },
      { type: "paragraph", text: "If you have quieter days before a busy period or event, use that time to prepare as much as possible." },
      { type: "paragraph", text: "A few things I like to do on slower days include:" },
      { type: "list", items: ["Building up packaging boxes so they’re ready to be filled", "Writing out gift tags and name labels in advance", "Preparing cookie dough and storing it in the freezer", "Making icing in larger batches and storing it in the fridge"] },
      { type: "heading", text: "Batch Your Prep Where Possible" },
      { type: "paragraph", text: "Batching your prep is one of the easiest ways to save time in the kitchen. Instead of making small amounts of things as you need them, prepare larger batches in advance so everything is ready when you start baking." },
      { type: "image", key: "pr_04", caption: "" },
      { type: "heading", text: "Have Reliable Suppliers" },
      { type: "paragraph", text: "Having reliable suppliers is an important part of staying organised. When you’re baking regularly, you need to know you can get the ingredients and packaging you need without last-minute stress." },
      { type: "paragraph", text: "I built relationships with suppliers I could rely on and ordered regularly so I wasn’t constantly running short of essentials." },
      { type: "image", key: "pr_05", caption: "" },
      { type: "heading", text: "Always Have a Backup Supplier" },
      { type: "paragraph", text: "Even the most reliable suppliers can occasionally run out of stock. I lived on a small island with limited shop options, which meant ingredients would sometimes sell out completely. If I had relied on just one shop, I would have been stuck without the ingredients I needed to fulfil orders. Because of that, I always made sure I had at least two suppliers I could rely on, just in case one didn’t have what I needed." },
      { type: "heading", text: "Plan Deliveries and Collections" },
      { type: "paragraph", text: "If you’re selling your bakes, planning delivery routes and collection schedules in advance can make a big difference. Knowing exactly when customers are collecting or where you’re delivering helps the day run much more smoothly and avoids unnecessary rushing or confusion." },
      { type: "image", key: "pr_06", caption: "" },
      { type: "heading", text: "Don’t Be Afraid to Ask for Help" },
      { type: "paragraph", text: "When things get busy, there’s no rule that says you have to do everything alone." },
      { type: "paragraph", text: "If you’re feeling overwhelmed, asking a friend or family member to help with small tasks like packaging, labelling, or organising orders can take a lot of pressure off." },
      { type: "paragraph", text: "Sometimes even a little extra help can make a big difference." },
      { type: "paragraph", text: "Some tasks don’t require any baking talent but they can save you time!" },
      { type: "image", key: "pr_07", caption: "" },
      { type: "heading", text: "Know Your Limits" },
      { type: "paragraph", text: "It can be tempting to say yes to every order that comes in, especially when you’re excited about growing your baking business." },
      { type: "paragraph", text: "But taking on too much can quickly lead to stress, mistakes, and lower quality bakes." },
      { type: "paragraph", text: "Learning to recognise your limits and saying no when needed is an important part of protecting both your time and the quality of your work." },
      { type: "heading", text: "Preparation Makes Everything Easier" },
      { type: "paragraph", text: "The busiest baking days are always easier when you’ve done the preparation beforehand." },
      { type: "paragraph", text: "Even small things — like having cookie dough ready in the freezer, packaging built, toppers pre-made or ingredients already stocked — can make a huge difference when you’re working through lots of bakes." },
      { type: "paragraph", text: "A little preparation can turn a stressful baking day into a much smoother and more enjoyable one." },
    ]
  },
  "home-bakery-playbook": {
    hero: { key: "pb_01", caption: "Molly — The Home Bakery Playbook." },
    blocks: [
      { type: "paragraph", text: "So you want to start a bakery business?" },
      { type: "paragraph", text: "Or maybe, you’ve already started but are looking for some direction from someone who’s been exactly where you are right now!" },
      { type: "paragraph", text: "In case you don’t already know, I’m Molly and I started a bakery in my parent’s kitchen at home with my boyfriend, when we were 18." },
      { type: "paragraph", text: "Over the past 10 years in business we built a brand, hired staff, created a branded delivery fleet, hired commercial kitchen spaces and faced challenges but ultimately, we learnt A LOT. Our business eventually worked like clockwork. We knew what would make customers order, we knew which products they would want to buy and we knew how to hold events, selling out within hours." },
      { type: "paragraph", text: "Now I’m sharing everything I’ve learnt so you can create the bakery business you've been dreaming of." },
      { type: "image", key: "pb_02", caption: "" },
      { type: "heading", text: "The Foundations: Mindset & Confidence" },
      { type: "paragraph", text: "You’ll probably never feel ready. I certainly didn't, but if you’ve been thinking about starting something, the worst thing you can do is nothing. You’ll never regret starting something or giving it a go, but you can certainly regret NOT trying." },
      { type: "paragraph", text: "If you’re reading this guide, you’ve already taken a big step in the right direction. People love sweet things and baked goods, that's something I don’t see changing any time soon, so if you have a passion for baking and want to turn it into a business, go for it! I am always happy to help and answer any questions you might have, no matter where you are in your journey." },
      { type: "paragraph", text: "The scariest thing I did was publish my first post on my business page. I was worried people would laugh at me or nobody would want to buy what I was selling, I didn’t tell anybody about the business idea because I was so nervous. It’s easy to forget that even the biggest brands start from nothing - 0 sales and 0 customers." },
      { type: "paragraph", text: "Don’t doubt yourself, or your skills. You can create a product and you can sell a product. You don’t need thousands of followers, a fancy website, or a perfect logo to begin and you don’t need a degree or special training to do it. The best way to build confidence is by taking action." },
      { type: "paragraph", text: "Yes this was actually my first product image, so if I can start with this and build a 6 figure business, you can too!" },
      { type: "paragraph", text: "“I don’t need to be perfect to be profitable. I just need to begin.”" },
      { type: "image", key: "pb_06", caption: "" },
      { type: "heading", text: "What area of the bakery world do you see yourself in?" },
      { type: "paragraph", text: "I started with just ONE product which was cupcakes and I would happily do the same again." },
      { type: "paragraph", text: "Don’t get too carried away and try to offer everything from the start, focus on one great product and expand from there as your customer base grows. This will be easier to advertise and also easier to manage once you begin getting orders and buying in ingredients (trust me!)." },
      { type: "paragraph", text: "It’s easier to stand out in a crowded market with something you are really good at rather than a number of things you’re average at. I’m sure you already have an idea of the products you want to sell within your niche, but I would suggest focusing on 2-3 show stopper products at first." },
      { type: "paragraph", text: "Try to consider whether your products work well together, do the flavours compliment each other? Are customers likely to order them at the same time or are they a little random and mismatched? Can you advertise them easily?" },
      { type: "paragraph", text: "When your products and flavours compliment each other, you can play around with your offerings. I created these selection boxes using the exact same products I already offered, just put together in different set ups. My customers LOVED them. People often like to try a little bit of everything rather than have 1 box full of the same item." },
      { type: "image", key: "pb_07", caption: "" },
      { type: "paragraph", text: "You also want to offer products that can be batch made. If it takes you hours to make one item, it’s not very scalable, and unless you are charging a fortune it’s probably not worth it. This is another reason I liked cupcakes. I could multiply up my recipe and make them in large batches vs. spending a long time baking and decorating one custom layer cake. Just remember, you can’t target everyone and sell everything. It can be tempting when you receive a request, to create something that is not within your niche just because they have asked for it (I know because I have done it!). Often, it wasn't worth the stress is caused me and I was never happy with the end result because it wasn't my area of expertise. You don’t need fancy mixers or a massive kitchen to start, it’s very doable to work out of a home kitchen with what you already have." },
      { type: "paragraph", text: "If you are stuck on what products to start with, list your top 3 favourite things to bake. Now pick the one you could make without giving it a second thought — that’s your starting point." },
      { type: "paragraph", text: "Tip: Bake for Efficiency, Not Just Taste! Choose products that can be baked in the quantities you actually sell. If a recipe requires a full batch but customers typically only buy one or two pieces, you’re creating unnecessary leftovers and reducing your profit. Prioritize products that can be baked, portioned, or prepared as needed." },
      { type: "image-row", items: [
        { key: "pb_08", caption: "This is my parents little kitchen which I started in and the mixer I used, when I say nothing fancy, I really mean it!" },
        { key: "pb_09", caption: "This is the kitchen I moved into eventually. Hard work and determination pays off!" }
      ] },
      { type: "heading", text: "Licences & Permits" },
      { type: "paragraph", text: "Where I live, I had to apply to the local environmental health agency who came and did an inspection of my home kitchen. Luckily I got a 5* and was ready to go pretty quickly! I had to complete a food safety course online which gave me a level 2 qualification - this was a requirement as part of the inspection. I also had to register my business and receive a licence to trade & sell. This will be different depending on where you are located, start with contacting your local gov agency who can tell you what licences you require." },
      { type: "paragraph", text: "I also took out business insurance which included public liability insurance, meaning I was covered when it came to selling at local events to the public. You may need this if somebody claims to be sick after eating one of your products (unlikely, but better to be safe than sorry) Some places do have stricter requirements on what can be sold from home, so please don’t over look this detail in your area!" },
      { type: "paragraph", text: "It’s good practise but also a legal requirement in most places to list all your ingredients/allergy information on the products you are selling." },
      { type: "paragraph", text: "It’s important to think about more than just the ingredients themselves — consider whether your products contain common allergens such as nuts, wheat/gluten, milk/dairy, eggs, soy, or sesame, and make this information clear to your customers." },
      { type: "paragraph", text: "Be particularly careful about products made in a kitchen where allergens are also handled, as cross-contact can be a concern for people with severe allergies. It’s also worth considering whether a product needs to be refrigerated or kept at a particular temperature, and making sure customers know how it should be stored and how long it is intended to keep. Requirements vary depending on where you live, so I would suggest to always check your local food-selling and labelling rules before you start selling." },
      { type: "image-row", items: [{ key: "pb_10", caption: "" }, { key: "pb_11", caption: "" }] },
      { type: "paragraph", text: "I'm often asked about permits, food safety, and the regulatory side of things. I can only speak from my own experience, which was specific to my local area. I can't give you exact rules for where you live (since these vary a lot!), but I can share what helped me and what the inspector actually looked for when they visited my home kitchen." },
      { type: "paragraph", text: "The biggest thing I worried about was the inspection. The thought of someone coming into my home kitchen (which was originally just set up for family meals, not running a bakery!) felt daunting." },
      { type: "paragraph", text: "But the good news is the inspector wasn't looking for a \"perfectly spotless\" kitchen. What mattered most were the systems and safety measures I had in place." },
      { type: "paragraph", text: "You can demonstrate your knowledge when you speak to them during the visit, to prove you have the right ideas." },
      { type: "paragraph", text: "I've actually had two visits: one was planned in advance, but the second wasn't. The inspector showed up unannounced, but because I practised these systems daily, it didn't matter. If you set yourself up well from the start, you'll make the journey a lot easier." },
      { type: "paragraph", text: "Some of the things they checked for included:" },
      { type: "list", items: [
        "Ingredient labelling → noting when products were opened and their use-by dates.",
        "Fridge temperature logs → keeping a daily record to show it's always in the safe range (approx. 3–4°C).",
        "Cross-contamination prevention → for example, keeping all baking ingredients on the top shelf of the fridge, or even using a separate fridge if you can.",
        "Separation of cleaning products → making sure they're stored away from food prep areas.",
        "Hand and surface hygiene → always having antibacterial soap and surface cleaner available.",
        "Safe storage for ingredients → a dedicated space where everything is kept fresh and protected."
      ] },
      { type: "paragraph", text: "The reality is: as bakers, things are a little simpler for us compared to businesses that handle raw meat, fish, etc.— those carry much higher risks." },
      { type: "paragraph", text: "So, while food safety can feel overwhelming at the start, if you focus on having clear systems and good habits, the process becomes much less scary." },
      { type: "heading", text: "Pricing" },
      { type: "paragraph", text: "You need to start by working out how much it costs you to make the products you are going to sell. Simply, the cost of the ingredients and materials used, as well as your time spent to create your products. Don't forget to include additional factors, such as fuel if you are delivering, rent if you are leasing a space, packaging materials, taxes etc." },
      { type: "paragraph", text: "You can utilise ChatGPT for something like this, inputting your figures and asking it to work out your margins if you charge X price. You can play around with different costings until you reach a figure that you are comfortable with." },
      { type: "paragraph", text: "Even if you are new to this, please don’t undervalue yourself or your work. It will be harder in the long run if you have to keep raising prices because you charge an unsustainable amount, rather than starting out with a figure that works and is scalable. Think about where you want to be and ensure you are charging enough to accommodate bigger orders as you grow. Having said that, the price you start out with does not need to be set in stone forever, it is normal for businesses to raise prices every now and then, in line with inflation and rising costs of goods." },
      { type: "paragraph", text: "You shouldn’t base your pricing on competitors or use a number that ‘just seems right’. It should be a thought out calculation, if you are struggling with working out your costs and profit margins, use <a href=\"javascript:void(0)\" onclick=\"selectTopic(&#39;pricing-pro&#39;)\" style=\"text-decoration:underline;color:var(--accent);font-weight:600;cursor:pointer;\">the helpful Pricing Pro tool in this guide to help</a>." },
      { type: "image-row", items: [{ key: "pb_12", caption: "" }, { key: "pb_13", caption: "" }] },
      { type: "heading", text: "Branding & Packaging" },
      { type: "paragraph", text: "The fun part! I’d suggest picking a colour palette (2-3 colours max) and a font combination which you can use across your posts, marketing and stationary. Ideally colours that compliment each other and you won’t get bored of!" },
      { type: "paragraph", text: "You don’t need to spend ages making a logo (unless you really want to), a simple brand name in your chosen font and colour theme will work to get you started. Once you have these, be sure to include them everywhere, as it is how your customers will recognise your brand. I even used the same font on all my instagram stories so it was easy for people to think ‘oh that’s a Mollies post!’. I really wanted to be known as a brand ‘Mollies’ rather than Molly the girl who baked cakes." },
      { type: "paragraph", text: "You can see here my brand colour and how it was consistent across everything I did, even from the start when I didn’t have the budget for posh packaging." },
      { type: "image-row", items: [{ key: "pb_14", caption: "" }, { key: "pb_15", caption: "" }] },
      { type: "image-row", items: [{ key: "pb_16", caption: "" }, { key: "pb_17", caption: "" }] },
      { type: "image", key: "pb_18", caption: "" },
      { type: "paragraph", text: "Packaging forms an important part of your product and shouldn't be ignored. 99% of my products were hand delivered so it was important to have suitable and sturdy packaging. I started off using simple white cupcake boxes (the ones that we probably all know and are a bit flimsy!) with a branded sticker on top - not perfect but it got me started." },
      { type: "paragraph", text: "Later down the line I made a big investment in my own custom boxes which were a game changer for stability and brand recognition, but this was about 5-6 years in to my business journey." },
            { type: "paragraph", text: "You want your customers to enjoy the experience of unboxing their purchase as well as eating it! We all love a fancy box or bag when making a luxury purchase, but you can recreate this in an affordable way. You could add ribbon, tissue paper, thank you notes or anything else you think would enhance the customer experience." },
      { type: "paragraph", text: "Canva is a really good tool for designing with a range of templates to choose from. For printing, I like to use banana print but you could also try vista print." },
      { type: "paragraph", text: "Amazon sells a good range of off the shelf packaging solutions (just search small shipping boxes) which can be a good starting point. You can also use Alibaba but they do have a higher minimum order requirement." },
      { type: "image-row", items: [{ key: "pb_19", caption: "" }, { key: "pb_20", caption: "" }] },
      { type: "image", key: "pb_21", caption: "" },
      { type: "heading", text: "Photography" },
      { type: "paragraph", text: "Take good photos. This is so simple, SO important and so many people get it wrong! A bad photo of a good product can do more damage than good. Your photos will often be what actually brings in the sales of your products, especially to new customers. They haven’t tried your bakes yet so they are basing their decision on the photos and content you are sharing." },
      { type: "paragraph", text: "Try to use natural lighting wherever you can. If you can’t get a good natural light source, ring lights can be useful but make sure you set it up correctly so that you don’t have any shadows. Check that the background of your photo is clear, there’s nothing worse than clutter or random objects lurking in the back of a photo. Clean your camera lens with a microfibres cloth, I used my iPhone for most of my content and the camera lens often gets smeary." },
      { type: "paragraph", text: "Create a theme/style of photography and stick to it, whether it is a flat lay style, a specific backdrop or props you use - this will add to creating a recognisable brand. Any props you use should complement the products you are photographing, but you don’t need to go over the top. I purchased some backdrops from Club Backdrops so I always had a consistent background to use if needed." },
      { type: "image-row", items: [
        { key: "pb_22", caption: "Wrong angle, bad lighting, randomly placed objects = bad photo" },
        { key: "pb_23", caption: "Good use of props = relevant, complimentary & not too cluttered" },
        { key: "pb_24", caption: "Good lighting, focus & quality, bold colours = good photo" }
      ] },
      { type: "heading", text: "Sales & Marketing" },
      { type: "paragraph", text: "Possibly the most important part, because your products aren’t going to sell themselves! Some like to focus on events and markets to sell their bakes, others like to use social media and many people start out just selling to friends and family. I began by creating a simple Facebook page and used my page to promote my products. It started very small but gradually gained traction over time." },
      { type: "paragraph", text: "Tip: Like and share competitions are a great way to boost your engagement — check out some of my results!" },
      { type: "image-row", items: [
        { key: "pb_25", caption: "" },
        { key: "pb_26", caption: "" }
      ] },
      { type: "paragraph", text: "Marketing is not just posting pretty pictures and hoping that somebody asks to buy your product. You need to set up your profile so that they know what they can buy, how much it costs and how they can make a purchase." },
      { type: "paragraph", text: "Whether you are using Facebook, Instagram or TikTok, make sure you have your location in your bio so people know where you are based and make your profile easy to navigate. It’s up to you to decide on what your ordering process will be but don’t overcomplicate it." },
      { type: "paragraph", text: "Bonus tip: Don't just treat your profile like a static sales portfolio. Comment on other local businesses, reply to stories, ask questions in your captions, and interact with your followers. The more genuine connections you build, the more people will remember you — and support you." },
      { type: "image", key: "pb_27", caption: "" },
      { type: "paragraph", text: "This post tags my location, shows a good quality photo of the product, tells my customers it's available and gives them 2 options of ordering or contacting me. I've already given them a lot of info without them asking anything. You don't want your customer to feel like your ordering process is a chore." },
      { type: "paragraph", text: "Even if it feels obvious to you, your customers might not know how to place an order — and not everyone will ask. I had a pinned post on my page that listed exactly how to order step by step and what my prices were. Even after I set up a Shopify store to automate everything, not everyone used it — and that’s okay!" },
      { type: "image-row", items: [
        { key: "pb_28", caption: "The menu I started with pre website" },
        { key: "pb_29", caption: "How to order after the website was set up" }
      ] },
      { type: "paragraph", text: "My first sale came from a Facebook post of 4 cupcakes which I had baked just for marketing. I didn’t have a website to begin with, so took all orders over Facebook messenger. I posted my photos and literally told people to ‘message if you’d like to order’ and someone did! I started very small and asked my customers to leave reviews, this was a great way to build up positive feedback which made my page ratings go up. People love to read real life reviews and often trust the feedback provided - think about booking a holiday - how often do you read reviews and make a decision based on what you read?" },
      { type: "image-row", items: [
        { key: "pb_30", caption: "The first cupcakes I posted & made a sale from" },
        { key: "pb_31", caption: "How my page looked with good reviews" }
      ] },
      { type: "paragraph", text: "Nowadays, I would recommend sharing more about yourself and your journey when marketing your business, as well as the products. TikTok and Instagram allow you to connect with your customers, often people will buy into you, not just your products. It’s also a great way to build trust when people can see and understand where their purchases are coming from. I started doing this more towards the end and didn’t realise how much people would engage with this kind of content." },
      { type: "paragraph", text: "If you’re struggling for ideas, try to focus on things outside of just the products you sell. Show people how you do something, record yourself working behind the scenes, or create a day in the life video." },
      { type: "paragraph", text: "I also had a lot of success in offering a loyalty programme to my customers. It was simple to set up through my shopify store but you can easily create one yourself manually." },
      { type: "paragraph", text: "Below is an overview of what I offered. You don’t need to be selling yourself short, but making customers feel valued and like they are rewarded when they buy from you is a great way to keep them coming back!" },
      { type: "paragraph", text: "Think about any membership programmes you are part of, Airlines are a great example! Most offer points as rewards and we stay loyal to try and collect the points in the hope we can use them to our benefit later down the line." },
      { type: "image", key: "pb_32", caption: "" },
      { type: "paragraph", text: "Use LinkedIn to promote your products in a way that’s professional enough to appeal to decision-makers and fun enough to stand out in a sea of corporate content. It can be a goldmine for larger, repeat corporate orders like office treats, client gifts or team celebrations. If you live in a city with a strong finance or business sector, you’ve got a huge market there — and many of those companies have the budget to spend. My biggest order to date came from a corporate client, which was over £2,000 for one order!" },
      { type: "paragraph", text: "Don’t neglect the corporate world. I teamed up with a finance company whose employees received a 10% off discount code when they purchased from me. It made me the go to cake/treat person for all the employees and was well worth the discount I gave them. Think about how many people your products can be exposed to if they are consumed in an office with hundreds of employees? A no brainer, it’s free marketing!" },
      { type: "image-row", items: [
        { key: "pb_33", caption: "" },
        { key: "pb_34", caption: "" }
      ] },
      { type: "paragraph", text: "Don't just focus on social media and forget about traditional marketing methods. Word of mouth, handing out business cards and creating flyers are all useful for getting your name out there." },
      { type: "paragraph", text: "My email list was my most valuable marketing method. It generated the highest sales and was the one platform where I could speak directly to customers without worrying about an algorithm." },
      { type: "image", key: "pb_35", caption: "Actual results shortly after sending out a promotional email" },
      { type: "heading", text: "Operations" },
      { type: "paragraph", text: "My business model was simple, I had a set product offering, customers would place their order by contacting me, I would bake the order and deliver on their requested date. 99% of my sales were pre-orders, which meant I had almost no waste." },
      { type: "paragraph", text: "I began using a paper diary and wrote down the customer name and exactly what they ordered, on the day they had chosen for delivery. All the order details were obtained ahead of the order date (product, quantity, cost, payment, delivery information)." },
      { type: "heading", text: "Tip" },
      { type: "paragraph", text: "Always obtain a contact number when taking an order. It's much easier to contact people this way instead of relying on DM or email if needed on the day of delivery." },
      { type: "paragraph", text: "I chose to offer a delivery service as I lived in a small island, it meant I attracted a range of different orders. Customers often purchased for others and had them delivered as a gift, they could order from the comfort of their home and rely on us to complete the delivery of their order to the recipient." },
      { type: "paragraph", text: "Once you have got your business started, you can start developing your own processes and sussing out how to manage your time. This will differ for everybody, especially if you are doing it full time vs. part time alongside another job." },
      { type: "image", key: "pb_36", caption: "A peek into my delivery van. Orders placed & paid for, products baked, boxes labeled, gift tags added = ready to be delivered." },
      { type: "paragraph", text: "Try to set a standard of how far in advance customers would need to order from you. I offered next day delivery on orders placed before 9PM, my customers loved it because it was perfect for last minute gifts, and impulse purchases." },
      { type: "paragraph", text: "I like to do my baking on the day of delivery/collection, so the customer is receiving the product freshly baked. It’s not always possible, especially with larger orders." },
      { type: "paragraph", text: "When I received large orders (usually 100+ cupcakes) I would bake them the evening before. My cupcake recipe was perfectly fine to last over night and it meant that I could fulfil the order without feeling like I need to rush." },
      { type: "paragraph", text: "The other exception was cookies. Whilst I would bake the cookies on the day of delivery, I would prepare the dough in advance. I baked my dough from frozen as this is what worked best for my cookie recipes." },
      { type: "paragraph", text: "It meant that I could set aside a day each week focusing on preparing batches of cookie dough, then I would label it and store it in the freezer, ready to be baked when needed." },
      { type: "image-row", items: [{ key: "pb_37", caption: "" }, { key: "pb_38", caption: "" }] },
      { type: "paragraph", text: "This is another reason to seriously consider what products you want to sell and how to store them. You want to make life as easy as possible for yourself, whilst serving your customers with the highest quality products." },
      { type: "paragraph", text: "I baked Monday - Saturday each week, trying to keep Sunday as a rest day. I would bake early in the morning usually starting between 4-6am, my baking would be done by approx. 10-11am and then I would head out delivering." },
      { type: "paragraph", text: "Deliveries would be completed by 1:30pm (I always had a set time frame for deliveries 10-1:30pm) then I would head back to work on admin on my laptop. This included updating my website, responding to emails, creating content, bookkeeping, managing inventory etc. I would finish around 3pm and monitor the website in the evening until 9PM for any late orders that came in." },
      { type: "paragraph", text: "Don’t get me wrong, not every day would look like this, especially in busy seasons. It’s important to create a schedule that works for you and does not lead to burn out - working in a kitchen is quite laborious and shouldn’t be underestimated." },
      { type: "paragraph", text: "I used my calendar to organise pretty much every hour of the day, it was so important for me to keep on top of things and know what needed to be done when." },
      { type: "paragraph", text: "Remember, this is what worked for me. Your ideal set-up will depend on the products you sell, your customers, and the area you live in. For example, if you’re selling celebration cakes, most events take place at the weekend, so having a Saturday morning collection window might work perfectly for your customers. I sold everyday baked goods and delivered throughout the week, so my operations were built around a completely different schedule. The best approach is to start with a set-up that makes sense for your business, test it out, and adjust it as you learn what works best for you and your customers." },
      { type: "image", key: "pb_39", caption: "" },
      { type: "paragraph", text: "Customer service is a massive thing for me. I believe so strongly that good customer service can make or break a business." },
      { type: "paragraph", text: "I like to focus on quick response times to emails, DM’s or comments, as well as a friendly approach when interacting with customers. Sometimes people can be difficult so it’s important to handle your contact with them in a professional way. This is imperative for when you are dealing with a complaint or unhappy customer, because at some point, we are all likely to get one." },
      { type: "paragraph", text: "Don’t take it to heart and focus on how you can fix the problem and improve their experience. Own the error (if you made one) and ensure you make the customer feel heard. When they are unhappy they will value somebody listening to them and providing them with a solution. It’s not worth fighting with customers and it’s not worth ruining your reputation." },
      { type: "paragraph", text: "I’d suggest getting a domain for your business e.g. info@molliescupcakes.com. It looks professional and is great if you are attracting customers outside of social media - not everybody uses it, especially not corporate clients. You can use hosting sites like go daddy which usually comes with a small annual fee (totally worth it in my opinion)." },
      { type: "image-row", items: [{ key: "pb_40", caption: "" }, { key: "pb_41", caption: "" }] },
      { type: "heading", text: "Things I Wish I Knew at the Start" },
      { type: "paragraph", text: "If I were to start again now, there are a few things I would do differently, which I think is normal when reflecting on a journey which started 10 years ago." },
      { type: "paragraph", text: "Firstly, I would take more photos and videos to share more of my journey online. I was focussed on creating a professional brand which prevented me from sharing the more personal side of my experiences in business - hence why I’m sharing more than ever here with Kneada!" },
      { type: "paragraph", text: "I would advertise and market more than I thought I needed to. Previously, I created content, got busy with orders and then forget about marketing because I was focusing on fulfilling orders and nothing else. This can lead to inconsistencies with sales and can also make it harder for your audience to follow your journey. Don’t post & ghost - try to show up consistently (this doesn’t have to be everyday) just a schedule that is manageable for you." },
      { type: "paragraph", text: "In the first 6 months of 2024 I only posted these 15 posts - that was it! In hindsight now, I’m asking myself why! I guess I felt too busy to post, but my engagement really suffered. I would also experience quieter times and wonder why sales had dropped off.. now it’s pretty clear to see!" },
      { type: "image", key: "pb_42", caption: "" },
      { type: "paragraph", text: "Embrace set backs and failure, some of my best times and biggest lessons came from things that went wrong. You can’t grow if you aren’t willing to try new things, even if they don’t work out." },
      { type: "paragraph", text: "Learn how to say no and set boundaries. It’ tempting to say yes to last minute orders even when you’re fully booked but it’s not always worth it. I struggled with saying no, especially at first. My days got longer and alarms got earlier to take on all the extra work, which resulted in me being really burnt out. I fell out of love with my business and resented going into work each day. This is not how it should’ve felt and certainly not how I want you to feel." },
      { type: "paragraph", text: "Your boundaries should be based around what is manageable for you and not what other people are doing. If you can only dedicate 2 days per week to your business and that works for you - that is totally fine!" },
      { type: "paragraph", text: "Don’t compare yourself to others. I got distracted by focusing on competitors - what customers they had, what orders they were winning and what products they were selling. I had to remind myself that I had my own customers who chose to buy from me for a reason." },
      { type: "paragraph", text: "You don’t want to fall down a rabbit hole of scouring their profile (I’ve been there before and it was not productive!). There’s a fine line between taking inspiration from others and feeling envious of what they are doing, make sure you’re on the positive side of that line." },
      { type: "paragraph", text: "“Don’t let someone else’s highlight reel dim the magic of your own progress”" },
      { type: "paragraph", text: "Remember, you are in control of your business, so you get to decide exactly what you want to offer and how to offer it." },
      { type: "heading", text: "You don’t need to have it all figured out now — but every decision you make, helps shape your business. Some things to consider:" },
      { type: "list", items: [
        "Will you offer collection or delivery? I always opted for delivery (which I charged extra for) because customers do not always adhere to collection times. Too many afternoons would be spent waiting in for people to show up, arrive late or forget altogether. Whichever you choose, make sure you have a solid system in place to ensure your customers respect and value your time.",
        "When will you bake - do you bake on a set day each week or as and when an order comes in?",
        "Will you attend events and bake ahead of time or will you concentrate on pre orders only?",
        "Will you sell locally or ship nationally?",
        "How much time can you dedicate to your business? Are you going in full time or are you wanting to make some extra cash on the weekend? Try not to commit to more than you are able too.",
        "Do you want to offer custom orders or stick to a fixed menu?",
        "What does success look like for you in 6 months? This will be different for everybody but will help you work out what you actually want to achieve with your business.",
        "How will customers order from you - DMs, email, a form, or a website? I eventually set up a shopify store which meant that customers ordered from my fixed offerings and I received all their order and delivery details without even having to interact with them, the payment was also taken care of. You don’t need to do this to begin with but I do recommend having some sort of standard response so you can capture all the details required without lots of back and forth with the customer.",
        "How will you take payment? I started by just taking cash. You can also use PayPal, Revolut, bank transfer, send out invoices or take card payments. There’s no right answer, just whatever works for you. Some of these payment merchants do take a % fee, so my preference was card payments via my website or invoices settled by bank transfer.",
        "Where will you purchase your ingredients? Whilst it’s ok to use supermarkets for the odd thing here and there, I would not use a supermarket as your supplier. Wholesalers can usually offer you much better prices for buying in bulk (I got an extra 12.5% off the prices shown just by opening a trade account). You don’t need a big business to do this either, and often they will deliver right to your door.",
        "How will you track your expenses/accounts? I used Quickbooks for all my bookkeeping. It’s really user friendly and has quite a low monthly fee. It is crucial to understand your finances and work out how much you are making vs. spending. I updated this weekly so it was always manageable.",
        "How will you structure the business? I started off as a sole trader and then switched to a limited company. This is a really personal choice and will depend completely on your circumstances - both options have pros and cons. For me, when I was a sole trader, any money the business made was classed as my income for tax reasons because me and the business were seen as one entity. When I switched to a limited company, the business was its own entity (the company) and I was my own entity . You can always seek advice if you need help in this area from an accountant - I am by no means a professional!",
        "How will you track your sales? Another important thing to monitor, especially if you are wanting to make this your full time income or grow your business. Each week on a Sunday I would sit an review all the orders that have gone out that week. I set up a simple spreadsheet which listed the products sold, the quantity sold and the amount of money made from each product sold. It was really useful for me to analyse what products were popular and what products did not sell so well, it can be useful for seasonal trends and future planning. When you are looking at these stats alongside the monetary value, it’s a good way to see whether the products are worth your time. If not, perhaps try taking them off your menu. Cupcakes were always a clear winner for me and my biggest money maker, but I wouldn’t know this without tracking and reviewing regularly.",
        "Who is your target market? Do you want to appeal to the wedding industry or attract corporate clients? Maybe you want to bake kids birthday cakes or be the go to person for sourdough baked goods?"
      ] },
      { type: "paragraph", text: "I want this guide to be a useful starting point for you, and not overwhelm you with too much info all at once." },
      { type: "paragraph", text: "I truly hope you find this informative and like I said, am happy to help no matter where you are in your business journey." },
      { type: "paragraph", text: "Just remember, I’ve been there - the good and the bad. I've felt the highs of good days but I’ve also felt lonely, anxious and stressed, thinking nobody would understand my worries." },
    ]
  },  "starting-second-time": {
    hero: null,
    blocks: [
      { type: "paragraph", text: "Summer 2026 Update" },
      { type: "paragraph", text: "For those of you who don’t know, I closed my baking business and moved to Canada. I’m now in the process of starting a brand-new baking business in Canmore, Alberta with my partner and best friend." },
      { type: "paragraph", text: "One thing I always say is that the best way to prove something works is to try it yourself. I used the methods in this guide to build my first business, and now I’m doing it all over again." },
      { type: "paragraph", text: "We’ve been open for less than a week and have already secured our first order, plus two additional enquiries." },
      { type: "image", key: "start2_0", caption: "" },
      { type: "heading", text: "So what did we actually do?" },
      { type: "paragraph", text: "First, we created Facebook and Instagram pages and made it clear where we’re located so local customers knew immediately whether we were relevant to them. Next, we shared personal introductions for each of us, along with photos and a little bit about our story." },
      { type: "paragraph", text: "People don’t just buy products, they buy from people. Showing who we are helps build trust and allows customers to become invested in our journey." },
      { type: "paragraph", text: "We also delivered free sample boxes to local businesses. This introduced people to our products and generated some of our first followers. Once people had tried the products, many naturally wanted to learn more about us." },
      { type: "image-row", items: [
        { key: "start2_2", caption: "" },
        { key: "start2_3", caption: "" }
      ]},
      { type: "paragraph", text: "Rather than baking lots of stock and hoping it would sell, we launched with a simple pre-order system. We advertised delivery boxes for Friday and started promoting them the week before." },
      { type: "paragraph", text: "Our post clearly included:" },
      { type: "list", items: [
        "What products were included",
        "The flavours available",
        "The price",
        "Where we were located",
        "Delivery details and timings",
        "How to order"
      ]},
      { type: "paragraph", text: "Customers already had everything they needed to make a decision. All they had to do was send us a message to secure a box." },
      { type: "image", key: "start2_4", caption: "" },
      { type: "paragraph", text: "We then shared the post into local Facebook groups with a short introduction about who we are and what we were offering. This is exactly how our first order came in. A local customer saw the post, visited our page, liked what she saw, and sent us a message to order." },
      { type: "paragraph", text: "Interestingly, this is now the second baking business I’ve started where the very first order came through Facebook — not Instagram. Since then, we’ve received two more enquiries, both through Facebook as well." },
      { type: "heading", text: "Key Takeaways" },
      { type: "paragraph", text: "Don’t ignore Facebook. A business page combined with local Facebook groups can be incredibly powerful, especially when you’re first starting out." },
      { type: "paragraph", text: "Show yourself, not just your products. There’s no need to hide behind your brand. Customers often connect with the people behind the business before they ever place an order." },
      { type: "paragraph", text: "Give customers a clear offer. A gallery of beautiful product photos might look impressive, but it doesn’t tell customers what they can actually buy. Make it easy for people to order by clearly showing your products, pricing, flavours, collection or delivery information, and how to enquire. The fewer questions customers need to ask, the easier it is for them to place an order." },
      { type: "paragraph", text: "Use clear, professional-looking photos. Good lighting, clean backgrounds, and sharp images help customers see exactly what they’re buying. Your photos don’t need to be perfect, but they should make your products look appealing and easy to trust." },
      { type: "heading", text: "Things we needed to make a start" },
      { type: "list", items: [
        "We registered as a business so that we had an entity to sell under and could open a bank account to take customer payments. This keeps things easier than doing it all via your personal accounts!",
        "We applied for a business licence in our local town so we were allowed to sell our products — there was a small fee associated but because we are baking from home it was pretty straightforward and we could apply online. An inspection of the home kitchen was not required in this case due to the low risk products being sold.",
        "We obtained public liability insurance so we were safe to sell to the public. This would have been a requirement if we were attending the local markets, but unfortunately they were all full for the summer!",
        "We opened a business bank account as mentioned to make taking payments and making business purchases easier to keep track of.",
        "We set up our social pages and a business email to take orders and advertise.",
        "We now also have a website created on Shopify which has been great for showcasing products and taking orders. The customer can freely browse, see the flavours and pricing and place the order online if they wish.",
        "We have simple off the shelf packaging which is pretty plain but does the job. We have ingredients labels and branded stickers which go on every box so we meet the legal requirements and also have our brand on display!"
      ]}
    ]
  },

        "cookie-recipe-pack": {
    hero: null,

      { type: "heading", text: "My Ultimate Cookie Recipe Pack" },
      { type: "paragraph", text: "Everything you need to bake, package, and sell NYC-style cookies — method, flavour recipes, tools & supplies, make-ahead tips, and the warming card template." },
      { type: "callout", text: "<a href=\"Cookie-Recipe-Pack.pdf\" target=\"_blank\" rel=\"noopener\" style=\"color:inherit;font-weight:700;text-decoration:underline;\">Click here to access the cookie bundle</a> — opens the full PDF in a new window so you can view or download it." },

    "marketing-guide": {
    hero: null,
    blocks: [
      { type: "paragraph", text: "You really don’t need complicated ads, a huge following, or a marketing degree to grow your baking business — you need the right ideas. I didn’t have any of those things, and still managed to turn my home bakery idea into a full time income. This meant I could leave my corporate job and rent a commercial kitchen to work from, amongst many other milestones!" },
      { type: "paragraph", text: "Here I’m sharing the exact marketing moves and ideas I used to boost orders, sell out events, and grow a loyal customer base — without following trends or overspending." },
      { type: "paragraph", text: "This guide is for the bakers who don’t want the usual marketing jargon (half the time, I don’t understand it!) but want real examples from a baker who’s actually tried and tested these ideas in her own business." },
      { type: "paragraph", text: "People love baked goods and I don’t see that changing any time soon. They look good, smell good, make people feel good and when you learn how to position them right, selling gets a whole lot easier." },
      { type: "heading", text: "Easy Ordering" },
      { type: "paragraph", text: "I used to think I needed to compete on price to get more sales, but that just meant more work for less money." },
      { type: "paragraph", text: "Once I got clearer on what made my bakes special (like my consistent branding, reliable quality, and solid packaging), I started pricing accordingly." },
      { type: "paragraph", text: "I thought for a long time that raising my prices to reflect my value would result in me losing customers but of course, it didn’t." },
      { type: "paragraph", text: "Raising my prices and charging accordingly allowed me to do things like discounts and special offers, which is a more appealing offer to a customer." },
      { type: "paragraph", text: "I didn’t always offer big, expensive bundles. Sometimes a 4 or 6 piece box felt way more “affordable” for new customers but still profitable for me." },
      { type: "paragraph", text: "I invested in my packaging which made it feel like a gift." },
      { type: "paragraph", text: "Stickers, thank you notes, gift cards etc. These small touches made my cookies and cupcakes feel special — not just like a cake in a box. People will pay, you just need to give them a product and service worth paying for!" },
      { type: "paragraph", text: "Make it ridiculously easy to buy from you. Even if it feels obvious to you, your customers might not know how to place an order and not everyone will ask." },
      { type: "paragraph", text: "I had a pinned post on my page that listed exactly how to order step by step and what my prices were. Even after I set up a Shopify store to automate everything, not everyone used it and that’s okay!" },
      { type: "paragraph", text: "Try to keep your ordering process as simple as possible, capture all the information you need from them and provide the customer with anything they need to know, but don’t overcomplicate it. You want to reduce the need for them to DM you and ask questions where possible." },
      { type: "image-row", items: [{ key: "sjm_01", caption: "" }, { key: "sjm_02", caption: "" }] },
      { type: "paragraph", text: "My favourite ways to take orders are the following:" },
      { type: "paragraph", text: "Facebook — Most people messaged my business page directly with their order details. It’s simple, casual, and great for local customers who already use Facebook regularly. TIP: Keep your response time fast and your message pinned with clear instructions (like “To order, please send your date, quantity, and flavours”). The easier you make it, the more people will follow through" },
      { type: "paragraph", text: "Instagram — DMs work really well, especially if you’re active on Stories. When you post engaging content or promote products, people can reply instantly and place an order right there in the DMs. TIP: Use your highlights to save your prices, flavours, and order process — so when someone’s ready, they don’t have to ask for the basics first. Reducing “friction” gets you more orders" },
      { type: "paragraph", text: "Email — I found this best for formal or corporate orders. It’s also perfect for people who don’t use social media. Having a dedicated business email helps you stay organised — you just need to stay on top of your inbox. TIP: Create a simple email template for enquiries so you can reply fast and look professional (e.g. confirming date, quantity, flavours, price, and payment info)" },
      { type: "paragraph", text: "Website — When I eventually set up a Shopify site, it was a game changer. I didn’t do it right away, but once I did, everything became easier. Your website lets customers browse your products and prices without needing to message you — and they can place orders directly" },
      { type: "paragraph", text: "TIP: Use your social media to drive traffic to your website. Link specific products in your Stories and keep your homepage simple, too many options can confuse people" },
      { type: "paragraph", text: "In my experience, the easier and faster you make it for someone to buy, the more likely they are to follow through. I found I didn’t need more followers, I needed a smoother way for people to order." },
      { type: "paragraph", text: "Make sure your order process is clear and visible (it should take 10 seconds or less for someone to know how to order)." },
      { type: "paragraph", text: "Don’t rely only on people remembering to message you. Add prompts under your posts or in your captions, you want them to see your post and follow through to buy. Make sure you encourage that, but don’t just ask them to buy from you" },
      { type: "paragraph", text: "Keep an active story highlight with your ordering info, lead times, and prices" },
      { type: "heading", text: "Email Marketing" },
      { type: "paragraph", text: "This is the number one thing that consistently brought in money for me. Unlike social media, you don’t have to battle with algorithms or worry about posting at the perfect time. If you land in someone’s inbox, you’re right there, waiting to be opened. I collected emails mostly through my website. Whenever someone placed an order, they were automatically added to my list (they could unsubscribe at any time, of course)." },
      { type: "paragraph", text: "I also used Facebook and Instagram to encourage sign- ups, teasing them with perks like 10% off their first order or early access to exclusive products and discounts." },
      { type: "paragraph", text: "Trust me - special offers get people moving!" },
      { type: "image-row", items: [{ key: "sjm_03", caption: "" }, { key: "sjm_04", caption: "" }] },
      { type: "image", key: "sjm_05", caption: "" },
      { type: "paragraph", text: "Be careful not to spam people with emails. I kept it simple: new flavours and updates or a sporadic discount code." },
      { type: "paragraph", text: "If I was having a slow week or just felt like giving sales a nudge, I’d send out a random discount. Not for a birthday or national holiday — just because. Last summer, I literally sent an email to say “Too hot for cake? Here’s a discount anyway.”" },
      { type: "paragraph", text: "The idea is to grab their attention, get them clicking, and give them a reason to order. I run them for one day only, which worked well — it created that sense of urgency, and let’s be real, it’s not that hard to impulse-buy baked goods. Those emails often brought in quick orders, reminded people I existed, and made my regulars feel looked after. I use Shopify to create the email campaigns. For me, each email could generate £100–£600+ in extra sales!" },
      { type: "image-row", items: [{ key: "sjm_06", caption: "" }, { key: "sjm_07", caption: "" }] },
      { type: "image", key: "sjm_08", caption: "" },
      { type: "heading", text: "Flash Sales" },
      { type: "paragraph", text: "One of my go-to strategies, but I did them a bit differently. I’d post in the morning saying something like, “I’ve got three cupcake boxes available TODAY — message me if you want one,” along with a photo (often from a previous order)." },
