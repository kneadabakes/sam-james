      { type: "paragraph", text: "After every seasonal event, I always took time to reflect properly. Nothing formal just honest notes on what worked and what didn’t. What sold well, what didn’t move, whether I felt organised or overwhelmed, and where I lost time. I also looked at how long everything actually took me to produce. That’s one of the most useful things you can track, because it shows your real capacity. Over time, this helps you figure out things like whether you can realistically take more orders next time, or whether you actually need help during busy periods. It also shows you where your bottlenecks are — baking, decorating, packing, whatever it might be. Every time you do this, the next event becomes smoother because you’re not starting from scratch. You’re refining a system instead of repeating chaos." },
      { type: "heading", text: "The bigger picture" },
      { type: "paragraph", text: "At the end of the day, Father’s Day isn’t about creating the most impressive or complicated products." },
      { type: "paragraph", text: "It’s really just about solving a simple problem. People want to show up with a gift that feels thoughtful, without having to think too hard about it." },
      { type: "paragraph", text: "So your job is to make that easy. Keep the menu simple, keep the process clear, and make the whole thing feel effortless for the customer. When you do that, you’re not just selling cake — you’re selling convenience, and that’s what people are actually paying for." },
      { type: "heading", text: "PRODUCT INSPO" },
      { type: "paragraph", text: "Cupcakes & selections.. you can probably see my theme here. Chocolate, Mars, caramel, Ferrero Rocher… simple but effective flavours. The goal was to make the cupcakes look really tasty while still keeping them appealing for dads too!" },
      { type: "paragraph", text: "You could definitely add cookies into your selection too. Pick your favourite or best- selling products and build your own box around them." },
      { type: "paragraph", text: "I loved doing the loaded brownies — they felt a little different and helped me stand out compared to other bakers in my area. My chocolate mix usually included Oreos, Mars, Twix and Kinder chocolate. I also tended to avoid nuts in my selection to keep things simple and stress-free too!" },
      { type: "image-row", items: [{ key: "fd_07", caption: "" }, { key: "fd_08", caption: "" }] },
      { type: "image", key: "fd_09", caption: "" },
      { type: "heading", text: "Final note" },
      { type: "paragraph", text: "I think people often overlook Father’s Day because baking is sometimes seen as more of a feminine or girly thing — but it’s still a huge opportunity for bakers. Every occasion is a chance to get your products in front of new people, attract new customers and stay visible online. The occasion itself gives people a reason to buy, and that’s often the biggest part of making sales. When customers already have a reason to treat someone, celebrate or gift something, it becomes much easier for them to say yes to your baking." },
      { type: "paragraph", text: "As you can see, these are all real products that genuinely made me profit in my own business — not just nice ideas or theoretical suggestions. Everything in this pack is based on what actually sold for me in the real world." },
      { type: "image-row", items: [{ key: "fd_10", caption: "" }, { key: "fd_11", caption: "" }] },
    ]
  },
    "smores": {
    hero: { key: "sm_01", caption: "Start selling S'MORE — cupcakes, brownies, cookies + more." },
    blocks: [
      { type: "heading", text: "Intro" },
      { type: "paragraph", text: "I used to think S’mores were an Autumn/Winter thing… now they seem to be here to stay all year round. That being said, I always associate S’mores with Bonfire Night, so that’s why I’m sharing this recipe pack with you now!" },
      { type: "paragraph", text: "This pack is designed to give you some inspiration with a selection of products you can create, either for family & friends or sell within your business. I have had massive success in selling these products in previous years so I can’t wait to share them with you! These recipes helped me sell out every Bonfire Night — now they’re yours to recreate, reimagine, and make your own." },
      { type: "paragraph", text: "Whether you’re baking for fun or turning it into profit, this pack is designed to help you create products that actually sell." },
      { type: "image", key: "sm_02", caption: "" },
      { type: "heading", text: "Mallow icing" },
      { type: "paragraph", text: "I wanted to start by sharing this recipe because I use it for my cupcakes, brownies, and cookies. This mallow icing was inspired by Cupcake Jemma, and after making it plenty of times myself, I can confirm — it turns out perfectly every time. It’s silky, marshmallowy, and so easy to whip up. You can also double the recipe if you need a larger batch." },
      { type: "recipe", title: "Ingredients", items: ["90g caster sugar", "1 large egg white", "2 tbsp golden syrup", "1 tbsp water", "Pinch of salt", "⅛ tsp cream of tartar"] },
      { type: "list", items: [
        "Add all the ingredients to a heatproof bowl and place it over a saucepan of gently boiling water",
        "Using an electric hand whisk, beat the mixture while it heats. The warmth will cook the egg whites — whisk for about 10 minutes until it thickens and starts to fluff up, almost like making meringue",
        "Remove the bowl from the heat and continue whisking for at least 5 more minutes. It should become thick, glossy, and hold its shape — you’ll notice the texture change as you go",
        "Let it cool completely before using (ideally in the fridge)"
      ]},
      { type: "image", key: "sm_03", caption: "" },
      { type: "heading", text: "S’mores brownies (6 brownies)" },
      { type: "recipe", title: "Ingredients", items: ["83g margarine", "83g 54% dark chocolate", "20g cocoa powder", "2 eggs (medium)", "76g plain/all-purpose flour (10.5% protein)", "223g caster sugar"] },
      { type: "list", items: [
        "Melt the margarine and chocolate together in a heatproof bowl. I use the microwave in 30-second bursts to prevent burning. Stir until smooth and set aside",
        "Measure out your dry ingredients and eggs (no need to pre-beat the eggs)",
        "In a large bowl, add your sugar, flour, and cocoa powder. Pour over the melted chocolate and margarine mixture and add your eggs",
        "Fold everything together, scraping the sides and bottom of the bowl. This batter is quite thick, so make sure no dry pockets remain",
        "Pour into a lined 7” square brownie tin. Work quickly — the mixture thickens as it cools. I use two long strips of greaseproof paper with mini metal bulldog clips to hold them in place",
        "Bake at 160°C for 32 minutes in a preheated fan oven",
        "Leave the brownie in its tin to cool for AT LEAST 2 hours (I usually finish cooling in the fridge). This will make it easy to remove and chop up into 6 pieces",
        "Pipe your mallow icing on using a round nozzle (Wilton 1A is my go to). Then use a mini blowtorch to toast some of the mallow. I like to do some parts more toasted than others to make it look better!",
        "Finally, add some crushed digestive pieces — I like to place these carefully instead of sprinkling them — and drizzle melted chocolate over the top. You can use a spoon or a piping bag if you prefer it neater",
        "Keep them in the fridge for storage and consume within 3–4 days for the best taste. I package these in pizza-style boxes — they fit perfectly and look professional for selling"
      ]},
      { type: "image-row", items: [
        { key: "sm_04", caption: "" },
        { key: "sm_05", caption: "" }
      ]},
      { type: "image", key: "sm_06", caption: "" },
      { type: "heading", text: "S’mores cookie sandwiches (approx. 14 sandwiches)" },
      { type: "recipe", title: "Ingredients", items: ["230g unsalted butter", "100g caster sugar", "160g light brown sugar", "300g milk choc chips", "400g plain flour", "100g self-raising flour", "Pinch sea salt", "2 tsp baking powder", "2 eggs + 1 egg yolk"] },
      { type: "list", items: [
        "Add caster sugar and light brown sugar to your mixing bowl and hand mix briefly. Chop your butter into small cubes, around 2–3cm each, and add to your sugar",
        "Mix on a slow speed until they come together and the butter breaks down into smaller pieces covered with sugar — it’s a lumpy sand consistency but not too fine. You do NOT want to cream them",
        "Choc chips go in whilst the mixer is still going at a slow speed. Keep an eye on your cookie dough constantly — over/under mixing can cause problems when it comes to baking",
        "Hand mix flour, baking powder & salt BEFORE it goes in so everything is combined. Add the dry ingredients to your dough and mix on a low speed until the ingredients are evenly distributed with small sugary/floury/buttery nuggets",
        "Add your pre-whisked eggs to your mixer on a low speed. Watch this step carefully — it won’t take long for your dough to come together. Once it has almost come to one big batch of dough, that is when you stop. You should also hear a change in the mixer; it will sound like it is starting to struggle — don’t go further than this!",
        "Spread your dough onto a baking tray and pull it apart before forming the cookie balls. Ball into 50g cookie dough balls — press together creating a ball but not squeezing too hard so it still has texture",
        "Chill them in the freezer for at least 4 hours. I always make cookie dough the day BEFORE it is needed. Frozen dough balls keep for 3–4 weeks",
        "Bake for 9–10 minutes at 180°C in a preheated fan oven. Leave on the tray for at least 30 minutes to finish baking and cool",
        "Turn them upside down and pipe a ring of mallow icing with a round nozzle (not too close to the sides or too thick). Fill the centre with melted chocolate, sandwich together, and toast the mallow with a mini blowtorch",
        "Store in the fridge and eat within 2–3 days for the best taste"
      ]},
      { type: "image", key: "sm_07", caption: "" },
      { type: "image", key: "sm_08", caption: "" },
      { type: "image-row", items: [
        { key: "sm_09", caption: "" },
        { key: "sm_10", caption: "" },
        { key: "sm_11", caption: "" }
      ]},
      { type: "heading", text: "S’mores cupcakes (12 regular cupcakes)" },
      { type: "recipe", title: "Cupcake batter", items: ["200g margarine", "200g caster sugar", "200g self-raising flour", "4 eggs (weighing 200g)", "Dash cocoa powder", "Optional choc chips"] },
      { type: "recipe", title: "Biscuit base", items: ["150g crushed digestive biscuits", "15g melted butter", "1 tablespoon golden syrup"] },
      { type: "list", items: [
        "Start by creaming the margarine & sugar together until a pale yellow colour with a slightly grainy texture",
        "Add flour & eggs (eggs pre-stirred in a separate bowl). Mix on slow speed until combined",
        "Add cocoa powder by eye — approx. 1 tsp is enough. This isn’t a batter with a rich dark chocolatey colour, so don’t keep adding to achieve that colour!",
        "Once just about combined, blast the mixer for 10 seconds on medium speed to put some of the air back in. Scrape down, add a handful of chocolate chips and give a final hand mix",
        "Distribute your biscuit base mix into a lined baking tray and squash it down. Then distribute chocolate cake batter on top — cases about ¾ full. Tap the tray to remove air bubbles",
        "Bake for 20–22 mins at 160°C (preheated fan oven). Cupcakes should spring back slightly when you touch the top",
        "Cool on a wire rack for 30–40 minutes at room temperature, then pipe mallow icing with a large round nozzle, toast with a mini blowtorch, and finish with melted chocolate drizzle and crushed digestives",
        "Store at room temperature in an airtight container for 2–3 days"
      ]},
      { type: "image", key: "sm_12", caption: "" },
      { type: "heading", text: "S’mores selections" },
      { type: "paragraph", text: "This is where you bring together a combination of the previous products! These have been so popular with my customers — they’re fun and exciting because you get a little bit of everything (and everybody loves S’mores!)." },
      { type: "paragraph", text: "I included: 2 cupcakes, 2 cookie sandwiches, 2 brownies. You can put in your selection boxes whichever combos you fancy — try not to overcomplicate it for yourself. Rocky Road is another item you could add/use instead because it fits in with the biscuit/marshmallow theme." },
      { type: "paragraph", text: "You want it to be easy enough for you to prepare all the different products when people place an order. I decided to only offer these boxes on set days, so I could bake a load at once, rather than literally baking 2 cupcakes, 2 brownies & 2 cookies at a time (that would be inefficient!). That batching strategy is one of the biggest things that helped me scale my sales and stay sane during busy seasons." },
      { type: "image", key: "sm_13", caption: "" },
      { type: "heading", text: "Bonus: rocky road recipe" },
      { type: "recipe", title: "Ingredients", items: ["120g margarine/butter", "120g dark chocolate", "80g milk chocolate", "150g marshmallows", "200g Oreos", "Dash golden syrup"] },
      { type: "list", items: [
        "Melt the butter with dark and milk chocolate, ensuring all the chocolate is covered by the melted butter when mixing",
        "Line a 7\" tin with a sheet of greaseproof paper",
        "Crush your Oreos into small chunks and mix with the marshmallows",
        "Add a dash of golden syrup to your melted chocolate mix (this helped to keep it together later on)",
        "Add the chocolate mix to the Oreo marshmallow mix and stir together making sure everything is coated",
        "Fill your lined tin with the rocky road mix and flatten with a spatula to pack it tightly",
        "Put it in the freezer for at least 2 hours. After that, store it in the fridge otherwise it can become a little melty"
      ]},
      { type: "image", key: "sm_15", caption: "" }
    ]
  },

    "subscription-boxes": {
    hero: null,
    blocks: [
      { type: "heading", text: "Subscription Boxes" },
      { type: "paragraph", text: "Another fun concept to introduce is a monthly subscription-style Mystery Box. Customers pay a set price each month and receive a surprise delivery of freshly baked treats – think limited-edition flavours, seasonal specials, or a variety pack of customer favourites." },
      { type: "image-row", items: [
        { key: "ideas_p27_51", caption: "" },
        { key: "ideas_p27_52", caption: "" }
      ]},
      { type: "heading", text: "Why it works" },
      { type: "list", items: [
        "Recurring revenue for you. This creates predictable, consistent income you can rely on month after month.",
        "Excitement for your customer. People love surprises – and the idea of receiving a curated box of sweet treats to look forward to each month is irresistible.",
        "Product testing without the pressure. Mystery boxes are a great way to trial new flavours and get real feedback before adding them to your permanent menu.",
        "Loyalty booster. Subscribers often feel like part of an inner circle – they’re more likely to stick around, reorder, and shout about your business."
      ]},
      { type: "paragraph", text: "I keep it simple: one set price, a limited number of spots each month, and local delivery or collection. But you could adapt it to suit your business – offer themed boxes, add an exclusive bonus item, or even include handwritten notes to add a personal touch. It’s not just a box – it’s a brand moment your customers will look forward to again and again." },
          ]
  },
    "story-ideas": {
    hero: null,
    blocks: [
      { type: "heading", text: "Feel Good Friday" },
      { type: "paragraph", text: "I set up a small, fun concept that engaged my followers, got a bit of buzz going on my page, and hardly cost anything. It was called ‘Feel Good Friday’ — a little game (usually on Insta stories with a question box so you can track answers), the winner would get a box of 4 cupcakes/cookies. Set a countdown so people remember." },
      { type: "image-row", items: [
        { key: "ideas_p30_57", caption: "" },
        { key: "ideas_p30_58", caption: "" }
      ]},
      { type: "image-row", items: [
        { key: "ideas_p30_59", caption: "" },
        { key: "ideas_p30_60", caption: "" }
      ]},
      { type: "paragraph", text: "You could also give away a voucher — people will take part for the chance to win something, but they don’t always end up redeeming them — so you aren’t actually giving anything away!" },
      { type: "heading", text: "Engagement ideas that worked" },
      { type: "list", items: [
        "Guess the weight of something baking-related — put it on a digital scale with the weight blocked out",
        "This or that polls (chocolate or vanilla, cookies or cupcakes)",
        "Name that flavour from a close-up photo",
        "Countdown stickers until order slots close"
      ]},
      { type: "image-row", items: [
        { key: "ideas_p31_62", caption: "" },
        { key: "ideas_p31_63", caption: "" }
      ]},
      { type: "heading", text: "Easy Story ideas" },
      { type: "paragraph", text: "Piping videos, trays coming out of the oven, packaging orders, flavour polls, countdowns until orders close, or writing names on cookie boxes. Don’t overthink it — people love seeing the process, even the messy parts. What seems boring to you may not be to an outsider. Set your phone up to record a few times during a baking day, you can split videos up into little clips to use on stories or make a reel." },
      { type: "image", key: "ideas_p32_64", caption: "" },
      { type: "paragraph", text: "If someone replies to your Story, reply back and keep the convo going. A lot of my orders came from chats that started in the DMs — especially when I posted something limited or time-sensitive." },
      { type: "paragraph", text: "Some posts won’t get many likes. That’s normal. Your goal isn’t to go viral — it’s to stay visible to the people who are already watching, even if they’re quiet. They’re often the ones who’ll buy." },
      { type: "heading", text: "Stories & posts that keep people engaged" },
      { type: "paragraph", text: "Make use of the tools Instagram gives you like links, polls, stickers etc. Share snippets of your products in real time whilst subtly encouraging customers to buy." },
      { type: "image-row", items: [
        { key: "ideas_p41_72", caption: "Like and share comps" },
        { key: "ideas_p41_73", caption: "Showing packaging" },
        { key: "ideas_p41_74", caption: "Weekly availability" }
      ]},
      { type: "image-row", items: [
        { key: "ideas_p41_75", caption: "Product range without hard-selling" },
        { key: "ideas_p41_76", caption: "New product + link" },
        { key: "ideas_p41_77", caption: "Trending audio + buy link" }
      ]}
    ]
  },
    "email-campaign-ideas": {
    hero: null,
    blocks: [
      { type: "heading", text: "Email Campaign Ideas" },
      { type: "paragraph", text: "These are some real examples of the email campaigns I sent out to generate orders. They made anywhere from £100–£700 in extra sales in just one day." },
      { type: "paragraph", text: "As you can see, they’re all a bit of fun and not your usual boring emails. I also signed up to my own mailing list so I could see the emails from the customer’s point of view." },
      { type: "paragraph", text: "I ALWAYS keep the window for these offers small — 24 hours or less. It encourages impulse buys and gets people to act FAST." },
      { type: "paragraph", text: "Sending them mid week or sporadically worked great because they were never ‘expecting’ the discount or waiting for it." },
      { type: "image-row", items: [
        { key: "ideas_p39_66", caption: "" },
        { key: "ideas_p39_68", caption: "" }
      ]},
      { type: "image-row", items: [
        { key: "ideas_p39_67", caption: "" },
        { key: "ideas_p39_69", caption: "" },
        { key: "ideas_p39_70", caption: "" }
      ]},
      { type: "paragraph", text: "Keep the tone friendly, make the offer clear, and always tell people exactly how to order." }
    ]
  },

    blocks: [
      { type: "heading", text: "Occasions" },
      { type: "paragraph", text: "You’re not creating the occasion — you’re reminding people that one already exists. Below are real reasons people buy baked treats." },

      { type: "image", key: "ideas_p47_84", caption: "Weddings — favours, bridal party, engagement treats" },
      { type: "heading", text: "Gifting & personal" },

      ]},

        { key: "ideas_p48_87", caption: "Thinking of you" }
      ]},
      { type: "heading", text: "Corporate gifting" },
      { type: "paragraph", text: "This one is huge. Businesses are always looking for ways to thank clients, reward staff or celebrate milestones. It doesn’t always have to be a huge order either. Even a small box of cookies can be the perfect thank you, welcome gift or team treat." },
      { type: "image-row", items: [

      { type: "heading", text: "Hosting & entertaining" },

      { type: "heading", text: "Work & business" },

      { type: "paragraph", text: "All of these occasions open up opportunities to sell to different customers throughout the year. Instead of relying on people randomly deciding they fancy cake, you’re giving them a reason to order." },

      "valentines-day": {
    hero: { key: "vd_01", caption: "Product ideas to make Valentine's Day special — cupcakes, brownies and more." },
    blocks: [
      { type: "heading", text: "Intro" },
      { type: "paragraph", text: "I know Christmas has basically just passed but we’re already getting organised for the next occasion! Valentine’s Day might only be one day, but for bakers it’s one of the busiest periods of the year." },
      { type: "paragraph", text: "Cupcakes and brownies are the perfect Valentine’s gift — thoughtful, affordable, and easy for customers to say yes to. This pack is designed to give you some inspiration for Valentine’s Day with a selection of different products you can create, either for family & friends or sell within your business." },
      { type: "paragraph", text: "I have had massive success in selling all of these products in previous years so I can’t wait to share them with you! Of course, you can take these ideas and put your own spin on them — get creative." },
      { type: "paragraph", text: "They are all based on the recipes you already use in this guide — it’s just the decorations that are a little different. My favourite part is, you can use these products all year round, just switch up the decor and you’ve got some great staple products!" },
      { type: "paragraph", text: "Most of my Valentine’s Boxes are small and quite low cost. This helps me become an easy choice for people to buy as their gift option. Some people don’t want big fancy or extravagant gifts, just something small to show their token of love and appreciation!" },
      { type: "heading", text: "Loaded Brownie" },
      { type: "paragraph", text: "One of my favourite things to create — and my customers loved them! Use your regular brownie base, then pipe buttercream on using a big round 1A nozzle, with 6x6 blobs of icing to cover the whole surface. Then comes the fun part — get creative!" },
      { type: "paragraph", text: "Add a fondant topper to say “Happy Valentine’s Day”. I like to put my toppers in a cooling oven for 2–3 minutes so they firm up and don’t go droopy. I usually do this once I’m finished baking and the oven is still warm, on a piece of baking parchment on a baking tray — but set a timer! Otherwise you might forget you put them in there." },
      { type: "paragraph", text: "I use an open star nozzle to do red spots dotted around the brownie (and the topper in the middle). I add fondant hearts and red heart sprinkles around the edges. Finish with chocolate chips scattered around — they give each slice a bit of bite and of course taste good!" },
      { type: "paragraph", text: "I opted for an all-red theme but you can mix it up with pink or white too! I like to add a dusting of edible glitter to finish." },
      { type: "image-row", items: [
        { key: "vd_02", caption: "" },
        { key: "vd_03", caption: "" }
      ]},
      { type: "image", key: "vd_04", caption: "" },
      { type: "heading", text: "Cupcakes" },
      { type: "paragraph", text: "Use your usual cupcake base for vanilla, chocolate, or red velvet, then decorate for the occasion — hearts, red and pink buttercream, sprinkles, and themed toppers. Minis work especially well for gifts and sharing boxes." },
      { type: "paragraph", text: "For the chocolate cupcakes, I add a small handful of chocolate chips to the batter along with a dash of cocoa powder — by eye, a little at a time until I’m happy with the colour and flavour. I’m not aiming for that deep, dark “chocolate cake” look — these are a lighter cocoa-infused sponge with plenty of chocolate chips throughout." },
      { type: "paragraph", text: "For the red velvet cupcakes, I also add cocoa powder and red food colouring, again by eye in small stages. I know this isn’t the traditional red velvet method, but it’s never let me down in over 10 years!" },
      { type: "image-row", items: [
        { key: "vd_08", caption: "" },
        { key: "vd_09", caption: "" }
      ]},
      { type: "image-row", items: [
        { key: "vd_10", caption: "" },
        { key: "vd_11", caption: "" }
      ]},
      { type: "heading", text: "Selection Boxes" },
      { type: "paragraph", text: "This is where you bring together a combination of the previous products! These have been so popular with my customers, especially people purchasing them for gifts." },
      { type: "paragraph", text: "They’re fun and exciting because you get a little bit of everything, still keeping with the Valentine’s theme. I offer small and large selections. You can put in your selection boxes whichever combos you fancy — try not to overcomplicate it for yourself." },
      { type: "paragraph", text: "You want it to be easy enough for you to prepare all the different products when people place an order. I decided to only offer these boxes on set days, so I could bake a load at once, rather than baking 2 cupcakes, 2 brownies and some rocky road at a time." },
      { type: "image-row", items: [
        { key: "vd_12", caption: "Large selection" },
        { key: "vd_13", caption: "Small selection" }
      ]},
      { type: "image", key: "vd_14", caption: "" },
      { type: "heading", text: "What made Valentine’s smoother, more profitable, and less stressful" },
      { type: "list", items: [
        "Don’t overcomplicate your menu — people are actively looking for gifts and treats, you don’t need a huge range to convince them",
        "Prep as much as possible in advance: building boxes and packaging, writing gift message cards, buying ingredients, planning exactly what gets baked on which day",
        "Set a standard delivery or pickup window to avoid endless DMs asking “what time will mine be ready?”",
        "Set a realistic limit — and stick to it. Once you hit that number, stop taking orders",
        "Don’t forget about corporate customers — businesses love treating their staff and often have decent budgets. With Valentine’s on a Saturday you can promote corporate orders for the Friday instead",
        "Offer something for single customers — a “Singles Selection” is a small box designed for one, perfect for people treating themselves or friends gifting their single friends"
      ]},
      { type: "paragraph", text: "Valentine’s is a big opportunity, but there’s no pressure to make it huge unless you genuinely want to. Simple, well-planned menus can still bring in great sales without burning you out." },
      { type: "heading", text: "Behind the scenes" },
      { type: "paragraph", text: "My kitchen on the last V Day I baked for… it was a busy morning!" },
      { type: "image-row", items: [
        { key: "vd_16", caption: "" },
        { key: "vd_17", caption: "" }
      ]},
      { type: "image-row", items: [
        { key: "vd_18", caption: "" },
        { key: "vd_19", caption: "" }
      ]},
      { type: "image-row", items: [
        { key: "vd_20", caption: "" },
        { key: "vd_21", caption: "" }
      ]},
      { type: "image-row", items: [
        { key: "vd_22", caption: "" },
        { key: "vd_23", caption: "" }
      ]}
    ]
  },

  "pricing-for-profit": {
    hero: null,
    blocks: [
      { type: "paragraph", text: "Pricing is one of the hardest parts of running a baking business. It's easy to undercharge, overthink, or feel like you're just guessing. This guide walks through how to calculate your costs with confidence, using both real-world strategies (shopping smart, buying in bulk) and modern tools (like ChatGPT) that make the maths easy. By the end you'll have a clear method for any recipe, so you always know exactly what to charge — no more guessing." },
      { type: "image", key: "pricing_boxes", caption: "Prepped and ready to go — packaging sorted ahead of a busy baking day." },
      { type: "heading", text: "Try to avoid supermarkets — use wholesalers for ingredients and supplies" },

function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function highlightText(html, query){
  if(!query) return html;
  const q = escapeRegExp(query.trim());
  if(!q) return html;
  const re = new RegExp(q, "gi");
  // Only highlight text outside HTML tags, so we never touch attributes/markup.
  return String(html).split(/(<[^>]+>)/g).map(part => {
    if(part.startsWith("<")) return part;
    return part.replace(re, m => `<mark class="search-highlight">${m}</mark>`);
  }).join("");
}

let currentQuery = "";

function renderArticle(topicId){
  const art = ARTICLES[topicId];
  if(!art) return "";
  const heroHtml = art.hero ? `
    <figure class="article-hero">
      <img src="${ARTICLE_IMAGES[art.hero.key]}" alt="${art.hero.caption || ''}" />
    </figure>
  ` : "";
  const blocksHtml = art.blocks.map(b => {
    if(b.type === "heading") return `<div class="article-block"><h3>${b.text}</h3></div>`;
    if(b.type === "paragraph") return `<div class="article-block"><p>${b.text}</p></div>`;
    if(b.type === "list") return `<div class="article-block"><ul>${b.items.map(i => `<li>${i}</li>`).join("")}</ul></div>`;
    if(b.type === "callout") return `<div class="article-callout">${b.text}</div>`;
    if(b.type === "recipe") return `<div class="article-recipe-box"><h4>${b.title}</h4><ul>${b.items.map(i => `<li>${i}</li>`).join("")}</ul></div>`;
    if(b.type === "image") return `<figure class="article-image"><img src="${ARTICLE_IMAGES[b.key]}" alt="${b.caption || ''}" /><figcaption>${b.caption || ''}</figcaption></figure>`;
    if(b.type === "image-row") return `<div class="article-image-row">${b.items.map(it => `<figure class="article-image"><img src="${ARTICLE_IMAGES[it.key]}" alt="${it.caption || ''}" /><figcaption>${it.caption || ''}</figcaption></figure>`).join("")}</div>`;
    if(b.type === "pdf") {
      const src = (typeof PDF_FILES !== "undefined" && PDF_FILES[b.key]) || b.src || "";
      return `<div class="article-pdf"><iframe src="${src}" title="${b.title || 'PDF'}" style="width:100%;height:85vh;border:1px solid #ddd;border-radius:8px;background:#fff;"></iframe>
      <p style="text-align:center;margin-top:8px;"><a href="${src}" download="${b.filename || 'guide.pdf'}" style="color:var(--accent);">Download PDF</a></p></div>`;
    }
    return "";
  }).join("");
  return highlightText(`${heroHtml}${blocksHtml}`, currentQuery);
}


let topicData = {};  // topicId -> { text, link }
let activeId = null;

const categoryListEl = document.getElementById("categoryList");
const mainPanel = document.getElementById("mainPanel");
const searchInput = document.getElementById("searchInput");

function allTopics(){ return CATEGORIES.flatMap(c => c.topics); }
function findTopic(id){ return allTopics().find(t => t.id === id); }
function categoryOf(id){ return CATEGORIES.find(c => c.topics.some(t => t.id === id))?.name || ""; }

function hasContent(id){
  const t = topicData[id];
  return !!(t && (t.text || t.link || (t.doc && (t.doc.text || t.doc.link))));
}

function topicSearchText(id){
  const parts = [];
  const t = findTopic(id);
  if(t){ parts.push(t.name, t.desc); }
  const art = ARTICLES[id];
  if(art && Array.isArray(art.blocks)){
    art.blocks.forEach(b => {
      if(b.text) parts.push(b.text);
      if(b.title) parts.push(b.title);
      if(Array.isArray(b.items)) parts.push(b.items.join(" "));
      if(b.caption) parts.push(b.caption);
      if(Array.isArray(b.items) && b.type === "image-row"){
        b.items.forEach(it => { if(it.caption) parts.push(it.caption); });
      }
    });
  }
  const td = topicData[id];
  if(td && td.text) parts.push(td.text);
  if(td && td.link) parts.push(td.link);
  return parts.join(" ").toLowerCase();
}

function renderNav(filter){
  const q = (filter || "").toLowerCase().trim();
  categoryListEl.innerHTML = CATEGORIES.map(cat => {
    const topics = cat.topics.filter(t => !q || topicSearchText(t.id).includes(q));
    if(topics.length === 0) return "";
    return `
      <div class="category">
        <div class="category-title">${cat.name}</div>
        ${topics.map(t => `
          <div class="topic-item ${t.id===activeId?'active':''}" onclick="selectTopic('${t.id}')">
            <div class="topic-name">
              <span>${highlightText(t.name, q)}${t.tool ? '<span class="tool-badge">Tool</span>' : ''}</span>
              <span class="status-dot ${hasContent(t.id) || t.tool || ARTICLES[t.id] ? 'filled' : ''}"></span>
            </div>
            <div class="topic-desc">${highlightText(t.desc, q)}</div>
          </div>
        `).join("")}
      </div>
    `;
  }).join("");
}

window.selectTopic = function(id){
  activeId = id;
  renderNav(searchInput.value);
  renderMain();
  const label = document.getElementById("navToggleLabel");
  const t = findTopic(id);
  if(label && t) label.textContent = t.name;
  // On mobile, collapse the topic list and scroll to the content once something is picked.
  if(window.matchMedia("(max-width: 800px)").matches){
    closeNav();
    // Scroll to the absolute top rather than aligning to mainPanel: the nav
    // is still mid-collapse-animation here, so measuring its position now
    // would target the wrong spot once the collapse finishes.
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
};

function openNav(){
  const panel = document.getElementById("navPanel");
  const toggle = document.getElementById("navToggle");
  if(!panel || !toggle) return;
  panel.classList.add("open");
  toggle.classList.add("open");
}
function closeNav(){
  const panel = document.getElementById("navPanel");
  const toggle = document.getElementById("navToggle");
  if(!panel || !toggle) return;
  panel.classList.remove("open");
  toggle.classList.remove("open");
}
window.toggleNav = function(){
  const panel = document.getElementById("navPanel");
  if(panel && panel.classList.contains("open")) closeNav(); else openNav();
};

function renderMain(){
  if(!activeId){
    mainPanel.innerHTML = `<div class="empty-state"><div class="big">📖</div><div>Pick a topic on the left to get started.</div></div>`;
    return;
  }
  const topic = findTopic(activeId);
  const data = topicData[activeId] || {};

  let bodyHtml = "";
  if(topic.tool === "costbook"){
    bodyHtml = `
      <div class="tool-tabs">
        <div class="tool-tab active" data-tt="recipes">Recipe cost calculator</div>
        <div class="tool-tab" data-tt="doc">Document</div>
      </div>
      <div class="tool-panel active" id="ttpanel-recipes">${costBookRecipesHtml()}</div>
      <div class="tool-panel" id="ttpanel-doc">${docPlaceholderHtml(data.doc || {})}</div>
      <div class="content-label" style="margin-top:22px;">Notes for this section</div>
      <textarea class="content-area" id="contentArea" style="min-height:120px;" placeholder="Any extra notes on pricing strategy, bulk buying, etc.">${data.text || ""}</textarea>
    `;
  } else if(topic.tool === "orders"){
    bodyHtml = orderEntriesHtml();
  } else if(topic.tool === "converter"){
    bodyHtml = converterHtml();
  } else if(topic.tool === "invoice"){
    bodyHtml = invoiceHtml();
  } else if(ARTICLES[topic.id]){
    bodyHtml = `
      ${renderArticle(topic.id)}
    `;
  } else if(topic.tool === "diary"){
    bodyHtml = `
      <textarea class="content-area" id="contentArea" style="min-height:420px;" placeholder="A space where you can make notes, add recipe tweaks, jot down ideas and more...">${data.text || ""}</textarea>
    `;
  } else {
    bodyHtml = `
      <div class="link-row">
        <div class="content-label">Link to full guide (optional)</div>
        <input class="link-input" id="linkInput" placeholder="https://... link to a Google Doc, Drive file, or PDF" value="${data.link ? data.link.replace(/"/g,'&quot;') : ''}" />
        ${data.link ? `<a href="${data.link}" target="_blank" rel="noopener">Open linked resource ↗</a>` : ""}
      </div>
      <div class="content-label">Source content</div>
      <textarea class="content-area" id="contentArea" placeholder="Paste or write the content for this guide here — steps, notes, anything you want your client to see when they click this topic.">${data.text || ""}</textarea>
      <div class="attach-row">
        <button class="btn small" onclick="clearTopic()">Clear this topic</button>
      </div>
    `;
  }

  mainPanel.innerHTML = `
    <div class="topic-header">
      <div class="crumb">${categoryOf(topic.id)}</div>
      <h2>${topic.name}</h2>
      <div class="desc">${topic.desc}</div>
    </div>
    ${bodyHtml}
  `;

  const ta = document.getElementById("contentArea");
  if(ta){
    ta.addEventListener("input", (e) => {
      topicData[activeId] = topicData[activeId] || {};
      topicData[activeId].text = e.target.value;
      renderNav(searchInput.value);
    });
  }
  const li = document.getElementById("linkInput");
  if(li){
    li.addEventListener("input", (e) => {
      topicData[activeId] = topicData[activeId] || {};
      topicData[activeId].link = e.target.value;
      renderNav(searchInput.value);
    });
  }

  if(topic.tool === "costbook"){
    initCostBook();
    mainPanel.querySelectorAll(".tool-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        mainPanel.querySelectorAll(".tool-tab").forEach(t => t.classList.remove("active"));
        mainPanel.querySelectorAll(".tool-panel").forEach(p => p.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById("ttpanel-" + tab.dataset.tt).classList.add("active");
      });
    });
  }
  if(topic.tool === "orders"){
    initOrderEntries();
  }
  if(topic.tool === "converter"){ initConverter(); }
  if(topic.tool === "invoice"){ initInvoice(); }
}

window.clearTopic = function(){
  if(!confirm("Clear the content for this topic?")) return;
  delete topicData[activeId];
  renderMain();
  renderNav(searchInput.value);
};

searchInput.addEventListener("input", () => {
  currentQuery = searchInput.value;
  renderNav(currentQuery);
  if(activeId) renderMain();

const CB_STEP_UNITS = { cup: 0.25 };
function cbStepFor(unit){ return CB_STEP_UNITS[unit] || 0.01; }

function cbToGrams(amount, unit){
  switch(unit){
    case "g": return amount;
    case "kg": return amount * 1000;
    case "oz": return amount * 28.3495;
    case "lb": return amount * 453.592;
    case "ml": return amount;
    case "l": return amount * 1000;
    case "cup": return amount * 240;
    case "unit": return amount;
    default: return amount;
  }
}

function cbFmt(n){ return "$" + (isFinite(n) ? n : 0).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }
function cbCostForRow(r){

/* ============ EMBEDDED WEIGHT CONVERTER TOOL ============ */
const CONVERT_UNITS = ["g","kg","oz","lb","cup","ml","l","tsp","tbsp"];
const CONVERT_LABELS = { g:"Grams (g)", kg:"Kilograms (kg)", oz:"Ounces (oz)", lb:"Pounds (lb)", cup:"Cups", ml:"Millilitres (ml)", l:"Litres (l)", tsp:"Teaspoons (tsp)", tbsp:"Tablespoons (tbsp)" };

// Everything is converted through a common "grams" base, using the same
// baking-friendly approximation as the recipe calculator (1 cup ≈ 240g/ml,
// water-like density) so figures stay consistent across the whole app.
function convToGrams(amount, unit){
  switch(unit){
    case "g": return amount;
    case "kg": return amount * 1000;
    case "oz": return amount * 28.3495;
    case "lb": return amount * 453.592;
    case "cup": return amount * 240;
    case "ml": return amount;
    case "l": return amount * 1000;
    case "tsp": return amount * 4.93;
    case "tbsp": return amount * 14.79;
    default: return amount;
  }
}
function convFromGrams(grams, unit){
  switch(unit){
    case "g": return grams;
    case "kg": return grams / 1000;
    case "oz": return grams / 28.3495;
    case "lb": return grams / 453.592;
    case "cup": return grams / 240;
    case "ml": return grams;
    case "l": return grams / 1000;
    case "tsp": return grams / 4.93;
    case "tbsp": return grams / 14.79;
    default: return grams;
  }
}
function convFmt(n){
  if(!isFinite(n)) return "0";
  const rounded = Math.abs(n) >= 100 ? Math.round(n * 10) / 10 : Math.round(n * 100) / 100;
  return rounded.toLocaleString(undefined, { maximumFractionDigits: 2 });
}

// Standard baking cup fractions, rounded to the nearest 1/8 — e.g. 0.5 -> "1/2 cup", 1.375 -> "1 3/8 cups".
const CUP_FRACTIONS = [
  [0,     ""],
  [1/8,   "1/8"],
  [1/4,   "1/4"],
  [1/3,   "1/3"],
  [3/8,   "3/8"],
  [1/2,   "1/2"],
  [5/8,   "5/8"],
  [2/3,   "2/3"],
  [3/4,   "3/4"],
  [7/8,   "7/8"]
];
function convFmtCups(n){
  if(!isFinite(n) || n <= 0) return "0 cups";
  let whole = Math.floor(n);
  let frac = n - whole;
  let best = CUP_FRACTIONS[0], bestDiff = Infinity;
  for(const pair of CUP_FRACTIONS){
    const diff = Math.abs(frac - pair[0]);
    if(diff < bestDiff){ bestDiff = diff; best = pair; }
  }
  // rounding up to the next whole cup (frac closest to 1)
  if(Math.abs(1 - frac) < bestDiff){ whole += 1; best = [0, ""]; }
  const label = best[1];
  let text;
  if(whole === 0 && label === "") text = "0";
  else if(whole === 0) text = label;
  else if(label === "") text = String(whole);
  else text = `${whole} ${label}`;
  const total = whole + (label ? best[0] : 0);
  return `${text} ${total <= 1 ? "cup" : "cups"}`;
}

  return `
    <div class="cb-settings" style="margin-top:0;">
      <div class="cb-field" style="min-width:160px;">

function convRender(){
  const amountEl = document.getElementById("convAmount");
  const unitEl = document.getElementById("convUnit");
  const out = document.getElementById("convResults");
  if(!amountEl || !unitEl || !out) return;
  const amount = parseFloat(amountEl.value) || 0;
  const fromUnit = unitEl.value;
  const grams = convToGrams(amount, fromUnit);
  out.innerHTML = CONVERT_UNITS.filter(u => u !== fromUnit).map(u => `
    <div class="cb-srow"><span>${CONVERT_LABELS[u]}</span><span class="val" style="color:var(--accent-hover);font-weight:600;">${u === "cup" ? convFmtCups(convFromGrams(grams, u)) : convFmt(convFromGrams(grams, u))}</span></div>
  `).join("");
}

      <thead>
        <tr>
          <th>Order date</th><th>Customer</th><th>Product</th><th class="cb-num">Qty</th><th>Status</th><th></th>
        </tr>
      </thead>
      <tbody id="oeRows"></tbody>
    </table>
    </div>
    <button class="cb-addrow" id="oeAddRowBtn">+ Add order</button>
    <div class="cb-toolbar">
      <button class="btn small" id="oeCsvBtn">Export CSV</button>
    </div>
  `;
}

function oeRenderRows(){
  const tbody = document.getElementById("oeRows");
  if(!tbody) return;
  tbody.innerHTML = oeOrders.map((o, i) => `
    <tr>
      <td><input type="date" value="${o.date}" oninput="oeUpdateOrder(${i},'date',this.value)" /></td>
      <td><input value="${o.customer}" oninput="oeUpdateOrder(${i},'customer',this.value)" placeholder="Name, phone or email" /></td>
      <td><input value="${o.product}" oninput="oeUpdateOrder(${i},'product',this.value)" placeholder="e.g. Chocolate chip cookies (dozen)" /></td>
      <td><input type="number" min="0" step="1" class="cb-num" value="${o.qty}" oninput="oeUpdateOrder(${i},'qty',parseFloat(this.value)||0)" /></td>
      <td><select style="${oeStatusStyle(o.status)}" onchange="oeUpdateOrder(${i},'status',this.value)">${oeStatusOptions(o.status)}</select></td>
      <td><button class="cb-del" onclick="oeRemoveOrder(${i})">✕</button></td>
    </tr>
  `).join("");
}

window.oeUpdateOrder = function(i, field, value){ oeOrders[i][field] = value; if(field === "status") oeRenderRows(); };
window.oeRemoveOrder = function(i){ oeOrders.splice(i, 1); oeRenderRows(); };

function initOrderEntries(){
  if(oeOrders.length === 0){
    oeOrders.push(oeNewOrder());
  }
  oeRenderRows();
  document.getElementById("oeAddRowBtn").addEventListener("click", () => {
    oeOrders.push(oeNewOrder());
    oeRenderRows();
  });
  document.getElementById("oeCsvBtn").addEventListener("click", () => {
    const header = "Order date,Customer,Product,Quantity,Status\n";
    const lines = oeOrders.map(o => [o.date, `"${(o.customer||"").replace(/"/g,'""')}"`, `"${(o.product||"").replace(/"/g,'""')}"`, o.qty, o.status].join(",")).join("\n");
    cbDownload("kneada_order_entries.csv", header + lines, "text/csv");
  });
}

/* init */
/* ============ AUTO-SAVE (browser local storage) ============ */
const STORAGE_KEY = "kneada_glossary_state_v1";

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      topicData,
      costBook: { products: cbProducts },
      orderEntries: { orders: oeOrders },
      savedAt: new Date().toISOString()
    }));
    const el = document.getElementById("saveStatus");
    if(el){ el.textContent = "Saved " + new Date().toLocaleTimeString(); }
  }catch(e){
    console.warn("Auto-save failed:", e);
  }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    topicData = data.topicData || {};
    if(data.costBook && Array.isArray(data.costBook.products) && data.costBook.products.length){
      cbProducts = data.costBook.products;
      cbActiveId = cbProducts[0].id;
    }
    if(data.orderEntries && Array.isArray(data.orderEntries.orders)){
      oeOrders = data.orderEntries.orders;
    }
  }catch(e){
    console.warn("Auto-load failed:", e);
  }
}

loadState();
setInterval(saveState, 3000);
window.addEventListener("beforeunload", saveState);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") saveState(); });

renderNav();
</script>

<div class="img-lightbox" id="imgLightbox" role="dialog" aria-modal="true" aria-label="Image preview">
  <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
  <img id="lbImg" src="" alt="" />
  <div class="lb-caption" id="lbCaption"></div>
</div>
<script>
(function(){
  const lb = document.getElementById("imgLightbox");
  const lbImg = document.getElementById("lbImg");
  const lbCap = document.getElementById("lbCaption");
  const lbClose = document.getElementById("lbClose");
  function openLb(src, caption){
    lbImg.src = src;
    lbCap.textContent = caption || "";
    lb.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeLb(){
    lb.classList.remove("open");
    lbImg.src = "";
    document.body.style.overflow = "";
  }
  lbClose.addEventListener("click", (e) => { e.stopPropagation(); closeLb(); });
  lb.addEventListener("click", closeLb);
  document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeLb(); });
  document.addEventListener("click", (e) => {
    const img = e.target.closest(".article-hero img, .article-image img");
    if(!img) return;
    e.preventDefault();
    const cap = img.closest("figure")?.querySelector("figcaption")?.textContent || img.alt || "";
    openLb(img.src, cap);
  });
})();
</script>
