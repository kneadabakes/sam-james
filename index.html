      { type: "paragraph", text: "I hadn’t baked anything yet because I’d wait to see what interest came in, then bake in the afternoon and have them ready for pickup or delivery that evening. No baking required until someone actually messages to order ." },
      { type: "paragraph", text: "If you don’t get orders this time, you haven’t lost anything but chances are, you’ll get at least a few takers." },
      { type: "paragraph", text: "Even on days when I had no orders lined up, I could walk away with 2–10 sales from just one post." },
      { type: "paragraph", text: "Weekends work best in my experience as people are more likely to treat themselves" },
      { type: "image", key: "sjm_09", caption: "" },
      { type: "paragraph", text: "Same product. Same service. Just positioned differently." },
      { type: "paragraph", text: "For me, it works because it creates FOMO and triggers impulse buys - the product feels limited and immediately available. It also feels lower effort for the customer than placing a full custom order. You remove decision fatigue and friction because the flavours are already decided, the price is stated, and the customer knows exactly when the product is available. All they need to do is send a message saying, “Yes, I want one.” It couldn’t be easier." },
      { type: "paragraph", text: "I also found this to be a a GREAT way to reach new customers, gather feedback, collect reviews, and test new products." },
      { type: "paragraph", text: "It might seem like one small order on a random Friday night, but I gained so many loyal customers from doing this. It’s an opportunity to get your products in front of people — and once they realise how good they are, hopefully they come back again and again." },
      { type: "image-row", items: [{ key: "sjm_10", caption: "" }, { key: "sjm_11", caption: "" }] },
      { type: "image", key: "sjm_12", caption: "" },
      { type: "heading", text: "Pre-Orders" },
      { type: "paragraph", text: "My business was built on pre-orders, it reduces wasted ingredients and saved me so much time. No turning the oven on for no reason, no guessing how much to bake." },
      { type: "paragraph", text: "It also gave me more control over my workload, my stock and my time and allowed me to build a workable schedule. When you plan in advance what’s being baked, you can also stock up on ingredients and prepare your packaging ahead of time. Using this system right from the beginning meant I started getting bigger order enquiries and requests for specific dates, instead of only getting enquiries when I was advertising products for sale." },
      { type: "paragraph", text: "The customer could select their preferred collection or delivery date during the process. I’d advertise what was available and when, they’d place their order and pay, and then I’d bake it." },
      { type: "paragraph", text: "It also pretty much eliminates the stress of no-shows and leftovers — something I’m sure we’ve all worried about at some point." },
      { type: "paragraph", text: "You can set up a system that works for you and a routine your customers get used to. I much preferred doing this rather than baking loads of different things and praying they’d sell." },
      { type: "paragraph", text: "Take the order → get paid → bake it → done" },
      { type: "heading", text: "Gifting" },
      { type: "paragraph", text: "Gifting means you aren’t relying on people randomly deciding to treat themselves… you’re selling to people who already had a REASON to buy .This started during COVID and grew rapidly from there." },
      { type: "paragraph", text: "Customers could order baked goods, add a personal gift message, and have it delivered straight to the recipient." },
      { type: "paragraph", text: "Many of the stories and posts I put up would focus on the gifting aspect. It was perfect for people who had forgotten a birthday/occasion and needed something last minute, or were searching for an affordable gift but weren’t quite sure what to buy." },
      { type: "paragraph", text: "They needed something to: cheer someone up, bring to a work event, put at the centre of a family gathering, make a moment feel special" },
      { type: "image-row", items: [{ key: "sjm_13", caption: "" }, { key: "sjm_14", caption: "" }] },
      { type: "image", key: "sjm_15", caption: "" },
      { type: "paragraph", text: "The person buying didn’t even need to leave the house. I got orders from the US, Australia, and Europe because people wanted to send treats to loved ones in my area. This wasn’t just for birthdays either; people sent bakes to say thank you, congrats, get well soon, you name it." },
      { type: "paragraph", text: "What’s wild is that often, the person ordering never even tasted my products but the person receiving them did. Those recipients often became customers themselves, or passed me on to someone else. It’s word of mouth, but sweeter." },
      { type: "image", key: "mkt_box_van", caption: "" },
      { type: "paragraph", text: "You aren’t just selling baked goods, you’re selling convenience, gifting and solutions to “I need something for this…” and that’s why gifting can be such a powerful way to sell." },
      { type: "image-row", items: [{ key: "sjm_16", caption: "" }, { key: "sjm_17", caption: "" }] },
      { type: "heading", text: "Corporate Customers" },
      { type: "paragraph", text: "They were the biggest spenders, and surprisingly, some of the easiest to deal with." },
      { type: "paragraph", text: "First you need to look like a business. That means having a proper email and ideally some kind of website or landing page not just DMs." },
      { type: "paragraph", text: "Businesses like to do things during work hours, and often need to pass the order through different departments, so make it easy for them. They usually pay via invoice, so make sure you have a process set up. I created my own invoices on excel and tracked them myself, mainly because it’s free!" },
      { type: "paragraph", text: "LinkedIn was a goldmine for me because companies love to shout about what they’re doing for their staff (appreciation days, incentives, community events( and baked goods fit in perfectly. An average corporate order was 100-200 cupcakes (£299 - £598) but the highest I’ve received was over £2,000." },
      { type: "paragraph", text: "You can set up a LinkedIn page for your baking business and use it in a similar way to a business Facebook page but tailor your content and advertising towards what businesses would actually want to see, be interested in or potentially order." },
      { type: "paragraph", text: "Think branded cupcakes, larger quantities, corporate gifting, delivery and reliable service. Show businesses that you’re equipped to handle larger orders and make their lives easier." },
      { type: "paragraph", text: "Don’t overlook the small orders either. I once delivered a brownie gift worth under £20, and it turned out to be for someone high up in a finance firm. That one small gift led to a £1,000+ corporate order — and they came back year after year." },
      { type: "paragraph", text: "The value of corporate customers is what can make them great: 10 x £30 orders… or 1 x £300 order?" },
      { type: "paragraph", text: "They can be much less work than day to day custom orders." },
      { type: "paragraph", text: "Businesses have reasons to buy throughout the entire year: client gifts, staff celebrations, events, Christmas, new starters, promotions, milestones and more." },
      { type: "paragraph", text: "One good corporate relationship can turn into a regular stream of orders, rather than you constantly having to find new customers." },
      { type: "paragraph", text: "You’re not just looking for someone to place one order. You’re looking to build relationships with businesses that could come back to you again and again." },
      { type: "paragraph", text: "My most requested order was branded cupcakes. Usually a simple mix of chocolate and vanilla (easy win), topped with buttercream and their company logo. I printed the logos onto edible rice paper, cut them out, and placed them onto small fondant discs to sit neatly on top." },
      { type: "paragraph", text: "I charged 50p extra per logo topper, so this raised the price of each cake to £2.99 instead of £2.49 an easy upsell that added up fast on larger orders." },
      { type: "paragraph", text: "The quantities were often high, but because every cupcake was the same, they were quick to replicate and really worth it. I’ve also done big batches of branded brownies and cookie boxes — basically, if they can stick a logo on it, they’re interested." },
      { type: "paragraph", text: "Corporate gifting is MASSIVE too. Businesses are constantly looking for gifts to send to: clients, employees, colleagues, suppliers & partners" },
      { type: "paragraph", text: "Christmas is an obvious one, but it’s not the only opportunity. Think milestones, achievements, promotions, new clients, thank-yous, team celebrations, birthdays and events. Again, they already have a REASON to spend money. You’re not trying to convince someone to randomly buy a box of cookies… You’re solving “I need gifts for 20 clients” or “I want to send something to my team to celebrate.” That’s a very different type of customer and a very valuable one!" },
      { type: "image-row", items: [{ key: "sjm_18", caption: "" }, { key: "sjm_19", caption: "" }] },
      { type: "heading", text: "Community Connections" },
      { type: "paragraph", text: "Another big win were schools and colleges in my local community. A friend of my boyfriend’s old teacher ordered cupcakes for the staff room, and after that, we became the go-to for sweet treats at that school. Another customer who worked at a local college loved her order so much, they ended up ordering over 150 cupcakes every year for their graduating students. Sometimes it’s just about making one good impression and letting it ripple." },
      { type: "paragraph", text: "These are super fun too - actual scannable edible QR codes printed onto cupcakes — linking to websites, menus, or even custom pages. Great for corporate gifting, events, or just something a bit different. If you do edible printing, it’s easy to set up and people love the novelty of it." },
      { type: "image-row", items: [{ key: "sjm_20", caption: "" }, { key: "sjm_21", caption: "" }] },
      { type: "image-row", items: [{ key: "sjm_22", caption: "" }, { key: "sjm_23", caption: "" }] },
      { type: "paragraph", text: "Recurring orders can help keep things consistent." },
      { type: "paragraph", text: "For example: a recruitment firm started ordering boxes of branded cupcakes to gift to their candidates who’d just landed jobs. I delivered them straight to the workplace: 4 to 6 per week, every week. Estate agents, consulting firms, law firms all have occasions where a sweet treat goes a long way." },
      { type: "paragraph", text: "These kinds of consistent orders can make a big difference to your cash flow." },
      { type: "paragraph", text: "If people aren’t coming to find you, go and find them!" },
      { type: "paragraph", text: "Make up a few boxes deliver them yourself to the firms and get your products in front of the people who matter. Bake a box of best sellers and include a message e.g. Just a little something to sweeten your day! I work with businesses like yours to provide branded cupcakes for clients, candidates, or staff — whether it’s to celebrate a job offer, thank a client, or just brighten someone’s day. If you ever have an occasion where a sweet treat might go a long way, I’d love to help. Reliable delivery, custom options, and freshly baked — every time. Enjoy the cupcakes!" },
      { type: "paragraph", text: "Be sure to include your business name and contact information at the end." },
      { type: "heading", text: "Pop Ups" },
      { type: "paragraph", text: "I didn’t wait for anyone to offer me a market stall.. I set up my own (mainly because things like that don’t happen often where I live!). I planned a one-day pop-up in the middle of my local town centre on a random Thursday and sold out over 350 products by lunchtime." },
      { type: "paragraph", text: "It worked well for me because it was a one-day-only thing, the products were different to what I sold online, and people could just buy one or two items instead of committing to a box. Perfect for first-timers or people just walking by." },
      { type: "paragraph", text: "Pop ups are not essential and you do not need to do them, they worked well for me in terms of sales and exposure, but they are a lot of work and do require planning." },
      { type: "paragraph", text: "I would only usually do 1 or 2 per year but it’s another avenue to consider." },
      { type: "heading", text: "Menu Design" },
      { type: "paragraph", text: "Review your menu and product offerings often." },
      { type: "paragraph", text: "I track mine weekly and spend time looking at what sold well and what didn’t. Sometimes, the products I loved weren’t the ones my customers loved!" },
      { type: "paragraph", text: "Remember to take into account outside influences that might affect your results. Seasonal changes are a big one and they can really impact your sales as a bakery. Christmas was my busiest time of year by FAR, but you can also make the most of new seasons (fall flavours, winter warmer flavours etc)" },
      { type: "paragraph", text: "For me, summer usually went a bit quieter because people are less likely to buy baked goods when it’s super hot outside." },
      { type: "paragraph", text: "Don’t be disheartened if you see dips in your figures. You can always tweak your product offering to suit the time of year and lean into whatever’s working." },
      { type: "paragraph", text: "If you want to sell daily, your menu needs everyday products. When items are too niche, sales can be inconsistent." },
      { type: "paragraph", text: "Balance your menu with products people buy for regular occasions—at prices that feel affordable for repeat purchases." },
      { type: "paragraph", text: "A really good way to reinvent your menu without actually launching new products is to offer selection boxes." },
      { type: "paragraph", text: "These became one of my best sellers because customers got to try a bit of everything (and honestly, who doesn’t want that?!)." },
      { type: "paragraph", text: "Create a standard selection that’s easy for you to put together, then give customers the option to choose their own flavours to build their box. I offered a few options, but the top choice was always the box with cupcakes, brownies, rocky road, and cookies. Selection boxes are amazing for gifts because they’re more exciting than the cliché cupcake box. They also work perfectly for parties or special occasions, since they can be laid out as a mini dessert table." },
      { type: "paragraph", text: "Selections can help you shine a light on your less popular products. For example, cupcakes and cookies always sold out for me, but brownies… not so much. Including them in the selection box meant people tried them without directly ordering — and once they did, they realised how good they actually were." },
      { type: "paragraph", text: "In just 90 days, this box sold over 100 times — at a price point of £30+. Not bad considering I was already baking these products anyway!" },
      { type: "image", key: "sjm_24", caption: "" },
      { type: "paragraph", text: "I think it’s important to strike a balance between creating unique products and flavours, and also offering some classics that are easy to recognise." },
      { type: "paragraph", text: "You don’t want potential customers to look at your menu and not understand, or be interested in anything you’re offering. I liked to come up with fun names for some of the boxes and items I offered, but I wouldn’t do this with everything because it can confuse people." },
      { type: "paragraph", text: "I liked to have some flavours that I knew people would recognise (Nutella, Oreo, Biscoff, etc.) it’s an easy win because people already know they love these household names, so they’re more drawn to trying your cake/cookie/brownie in that flavour." },
      { type: "paragraph", text: "These were my best selling cupcake flavours, I was really surprised that Vanilla was at the top because it’s often referred to as boring! You can see some of the well known things like Biscoff & Fererro Rocher are up at the top" },
      { type: "image", key: "sjm_25", caption: "" },
      { type: "paragraph", text: "I think these factors are quite specific to location — after moving from the UK to North America, I’ve noticed a massive difference in the flavours people are interested in - so do a bit of market research in your local area." },
      { type: "paragraph", text: "If you aren’t sure what your customers want, ask them!" },
      { type: "paragraph", text: "Put out a poll, this is really easy to do on Instagram stories, or send out an email asking for feedback. You could also put a post in a local Facebook group, asking for people to tell you what their favourite cupcake/cookie flavours are, making a note of all their suggestions. Don’t waste time guessing, make it fun and ask them to come up with a new flavour idea, if you choose their idea, they win a prize." },
      { type: "paragraph", text: "You don’t need a massive product range to try any of these strategies. You can expand and grow in time, when you have real results and know what is working with your audience." },
      { type: "image", key: "sjm_26", caption: "" },
      { type: "heading", text: "The Old-School Stuff" },
      { type: "paragraph", text: "Business cards and flyers still work. Especially if you’re doing pop-ups or attending events. I learnt the hard way after forgetting to bring any to my first pop-up. Some people aren’t on social media (especially the older generations!), and a card gives them a way to find you. You can also leave them in cafés, shops, community noticeboards.. anywhere your ideal customer might be." },
      { type: "paragraph", text: "You want to be found in real life and online not just on Instagram. You want a presence in your local area and on Google. If people aren’t seeing you in the places they hang out, they’ll go elsewhere even if your bakes are better." },
      { type: "paragraph", text: "You don’t need a storefront to run a successful baking business. You just need to work smart and show up. If I could do it on an island that’s only 9x5 miles in size, then you can do it too." },
      { type: "paragraph", text: "I got my delivery vans branded so people would notice me out on the roads or parked up! I offered a 10% discount for anybody who spotted them, took a photo then tagged me. It was good marketing and a worthwhile exchange!" },
      { type: "image-row", items: [{ key: "sjm_27", caption: "" }, { key: "sjm_28", caption: "" }] },

      { type: "heading", text: "Social Media" },
      { type: "paragraph", text: "I use Facebook and Instagram. They are great for quick, easy, real-time updates. I don’t post perfectly or stick to a strict schedule, but I do recommend staying consistent." },
      { type: "paragraph", text: "My follower count wasn’t huge either: 3,600 on Instagram, 5,300 on Facebook, but those numbers didn’t matter. Behind the scenes, my customers were buying. Use social media in a way that feels right for you. I found I didn’t need to go viral or post every day. What worked for me was showing up, being myself and actually connecting with people. Engage with local businesses and your audience. Don’t be afraid to show the behind-the-scenes! Your kitchen, your story, your face." },
      { type: "paragraph", text: "People want to know who they’re buying from. That’s often what makes the difference. Lots of people can bake cupcakes, but the speciality behind your business is YOU! I know it can feel a bit cringe sometimes, but it’s worth it and I promise you, nobody is laughing at you. Your posts don’t need to get loads of likes, they need to actually make people want to buy from you." },
      { type: "paragraph", text: "Social media can be hard to navigate sometimes and posting content almost feels like a whole job in itself. One that you don’t usually want to do after baking for hours! I started with only a business Facebook page and then moved on to Instagram (it was over 10 years ago so IG was different back then!). When I mention Facebook, I do not mean Marketplace — this is not something I would suggest using to market your products." },
      { type: "paragraph", text: "I love using local FB groups and community pages because they help me get in front of my local audience, people nearby who were actually ready to order." },
      { type: "paragraph", text: "Keep it fun by sharing teasers and delicious-looking behind-the-scenes content, then you can add direct links to buy. I found this really good for catching impulse buys, especially if you have a quick turnaround from when someone orders to when they receive their treat." },
      { type: "paragraph", text: "As a local baker, having a content reach 100,000 people sounds great, but if the majority of those people live nowhere near you, it’s not necessarily going to bring you orders. I use social media as a way to stay visible, remind people I’m here and give them a reason to want to buy. Stories are perfect for this. You can casually show what you’re baking, what you have available, share customer orders, tease something coming up or simply remind people that you’re taking orders. You don’t need every Story to be a hard sell.. for me, the aim was to keep my business in front of people so that when they did need a baker, they remembered me." },
      { type: "paragraph", text: "Social media doesn’t have to be where the sale happens. I use it to drive people towards my website and email list, where they can actually browse my products and place an order. Think of it as the shop window— get people interested, make them want what you’re selling, then make it really easy for them to take the next step." },
      { type: "heading", text: "Advertising" },
      { type: "paragraph", text: "I have dabbled using paid ads on the odd occasion, whilst they were useful for exposure (my page followers would usually go up) I couldn’t link sales direct to ads, so its not something you actively need to focus on." },
      { type: "paragraph", text: "I would aim for one at least post a day Monday - Friday and took breaks at the weekend because I was *trying* to switch off." },
      { type: "paragraph", text: "Use good quality images!" },
      { type: "paragraph", text: "When you’re marketing online, people eat with their eyes. You want them to look at your photos and think “I need to try that”, but if your photos are blurry, taken in bad lighting or don’t look appealing you will put people off." },
      { type: "paragraph", text: "There are a few simple things you can do, like ensuring you don’t have any clutter in the background and ensuring your camera lens is clean, so you get crisp quality. Use natural lighting whenever possible. Sometimes I think bad images can be worse than no images." },
      { type: "image-row", items: [{ key: "sjm_32", caption: "You know your photos are good when you have people asking how they can buy, before they’ve even been released!" }, { key: "sjm_33", caption: "" }] },
      { type: "image", key: "sjm_34", caption: "" },
      { type: "heading", text: "Landing Pages" },
      { type: "paragraph", text: "Take time to review your own landing pages whether that’s your website, Instagram profile, or Facebook page." },
      { type: "paragraph", text: "Sometimes you’ll be posting really nice photos, but when you look at it from a customer’s point of view, it doesn’t actually reflect your business clearly." },
      { type: "paragraph", text: "Pretend you’re a new customer who’s just discovered your page or website, and ask yourself:" },
      { type: "paragraph", text: "Is it clear what I sell? Is it clear how I sell it? Is it clear where I sell and where I’m located? Does this reflect the quality of my products?" },
      { type: "paragraph", text: "If the answer is no then make a change." },
      { type: "paragraph", text: "It’s like a mini audit of your page, and it can be really helpful." },
      { type: "paragraph", text: "I did it recently and it gave me some new ideas for what I want to post! Like more behind-the-scenes content because I had a lot of polished pictures of my final products, but not enough of the other parts of the business." },
      { type: "paragraph", text: "I’ve never used a content calendar or batch-created posts, I just create content as and when I feel inspired or have something helpful to share." },
      { type: "heading", text: "Value Your Existing Customers" },
      { type: "paragraph", text: "Everyone’s chasing growth, but it’s often loyal customers who’ll keep you afloat. I created a rewards program using an app called Smile on my Shopify store. Customers earned points I called them “Sprinkles” for placing orders, signing up, and even on their birthday. Once they collected enough, they’d get rewards like free delivery, £5 off, or £10 off if they were big spenders. It gave people a reason to stick with me, and it worked." },
      { type: "paragraph", text: "This is the graphic I used to promote my reward scheme. There’s a reason why loyalty cards and rewards schemes exist in all different industries. I use them myself daily - I choose to shop at Boots over Superdrug because their rewards are better — and I found my customers were doing the same thing with me." },
      { type: "paragraph", text: "This is a glimpse into the backend of my website, and some of my most loyal customers. This is over a 2 year period, but these are just normal everyday people and look how much they have ordered!" },
      { type: "image-row", items: [{ key: "sjm_35", caption: "" }, { key: "sjm_36", caption: "" }] },
      { type: "heading", text: "Who & Why?" },
      { type: "paragraph", text: "When you’re advertising your business & designing your menu, it’s useful to have an ideal customer in mind. Instead of creating something and hoping for the best, know exactly who you’re talking to and who you’re trying to sell to." },
      { type: "paragraph", text: "For example, when I made my mini cupcakes, I included them in a standard selection that was simple for me to create and appealing to the kind of customer I wanted to attract." },
      { type: "paragraph", text: "That was usually a parent looking for treats for their child’s birthday or classroom, or someone ordering for a group but wanting a more affordable option than full-sized cupcakes." },
      { type: "paragraph", text: "The best products aren’t always the most exciting ones. Personally, I’d never choose a mini cupcake over a regular one (or a cookie, or brownie!), but my customers often did. Remember people aren’t always buying for themselves to enjoy a treat at the end of the day." },
      { type: "paragraph", text: "This is just one example to show the thought process behind how I marketed my business, it wasn’t just about posting a pretty photo of cake and hoping for the best." },
      { type: "paragraph", text: "Your products might look amazing and taste great, but as we know, there are lots of great bakers out there making delicious things. Making people actually want to spend money with you is a completely different skill." },
      { type: "paragraph", text: "I stopped trying to convince people to buy cookies and cupcakes, and instead started giving them a reason to need them. It's about the convenience, the gifting and the solution to \"I need something for this...\"" },
      { type: "paragraph", text: "People are buying because they need something for a friend who's had a bad week, they're going to a family BBQ at the weekend, they forgot a colleague's birthday or they need to take dessert to dinner. Your products can solve those problems. They buy them to:" },
      { type: "list", items: ["Cheer someone up", "Say thank you", "Celebrate someone's birthday", "Bring something to a work event", "Take dessert to a family gathering", "Make someone feel special", "Save themselves from having to bake"] },
      { type: "paragraph", text: "When I started using that reasoning in my marketing, I found selling became much easier, but it isn't instant. People might see today's post and not order." },
      { type: "paragraph", text: "Two weeks later they remember it because a friend has a birthday coming up.. or a month later they need a thank you gift.. or three months later they finally have an occasion where your products are exactly what they need." },
      { type: "paragraph", text: "Instead of just posting \"Cookie Boxes Available\", remind people why they might actually want them." },
      { type: "paragraph", text: "For example... \"Need a last-minute gift for a friend who's having a rubbish week?\" \"Got a BBQ this weekend and don't want to turn up empty handed?\" \"Forgot it's your colleague's birthday tomorrow?\"" },
      { type: "paragraph", text: "Those posts instantly get people making connections in their own mind and the important thing is, people don't always go searching for these occasions." },
      { type: "paragraph", text: "They see your post, then suddenly think... \"Oh... my mum would love that.\" \"I've got dinner at my friend's this weekend.\" \"My sister has just had a baby.\"" },
      { type: "paragraph", text: "You're not creating the occasion - you're reminding people that your products are the perfect solution for it" },
      { type: "paragraph", text: "For me, it was always a huge bonus that I offered delivery and a really quick turnaround. I kept cookie dough in the freezer so I could bake on demand and say yes to those last-minute orders. While other bakers were saying no because they needed a few days' notice, I could usually say yes." },
      { type: "image", key: "sjm_37", caption: "" },
      { type: "paragraph", text: "Those last-minute \"I need something today\" orders brought in so many extra customers over the years. In my experience, convenience can often sell just as much as the product itself. Some people might not be choosing you out of loyalty at first, they can be choosing you out of convenience but that’s ok!" },
      { type: "paragraph", text: "An obvious reason people buy is because of seasonal menus. Christmas, Easter, Mother's Day, Father's Day, Valentine's Day... these naturally give people a reason to order. People often ask whether it's better to do product drops or always have products available." },
      { type: "paragraph", text: "Personally, I think there's room for both. There will always be customers who love the excitement of a new launch, limited flavour or seasonal menu. They'll buy because it's new or because they don't want to miss out. Then you'll have another group of customers who simply love your products and come back throughout the year for birthdays, gifts, work events and family occasions." },
      { type: "paragraph", text: "Customer number one can also turn into customer number two!" },
      { type: "paragraph", text: "But if you only ever sell through limited drops and don't give those returning customers a way to order when they need you, there's a good chance they'll end up buying from someone else or loose interest in between." },
      { type: "image", key: "sjm_38", caption: "" },
      { type: "heading", text: "Customer Service" },
      { type: "paragraph", text: "As well as good quality products, it’s important to provide great service to your customers." },
      { type: "paragraph", text: "There are simple things you can do to improve your customer experience that only require a small extra effort." },
      { type: "paragraph", text: "Show them that they’re buying the whole package from you." },
      { type: "paragraph", text: "Respond to enquiries quickly (I always aim for same- day responses) — but no, you don’t need to reply at 10pm at night. Set boundaries for yourself - switch off!" },
      { type: "paragraph", text: "Always use a friendly but professional tone when interacting with customers and potential customers." },
      { type: "paragraph", text: "Manage your time well for delivery/collection schedules (don’t turn up late!)." },
      { type: "paragraph", text: "Remember small personal details if they’re a returning customer, to show you value their business." },
      { type: "paragraph", text: "Be polite, even if they’re unhappy or complain (this is inevitable), because you can’t please everyone. Listen to their issue/feedback and provide them with a solution (even if you don’t necessarily agree). It’s never worth arguing and could damage your reputation by doing so. How you resolve the issue is more important than the issue itself!" },
      { type: "heading", text: "Final Note" },
      { type: "paragraph", text: "Don't feel like you have to do it all at once. If you want to get started right now, here's one thing I'd do right away:" },
      { type: "paragraph", text: "Audit your ordering process" },
      { type: "paragraph", text: "Pretend you've never heard of your business. Search for your page, browse your content or website, and try to place an order like a customer would." },
      { type: "list", items: [
        "Is the process clear?",
        "Are your photos enticing?",
        "Can people easily see what to do next?",
        "Are there too many steps that make it tedious or confusing?"
      ] },
      { type: "paragraph", text: "If you overcomplicate your process, people may go elsewhere. Convenience is everything — if a customer can jump on your website at 8pm, place an order in a few clicks, and instantly receive their confirmation details via email, that's a smooth, professional experience they'll remember." },
      { type: "paragraph", text: "Compare that to having to message you, wait for replies, and go back and forth answering questions before they can even pay — most people won't bother." },
      { type: "paragraph", text: "Once someone experiences a reliable, seamless process and knows you deliver on quality and service, they're far more likely to come back." },
    ]
  },
"event-guide": {
    hero: null,
    blocks: [
      { type: "heading", text: "MY SURVIVAL GUIDE" },
      { type: "paragraph", text: "I have held a few pop up events over the years which were sell out occasions, every single time!" },
      { type: "paragraph", text: "The more events I held, the quicker they sold out, despite baking more & more each time. The quickest was 350 products which sold in less than 4 hours, we were packed up and ready to go home by 11:30am!" },
      { type: "paragraph", text: "A lot of planning went in to each pop up, everybody's ideas and goals will be different depending on the products you sell and options available in your location." },
      { type: "image", key: "ev_02", caption: "" },
      { type: "paragraph", text: "This guide is specific to an outdoor event using a 10x10 canopy tent, as that is where my experience is." },
      { type: "paragraph", text: "It contains a wealth of information on planning your event, choosing your date & location, prepping products to sell, equipment, marketing, day-of logistics, practical essentials and some final tips for success." },
      { type: "heading", text: "PLANNING YOUR POP UP" },
      { type: "paragraph", text: "When? The obvious answer would be the weekend, but all of my pop ups were held on a Thursday or Friday. I wanted to target shoppers and people enjoying their leisure time, but also the workers who are commuting through the town centre. I’d do some research to scope out areas seeing what is busy when, looking at the footfall at different times of the day, on various days of the week. It’s also worth considering seasonal trends - Christmas, Easter and public holidays are sure to be busier." },
      { type: "paragraph", text: "Where? I chose our local town centre as there was constant footfall. I always opted for outdoors but you need to factor in the changeable weather which can play a big part (heat/rain/wind)." },
      { type: "paragraph", text: "Who? My main target market was commuters, local workers and shoppers, which is why we opted for a week day. Targeting the workers was a massive market for us, imagine 1 office worker buys from you in the morning and takes their purchase back to work with them for the whole office to see, word of mouth is so valuable and if you’ve ever worked in an office you'll know how excited people get over sweet treats!" },
      { type: "image", key: "ev_03", caption: "" },
      { type: "paragraph", text: "What am I going to sell? I opted for a selection of cupcakes, cookies and brownies in a small variety of flavours. This gives customers options and hopefully you will have a product/flavour available which appeals to everybody. All these products are simple enough to transport and can be prepared in advance." },
      { type: "paragraph", text: "Try not to get too carried away being creative and be sure to have classic and recognisable options, because you could risk deterring customers when they don’t understand what you are offering." },
      { type: "paragraph", text: "For your first few events, I recommend focusing on your staples and best-sellers. These are products you already know people enjoy, which makes it much easier to gauge what performs well in a market setting." },
      { type: "paragraph", text: "Events are an amazing opportunity to reach new customers, so ask yourself: if this is someone's first introduction to your business, what products would you most want them to try? Those are the products you should prioritise." },
      { type: "paragraph", text: "After each event, keep a record of exactly what you brought, including flavours, quantities, and product types. Make notes on what sold well, what sold slowly, and what sold out first. Over time, this information becomes incredibly valuable and helps you make better decisions about what to bake for future events." },
      { type: "image", key: "ev_04", caption: "" },
      { type: "paragraph", text: "How am I going to sell? I started with a plain white canopy from amazon and a banner with my business name & branding." },
      { type: "paragraph", text: "I eventually invested in a branded canopy when I knew the events were a success (if you’d like to invest in one for yourself, please get in touch)." },
      { type: "paragraph", text: "Under the canopy I had 2 large folding tables, 1 to showcase products and 1 as a packing/storage area." },
      { type: "paragraph", text: "Setting the products out on display is the fun part, you can use props & stands to display them at heights, making it more interesting to look at. Don’t neglect display cabinets/sneeze guards for hygiene and presentation purposes - walking into a cafe/bakery where the products are out in the open instantly puts me off buying!" },
      { type: "paragraph", text: "How do I advertise? Tell as many people as you can that you are attending." },
      { type: "image", key: "ev_05", caption: "" },
      { type: "paragraph", text: "I liked using instagram stories ‘countdown’ feature, which allowed people to be alerted when the event was taking place and acted as a reminder on the day. It’s worth offering some incentives to attract potential customers and create some hype around the occasion for example, the first 5 customers receive a discount/free item." },
      { type: "paragraph", text: "Or a little giveaway for people who come see you & make a purchase! People LOVE free stuff" },
      { type: "paragraph", text: "Building an email list was also massive for me, it's one of the most direct to consumer methods of marketing. Try not advertise too early whichever method you choose, people are busy and will likely forget about the event if you tell them too far in advance." },
      { type: "paragraph", text: "I would advertise the pop up around a week before it was happening, which created buzz and excitement and also gave me time to check all outside factors (weather conditions, supply chains etc)." },
      { type: "paragraph", text: "How Far in Advance Should I Prepare? Before my first event, I did a mock pop-up at home so I could get a feel for my setup and see how everything looked together. This helped me spot things I was missing before the actual event and gave me a chance to test different layouts. I also timed myself while setting everything up. Knowing how long setup realistically takes helps you plan your morning and avoid unnecessary stress on the day." },
      { type: "image", key: "ev_06", caption: "" },
      { type: "paragraph", text: "Personally, I did all of my baking the day before the event so everything was as fresh as possible. This meant that on the event day, I could focus on loading the car, setting up, and serving customers rather than rushing to finish baking. In the days leading up to the event, I would also prepare any marketing materials, signage, packaging, cash float, card reader, and social media posts in advance. The more you can prepare beforehand, the smoother the day will run." },
      { type: "paragraph", text: "My biggest piece of advice is not to leave anything until the last minute. A checklist can be invaluable for making sure you have all the equipment, products, and supplies you need before you leave home (more on that later!)." },
      { type: "paragraph", text: "How Much Product Should I Bring? One of the most common questions I get asked is how much product to bring to an event. The truth is, there isn't an exact answer." },
      { type: "paragraph", text: "My thought was that it's better to sell out and leave people wanting more than to be left with a large amount of unsold stock and potential waste. Of course, you still want enough variety and quantity to make your stall look appealing throughout the day." },
      { type: "paragraph", text: "To help me plan, I created a spreadsheet showing how many of each product I could realistically bake, along with the potential revenue from each option. This helped me work out whether the event was worth my time and ensured I was covering my ingredient costs, time, and other expenses while still making a profit." },
      { type: "image", key: "ev_07", caption: "" },
      { type: "paragraph", text: "You also need to consider practical factors: Do you have enough space to transport everything? Can you display it attractively? Do you have enough storage at your stall to restock throughout the day?" },
      { type: "paragraph", text: "For me, around 350 items split across cupcakes, brownies, and cookies felt like a good amount. I didn't put everything on display at once. Instead, I kept extra stock behind the stall and restocked throughout the day." },
      { type: "paragraph", text: "Not only does this keep your display looking fresh, but seeing you replenish products can also create the impression that items are selling well." },
      { type: "heading", text: "How Much Product Should I Bring?" },
      { type: "paragraph", text: "Ultimately, there are countless factors that influence sales, including footfall, weather, location, pricing, and the type of event itself. Even experienced vendors can't predict sales perfectly every time." },
      { type: "paragraph", text: "It's also important to remember that your first few events are as much about gathering information as they are about making sales. You'll quickly learn which products are most popular, which flavours sell best, what time of day you are busiest, and whether you brought too much or too little stock. Use every event as a learning opportunity and keep notes so you can make more informed decisions next time." },
      { type: "image", key: "ev_08", caption: "" },
      { type: "paragraph", text: "If you do have leftover products, it's worth having a plan in place. You could offer local delivery, advertise them on social media, use them as samples, drop them off to local businesses, or sell them at a discounted price. Having a backup plan helps reduce waste and makes any unsold stock feel less risky." },
      { type: "heading", text: "IMPORTANT THINGS TO REMEMBER:" },
      { type: "paragraph", text: "Do you need permits? You will likely require a permit/permission to set up in a public space. For me I simply emailed the local town hall to obtain this and it came at a small cost of £50 for the day." },
      { type: "paragraph", text: "Do you have insurance? You will likely need public liability insurance to sell to the public. This was already included as part of my business insurance policy, but be sure to check ahead of time as you might need to add this on to your policy. You don't want to risk it and go without." },
      { type: "paragraph", text: "Do you need electric/power? You might need power depending on what you are wanting to provide (e.g. if you’d like to offer drinks you may want a fridge or a coffee machine). It’s important to check this in advance rather than just assume you can turn up and plug in to a power source!" },
      { type: "paragraph", text: "How are you transporting everything? At first, I transported everything to my pop up event in my little Audi A1. It wasn’t ideal but it still did the job. Since then, I upgraded to a van which was perfect to pack everything in, there was room for all of our products as well as all the equipment and packaging required. The van was always strategically packed with everything in order of how we wanted to take it out e.g. products packed first as they will be removed last, canopy packed in last as it will be removed first." },
      { type: "image", key: "ev_09", caption: "" },
      { type: "paragraph", text: "How will you take payment? I’d always suggest more than one option, for me this was cash and card. I bought a SumUp card reader which accepted all major cards (including AMEX!) and had quite a low fee %. Card payments are a lot quicker to take, but it's always good to still accept cash as a second option." },
      { type: "paragraph", text: "What will you package your products in? After many years we developed a custom packaging range which was so sturdy, it ended up being the only thing I trusted to package my products in. I used my bigger boxes to transport the larger products and once they were out on display, it meant I had pre made boxes to use. I would always bring more of the smaller sizes, as passers by are likely to pick up smaller quantities. I offered boxes as well as small paper bags which were useful for customers purchasing 1 item." },
      { type: "paragraph", text: "Should I Stock Products People Ask For? I no longer assume that customer requests automatically translate into sales. I had lots of people asking if I offered vegan options. Naturally, I thought there was strong demand, so I brought vegan products to my next event. Ironically, they were the slowest sellers and the only products I was left with at the end of the day." },
      { type: "paragraph", text: "People will often ask about products they would like to see, but that doesn't necessarily mean they will buy them. Use customer feedback as a guide, but always pay attention to actual sales data. What people purchase is usually more valuable than what they say they want." },
      { type: "paragraph", text: "Consider allergens & labelling: Label the products you have to sell including flavours & price, as well as allergy advice. This makes it easier for customers to browse and will save you repeating the same phrases all day long! I avoided nut based when I held events for ease and to avoid any cross contamination but this was a personal preference." },
      { type: "image", key: "ev_10", caption: "" },
      { type: "paragraph", text: "Offer samples: I have been encouraged to make a purchase so many times after receiving a free sample, these are especially useful for new customers. In my experience, the more people we had around the pop up, the more people would be encouraged to approach us." },
      { type: "paragraph", text: "Early set up = low competition: I used to set up around 7am in the morning, ready to sell just before 8am which might sound crazy to some! So many customers were wanting to purchase on their way to work, I was the only ‘shop’ open at this time and it created a real buzz early in the morning. This is over £100 made within 10 minutes around 8am in the morning:" },
      { type: "heading", text: "ON THE DAY" },
      { type: "paragraph", text: "If you’re anything like me, you’ll probably be really nervous. I hardly slept the night before most events because I was anxiously overthinking everything in my head - not productive." },
      { type: "paragraph", text: "Try to make it as easy as possible on the day to get up, get everything sorted and go. I did most of my packing and sorting the night before so I had minimal things to worry about on the day. I’d done a test set up and timed myself so I knew how early I would need to leave in order to set up ready to sell - my set up took about 45 minutes from unloading the van, putting up the canopy and arranging all of the products." },
      { type: "paragraph", text: "Try to engage with as many people as possible whilst you are there - even if they are giving you a little look it’s worth saying hello or trying to spark conversation." },
      { type: "image", key: "ev_11", caption: "" },
      { type: "paragraph", text: "I never wanted to stand on my phone because I think it looks really uninviting for potential customers to come over." },
      { type: "paragraph", text: "Try to stand at the front with a smile even if your stand is not busy the entire time. At quieter times, you can play around with the set up, move things and keep it looking busy even if you aren’t constantly serving customers." },
      { type: "paragraph", text: "Work out a system that suits you to serve customers efficiently. I had one person taking the order and payment and one person boxing up the products. At quieter periods we would both build up boxes so they are pre made when customers come along." },
      { type: "paragraph", text: "ON THE DAY Adding a few pre-made boxes is a great idea. You could offer mini versions in grab-and-go boxes or create a mixed selection for customers who want a quick and easy purchase." },
      { type: "paragraph", text: "I first noticed the demand for this when I had pre-orders ready for collection at an event. While I was waiting for customers to pick them up, I had the boxes sitting on display and so many people asked if they could buy them. It showed me that not everyone wants to stand and choose individual items." },
      { type: "paragraph", text: "For customers who are new to your business, too much choice can sometimes feel overwhelming. A best-sellers box or mixed selection removes that decision fatigue and makes purchasing much easier." },
      { type: "paragraph", text: "Samples can also make a huge difference. You don't need to give away lots of free product, but even a single bite-sized sample can be enough to turn a passer-by into a customer. For example, cutting a brownie into small pieces is a simple, cost-effective way to let people try your products. Not only does this create an opportunity to interact with potential customers, but it also lets your baking do the selling for you. I recently visited a market and the only stall I purchased from was one offering samples." },
      { type: "paragraph", text: "To many customers, a cookie is just a cookie & they can't immediately see the difference in quality, ingredients, or technique. The taste is what makes you stand out, and sometimes all it takes is one bite to convince someone to buy." },
      { type: "paragraph", text: "I created a checklist to run through when packing up the vehicle before heading to the event, I would physically tick off each item ensuring nothing gets left behind. Believe it or not, we once turned up and started unpacking to realise we had left a table at home so had to drive all the way back and get it.. oops." },
      { type: "paragraph", text: "My biggest tip for success is planning and organisation. Eventually, I had organised everything down to a T, which left almost no room for error. What might seem over the top to some, worked wonders for me and ensured I sold out every single time! Please remember to say hello and make an effort to talk to passers by. Often you can see people glancing over, but they won’t make a move until you say something to them." },
      { type: "paragraph", text: "If you would like any more information please get in touch, I would be more than happy to help." },
      { type: "heading", text: "MY EVENT CHECKLIST (WITH ADDED TIPS)" },
      { type: "list", items: [
        "Card reader for payments",
        "Float of change for cash payments (lots of small change for lower cost purchases)",
        "Flavour Cards to display product name, flavour and prices",
        "Packaging to package products as they sell (boxes & bags)",
        "Weight bags to hold the canopy in place. Ensure they are heavy enough!",
        "Chair (optional) — useful if you are planning to be there all day",
        "Sneeze guards",
        "Table Covers (x2) — one for each table for presentation purposes",
        "Tables (x2) to display your products (mine were from Amazon)",
        "Canopy frame, roof & side walls",
        "iPad — connected to the card reader and acted as a till",
        "Products to sell — self explanatory but you don’t want to forget these!",
        "Business Cards — easy to give out for new potential customers",
        "Gloves & tongs for hygiene purposes when handling and packing products",
        "Anti Bacterial Wipes",
        "Scissors — just in case",
        "Marble & Wooden Boards/Props to display your products",
        "Napkins",
        "Notepad & pen for any observations throughout the day. Think of things that went well vs. what didn’t — I would do a mini review right afterwards, so you can remember what (if anything) needs to be changed for the next time"
      ] },
    ]
  },
  "cupcake-recipe-pack": {
    hero: { key: "cupcake_hero", caption: "My Ultimate Cupcake Recipe Pack — everything you need to bake best-selling cupcakes with irresistible buttercream from scratch." },
    blocks: [
      { type: "heading", text: "What You Need to Know Before You Start" },
      { type: "paragraph", text: "Cupcakes were the first product I ever sold and the thing that actually turned my baking hobby into a business." },
      { type: "paragraph", text: "Over the past 10 years, I have added new products to my menu, but my customers always came back for one thing." },
      { type: "paragraph", text: "The top product every day on my website was a box of 6 cupcakes, and my highest order to date was a cupcake order of over £2,000!" },
      { type: "paragraph", text: "Cupcakes are actually really simple to make, my base recipe only uses 4 ingredients and my buttercream recipe only uses 2. It shows that the taste really comes from the method and how it's made, not just the ingredients used. I've baked with these recipes since the very start and have literally never changed them." },
      { type: "paragraph", text: "I've developed over 20 different cupcake flavours (which I will be giving you later on) and also use this recipe to make mini cupcakes (another best-selling product!)." },
      { type: "paragraph", text: "This cupcake recipe can be divided down to make as little as 3 cupcakes. You basically need to think 50g of each ingredient + 1 egg = 3 cupcakes, and it will be easy to calculate how much you need." },
      { type: "paragraph", text: "You can scale up for bigger batches; the most I do in one go is 650g of each ingredient, which will give you around 40 cupcakes. I don't like to go any higher as I find you can lose quality in your batter, and I can't fit any more than 4 trays of 12 in my oven at a time anyway!" },
      { type: "paragraph", text: "You can make it by hand literally with a spatula and a bowl, using a hand mixer or in a stand mixer (with the paddle attachment). I use my stand mixer nowadays, but the hand mixer is useful if I need to whip up a quick batch of 6 or 12. The most I would make with a hand mixer is 18 cupcakes, the least I would make in a stand mixer is 24 cupcakes." },
      { type: "callout", text: "I don't ever add vanilla extract to my cupcake recipe—personally, I don't think it adds anything and is a waste of money (sue me!)." },
      { type: "paragraph", text: "I weigh my eggs. One medium egg is usually equal to 50g, but eggs can vary in size. This is more important when you are multiplying up, as the deficit/surplus will multiply up with your recipe—then I would use the weight of the eggs as the metric rather than the quantity." },
      { type: "paragraph", text: "I always use margarine; I think it is so much easier to work with than butter and love the flavour it gives my cupcakes." },
      { type: "paragraph", text: "I make cupcakes on the day of, or at most, the day before they are needed. There's nothing better than freshly baked cupcakes, so I wouldn't make them too far in advance or freeze them." },
      { type: "paragraph", text: "Also, ensure you have suitable packaging to store them in—it doesn't need to be airtight, but a lid to cover them is essential." },
      { type: "image", key: "cupcake_wyntk1", caption: "Malteser and Ferrero-topped cupcakes, ready for delivery." },
      { type: "paragraph", text: "I use this recipe for chocolate cupcakes, simply by adding cocoa powder to the batter and stirring in chocolate chips. I never believed in using a whole new recipe for chocolate sponge—this method will save you so much time and still has a great flavour." },
      { type: "paragraph", text: "Those chocolate cakes that were a rich dark chocolate brown colour (in my opinion) never actually tasted that chocolatey, nor did traditional chocolate buttercream!" },
      { type: "paragraph", text: "The base recipe I will give you is for a standard box of 6 cupcakes or 24 mini cupcakes. This is just as a guideline and like I said, nothing changes when you multiply up." },
      { type: "heading", text: "Custom orders, toppers and pricing" },
      { type: "paragraph", text: "Cupcakes are really versatile because there are so many different ways to decorate them and make yours stand out. I focussed on creating indulgent flavours, and the decoration of the cake would match the flavour profile." },
      { type: "paragraph", text: "I also took on custom orders and gave people the option to choose different icing colours and styles (I would try to offer these only in chocolate and vanilla sponge for ease). I loved using the ‘rose style’ piping—it looks really elegant, and customers love it for birthdays and celebrations." },
      { type: "paragraph", text: "You can also add toppers to your cupcakes to allow further personalisation. I had 2 types: corporate logo toppers, which were printed rice paper and backed on a small fondant disc, and fondant circles, which I used a stamp to print written messages on. These are really good upsells to add to cupcakes - I priced my cupcakes at £2.50 each and my toppers were 50p extra per cake." },
      { type: "paragraph", text: "I only ever offered two flavours of buttercream: vanilla and chocolate. This made things a lot easier in terms of preparation but also ensured there was minimal wastage." },
      { type: "image-row", items: [
        { key: "cupcake_toppers_a", caption: "A corporate logo topper example — printed rice paper backed on a fondant disc." },
        { key: "cupcake_toppers_b", caption: "Fondant circle toppers, stamped with a written message." }
      ]},
      { type: "heading", text: "Scaling your buttercream" },
      { type: "paragraph", text: "The measurements of this buttercream recipe will ice around 24 regular cupcakes. It's really easy to scale up (or down) for smaller or larger batches of cupcakes. The biggest I make at once in a 6.9L mixer would cover approx. 100 cupcakes: 800g margarine, 1800g icing sugar (add to mix in 3 lots of 600g), 1 teaspoon water, using the same method." },
      { type: "paragraph", text: "Similar to the cupcake batter, the chocolate version is exact same, I just add cocoa powder at the end. I do this by eye, starting small and adding more if needed; ¼ teaspoon is a good starting point to work up from. Cocoa powder has a good flavour without being overpowering." },
      { type: "callout", text: "Be mindful: too much cocoa can become dry and give a powdery taste. This version of buttercream will be a pale brown colour rather than the dark, rich chocolate brown colour (so don't keep adding to try and achieve that colour!). You can taste along the way to ensure you have achieved the flavour you want." },
      { type: "image-row", items: [
        { key: "cupcake_buttercream_a", caption: "A mixed box — vanilla and chocolate buttercream, decorated to match each flavour." },
        { key: "cupcake_buttercream_b", caption: "Rows of chocolate chip cupcakes, ready to be iced." }
      ]},
      { type: "paragraph", text: "I like to make buttercream at least a few hours ahead of time, if not the day before, so it has time to sit in the fridge a little and firm up. In my opinion, it pipes better once it has been sat for a little rather than being freshly made, and there are fewer air bubbles." },
      { type: "paragraph", text: "I would remove it from the fridge a few minutes ahead of when you are ready to use it, and mix by hand with a spatula to ensure it is smooth and will spread easily. In warmer climates buttercream will melt a lot quicker, so shouldn't be out of the fridge for too long." },
      { type: "callout", text: "Note: The best way to achieve light and fluffy buttercream is with a stand mixer. You can make it by hand, but the consistency will be very hard to achieve without an electric mixer. I only coloured buttercream for custom requests - my colouring is sugar flair paste or wilton gel." },
      { type: "paragraph", text: "To bake good cupcakes, you really want to know your oven - whether it actually runs at the temperature it says and whether it has any hot spots. I usually rotate my trays once whilst they are baking in the oven to ensure they are all baked evenly." },
      { type: "paragraph", text: "Use a wire rack to cool your cupcakes on once they come out the oven, I find they can sweat if they stay in their baking tray and the cupcake case can feel a little greasy." },
      { type: "heading", text: "Tools & Supplies" },
      { type: "list", items: [
        "Flour: Matthews Cotswold Flour 10.5% protein (UK specific!). All flour brands will bake differently, test a few in your area to find the perfect one for you because it can really alter the taste, bake and texture.",
        "Sugar: Tate and Lyle - make sure it's caster sugar",
        "Margarine: Stork (from the tub, NOT the baking block)",
        "Oven: Blue Seal Turbofan Convection Oven E27M2",
        "Mixer: Kitchen Aid 6.9 L Artisan Stand Mixer",
        "Cupcake cases: ‘Easybake White Muffin Cases’ by NJ Products - the perfect size and material, not too thick that they take away moisture from the sponge. I noticed coloured cases often peeled away from the cake more, so I always stuck to white ones.",
        "Digital scale - always measure in grams for accuracy—no cup conversions here",
        "Icing sugar: Tate and Lyle",
        "Cocoa Powder: Cadbury Bourneville Cocoa",
        "Piping Nozzles: Wilton 1M, 2D & 1A"
      ]},
      { type: "heading", text: "Ingredients" },
      { type: "paragraph", text: "I really enjoy baking from scratch and like to make it as easy as possible. You'll see that my recipe is actually really simple, but like most of my baking, the method and how you make it really matters. Cupcake mix should only be prepared when you are ready to use it - I wouldn't recommend preparing batter ahead of time." },
      { type: "recipe", title: "Cupcake batter", items: ["100g Margarine", "100g Caster Sugar", "100g Self Raising Flour", "2 Eggs (weighing 100g)"] },
      { type: "recipe", title: "Buttercream", items: ["200g Margarine", "450g Icing Sugar", "Hot water (dash)"] },
      { type: "paragraph", text: "Buttercream can be stored in the fridge for up to a week, so I tend to make enough for a couple of batches of cupcakes to save time. Make sure it's covered properly otherwise you'll get a crispy layer on top. When you use it from the fridge, just give it a mix with a spatula to loosen it up again." },
      { type: "image-row", items: [
        { key: "cupcake_ingredients_a", caption: "Rainbow-swirl buttercream, coloured for a custom order." },
        { key: "cupcake_ingredients_b", caption: "Mini cupcakes, decorated and boxed for an event." }
      ]},
      { type: "image", key: "cupcake_ingredients_hero", caption: "Rows of freshly piped mini cupcakes." },
      { type: "heading", text: "Method" },
      { type: "paragraph", text: "Combine the margarine & sugar. My preferred way is to use an electric/stand mixer on a medium speed to incorporate air and cream the 2 ingredients together. Make sure margarine is room temp!" },
      { type: "paragraph", text: "There is no set time but be sure to keep your eyes on your mixture, once creamed it should be a pale yellow colour with a slightly grainy texture." },
      { type: "paragraph", text: "Add flour & eggs to your mix. Most flours are already sifted, but if not, be sure to sift your self raising flour so there are no lumps in your mixture. I add the flour first and then the eggs." },
      { type: "paragraph", text: "Crack the eggs in a separate bowl and give them a quick stir with a fork to break the yolks open, then the mixer has less work to do. I use room temp eggs." },
      { type: "paragraph", text: "Mix on slow speed until all ingredients combined. Keep watching your mixture, as it can easily curdle or over mix if you aren't focused." },
      { type: "paragraph", text: "Once everything is just about combined, I like to blast the mixer for 10-20 seconds on medium speed to put some of the air back in." },
      { type: "image", key: "cupcake_method1", caption: "Freshly iced cupcakes, cooling before the next batch." },
      { type: "paragraph", text: "Spatula scrape down & distribute. I like to scrape the sides with a spatula and give a final hand mix to ensure everything is combined. Then, distribute mix into a lined baking tray - I use a ¼ cup scoop for consistency." },
      { type: "paragraph", text: "You want your cases to be about ⅔ full, before going in the oven, the cakes should be roughly the same size to rise at the same rate." },
      { type: "paragraph", text: "I tap the baking tray on a flat surface before going in the oven to remove any air bubbles from the mixture." },
      { type: "paragraph", text: "Bake for 20-22 mins at 160 degrees celsius (fan oven). All ovens vary - the more you bake the more you will get to know whether your oven runs hotter/colder. If you are unsure, start with the lower time and check, they can always be baked for longer if needed. If you're making mini cupcakes, I recommend baking for 15-16 mins at the same temp." },
      { type: "paragraph", text: "Your baked cupcakes should have a golden colour and spring back slightly if you were to touch the top of them." },
      { type: "callout", text: "Make sure you don't overcrowd your oven with too many trays otherwise the heat won't travel around the oven correctly." },
      { type: "image", key: "cupcake_method2", caption: "A tray of cupcakes coming out of the oven, golden and springy." },
      { type: "paragraph", text: "Leave to cool before filling/icing. I leave my cupcakes to cool on a wire rack for about 30-40 minutes at room temperature (not in the baking tray as we already mentioned)." },
      { type: "paragraph", text: "At this stage you can choose whether you want to add a filling before icing your cupcakes. I use an apple corer to remove the middle of the cupcake leaving room to add the filling. Keep the cake cores to the side as they can be used later (either as a sweet snack, or you can make cake pops/cake jars from them!)" },
      { type: "paragraph", text: "Make your buttercream. Whip the margarine on a medium to high speed until it is a pale yellow colour. This should take at least 3-5 minutes." },
      { type: "paragraph", text: "Add in your sifted icing sugar. Even if the icing sugar states it is sifted, I always sift it myself to ensure there are no lumps at all! I do this in more than one stage, beating slowly between each to ensure the buttercream stays light and airy throughout." },
      { type: "paragraph", text: "Add ½ teaspoon of hot water once all the icing sugar is in and mix again. Scrape down the bowl with a spatula to ensure there is no excess stuck on the sides, and mix one final time by hand to remove any air bubbles." },
      { type: "paragraph", text: "Pipe your buttercream. My favourite piping nozzles are the star nozzle (Wilton 1M) for a simple swirl or the round nozzle (Wilton 1A). I use large piping bags, filling them ½ to ⅔ full with buttercream - make sure they aren't too full, that'll get messy and it's also hard to grip & control your piping when it's too full." },
            { type: "paragraph", text: "On the next few pages I have included some of my top selling flavours which you can create using this recipe. You can design your own flavours by adding in extract, chocolates, nuts etc or use spread and ganache to create delicious filled cupcakes. The idea is to have one base recipe that you can use over and over to make your life EASIER!" },
      { type: "heading", text: "The Flavour Inspo" },
      { type: "recipe", title: "Vanilla based flavours", items: [
        "Vanilla – vanilla sponge with vanilla buttercream",
        "Victoria Sponge – vanilla sponge with a raspberry jam core, vanilla buttercream and a dusting of icing sugar",
        "Biscoff – vanilla sponge with a Biscoff spread core, vanilla buttercream, a Biscoff drizzle and Biscoff biscuit",
        "Lemon – vanilla sponge with a lemon curd core, vanilla buttercream with a lemon curd puddle",
        "Salted Caramel – vanilla sponge with a salted caramel core, vanilla buttercream with a salted caramel drizzle",
        "Malteser – malt and chocolate sponge with vanilla buttercream and Malteser crumbs",
        "Red Velvet – red cocoa-infused sponge with vanilla buttercream and a red heart sprinkle (not traditional, I know—but people loved it!)"
      ]},
      { type: "recipe", title: "Chocolate based flavours", items: [
        "Kinderella – chocolate sponge with chocolate chips, a hazelnut crème core, vanilla buttercream, a chocolate ganache drizzle and a Kinder chunk",
        "Mars Bar – chocolate sponge with chocolate chips, a salted caramel core, chocolate buttercream and a Mars Bar chunk",
        "Chocolate – chocolate sponge with chocolate chips and chocolate buttercream",
        "Ferrero Rocher – chocolate sponge with half a Ferrero Rocher baked inside, chocolate buttercream, hazelnut crumbs, a Nutella drizzle and half a Ferrero Rocher",
        "Nutella – chocolate Nutella sponge with a Nutella core, chocolate buttercream and a Nutella drizzle with hazelnut crumbs",
        "Chocolate Orange – chocolate sponge with chocolate chips and orange extract, chocolate buttercream, a chocolate ganache drizzle and a chocolate orange chunk",
        "Mint Choc Chip – chocolate sponge with chocolate chips and peppermint extract, chocolate buttercream and chocolate chips"
      ]},
      { type: "image-row", items: [
        { key: "cupcake_flavour1a", caption: "A mixed flavour box — Biscoff, sprinkles, Ferrero Rocher, Oreo and more." },
        { key: "cupcake_flavour1b", caption: "Lemon, salted caramel, Oreo and Malteser cupcakes." }
      ]},
      { type: "recipe", title: "Mixed flavours & specials", items: [
        "Dulce de Leche – vanilla sponge with a dulce de leche core, vanilla buttercream, a dulce de leche drizzle and a Caramilk chunk",
        "Raspberry White Choc – vanilla sponge with freeze-dried raspberries and white chocolate chips, vanilla buttercream and raspberries",
        "Cinnamon Swirl – vanilla sponge with cinnamon spice, vanilla buttercream, a cinnamon sugar dusting and an icing drizzle",
        "Oreo – vanilla sponge with crushed Oreo pieces, vanilla buttercream and whole and crushed Oreos",
        "Biscella – chocolate and Nutella sponge with a Biscoff core, topped with chocolate buttercream, a Nutella drizzle and a Biscoff biscuit",
        "White Chocolate – vanilla sponge with white chocolate chips, vanilla buttercream, a white chocolate drizzle and white chocolate chunk"
      ]},
      { type: "image-row", items: [
        { key: "cupcake_flavour2a", caption: "Sprinkle, Oreo, Biscoff and salted caramel cupcakes." },
        { key: "cupcake_flavour2b", caption: "A finished flavour selection, ready to box up." }
      ]}
    ]
  },
  "order-tracking": {
    hero: { key: "order_hero", caption: "Boxed and ready to go out the door — every one of these was checked against the diary before baking." },
    blocks: [
      { type: "paragraph", text: "As a baker, one of my worst fears was forgetting somebody's order. So I built a system that let me take orders daily without missing one, for years on end — one that let me catch errors before they ever reached the customer." },
      { type: "paragraph", text: "It does happen — we're all human — but it can be avoided when you have the right system in place." },
      { type: "heading", text: "Where orders came in" },
      { type: "paragraph", text: "I took orders across a few different platforms, so it was important to keep track of each:" },
      { type: "list", items: ["A Shopify store that captured all the order details on my website", "A Facebook page where customers could message to order", "An Instagram page where customers could DM to order", "A business email where customers could email to place an order"] },
      { type: "paragraph", text: "Every day, each platform was checked at least twice — once at midday and once in the evening — more often if things were busy. Whilst checking, I made sure every order had all the details I needed: what they wanted, when for, whether it was collection or delivery, and confirmation of price. Corporate customers were often invoiced instead, but otherwise payment was taken at the time of ordering, so any issues get resolved immediately rather than becoming a problem later." },
      { type: "heading", text: "The paper diary backup" },
      { type: "paragraph", text: "Once I had all the details, the order went into a paper diary, noted on the collection/delivery date: the customer's full name, exactly what they ordered and the quantity, and any gift message. A 'P' next to the name meant paid — no 'P' meant payment was still required. This diary came with me everywhere and was kept up to date twice daily, so I could glance at any day and see what was booked in." },
      { type: "heading", text: "The digital calendar backup" },
      { type: "paragraph", text: "Every order also went into a digital calendar (Apple Calendar), logged on the collection/delivery date with the customer's name, delivery address, and a contact number." },
      { type: "callout", text: "Always get a contact number, no matter where the order comes in — DMs and email aren't much use when you need to reach somebody quickly." },
      { type: "heading", text: "The daily triple-check" },
      { type: "paragraph", text: "Each day I'd prepare for the day ahead by cross-checking three sources for that date: my filtered Shopify orders (where ~90% of orders came from), what was noted in the physical diary, and what was in the digital calendar." },
      { type: "callout", text: "In theory, they should all match — then I can plan what needs to be baked." },
      { type: "paragraph", text: "If there was ever a discrepancy, having three separate checkpoints meant it got caught early enough to resolve without the customer ever noticing." },
      { type: "heading", text: "One rule I never break" },
      { type: "paragraph", text: "I never wanted to take orders via personal text messages or DMs — that's where things get lost. Checking business platforms on a routine meant I always knew everybody in those messages was a customer or potential customer, without having to filter out personal conversations. If someone reaches out personally, politely redirect them to the business page. Worst case: screenshot the order and instantly email it to yourself so it doesn't get missed." }
    ]
  },
  "halloween-fall-pack": {
    hero: { key: "fall_hero", caption: "Product ideas & recipes to make this your best fall season yet — cupcakes, brownies, cookies + more." },
    blocks: [
      { type: "heading", text: "Intro" },
      { type: "paragraph", text: "As soon as September starts, we all start thinking about fall flavours and preparing for Halloween." },
      { type: "paragraph", text: "This pack is designed to give you some inspiration for the upcoming spooky season with a selection of different products you can create, either for family & friends or sell within your business." },
      { type: "paragraph", text: "I have had massive success in selling all of these products in previous years so I can't wait to share them with you!" },
      { type: "paragraph", text: "Of course, you can take these recipes and ideas and put your own spin on them — get creative & let me know what you come up with." },
      { type: "callout", text: "I would absolutely love to see it!" },
      { type: "image-row", items: [
        { key: "fall_intro_1", caption: "Halloween Loaded Brownie Slab." },
        { key: "fall_mummy", caption: "Mummified Brownies." }
      ]},
      
      { type: "heading", text: "Brownies" },
      { type: "paragraph", text: "I've got 2 options that I was torn between, so I decided to give you them both. The brownies are created with the same base recipe, it's just the decorating part that will be different." },
      { type: "heading", text: "Halloween Loaded Brownie Slab" },
      { type: "paragraph", text: "Pipe the buttercream on using a big round 1A nozzle, with 6x6 blobs of icing to cover the whole surface. Then comes the fun part, get creative!" },
      { type: "list", items: [
        "I use raspberry jam with some extra red food colouring in a piping bag to drizzle, making it look like blood.",
        "Add crushed Oreos to make it look like dirt.",
        "Add a fondant topper to say \"Happy Halloween.\"",
        "Add Halloween sweets & chocolates scattered around to give it that graveyard look.",
        "Coat pretzels with white chocolate, adding 2 eyes to make them look like ghouls."
      ]},
      { type: "image-row", items: [
        { key: "fall_brownie_1a", caption: "A finished loaded brownie slab, ready to go." },
        { key: "fall_brownie_1b", caption: "Another loaded brownie slab variation." }
      ]},
      { type: "image", key: "fall_brownie_1c", caption: "A third loaded brownie slab, decorated with gummy worms and Halloween sweets." },
      { type: "heading", text: "Mummified Brownies" },
